  const rowHTML=(m,i)=>`<tr><td>${(ed&&siteWritable(m.site))?`<select onchange="setMachField('${m._uuid}','site',this.value)"><option value=""${m.site?'':' selected'}>（未指定）</option>${siteList().map(n=>`<option${n===m.site?' selected':''}>${esc(n)}</option>`).join('')}</select>`:(m.site?esc(m.site):'<span class="muted">—</span>')}</td><td class="mono"><a class="lk" style="cursor:pointer" onclick="viewMachine('${esc(m.id)}')" title="查看此設備做過的箱">${esc(m.id)}</a></td><td>${txtCell(m,i,'line',62)}</td><td>${(m.proc||[]).map(c=>`<span class="pill dc">${stN(c)}</span>`).join(' ')}</td><td>${txtCell(m,i,'ton',70)}</td><td>${txtCell(m,i,'brand',80)}</td><td>${txtCell(m,i,'model',120)}</td><td>${txtCell(m,i,'item_ref',70)}</td><td>${m.active!==false?'<span class="pill ok">啟用</span>':'<span class="pill ng">停用</span>'}</td><td style="white-space:nowrap">${(ed&&siteWritable(m.site))?`<button class="btn ghost sm" onclick="toggleMach('${m._uuid}')">${m.active!==false?'停用':'啟用'}</button> <button class="btn gray sm" onclick="delMach('${m._uuid}')">刪除</button>`:(ed?'<span class="muted small" title="不在目前的廠區範圍內（委外廠商或其他廠區）">唯讀</span>':'<span class="muted small">唯讀</span>')}</td></tr>`;
  /* ★99-20 身分可見清單。⚠ 不可寫成 getMachines().filter(...)：i 必須是原陣列索引。
     委外廠商名下的設備 siteReadable() 會放行（使用者定案「將委外商設備也記錄」，
     而委外簡稱永遠不在任何人的 userSiteShorts() 裡 ⇒ 照一般規則過濾會對所有廠區消失）。 */
  const vis=machs.map((m,i)=>({m,i})).filter(x=>siteReadable(x.m.site));
  // 篩選：廠區 ∧ 製程（先篩再分組）
  const fset=vis.filter(x=>!pflt||(x.m.proc||[]).includes(pflt));
  // 依廠區 / 廠商分組（每組一個標題列）
  const groups={}; fset.forEach(x=>{ const k=x.m.site||'（未指定）'; (groups[k]=groups[k]||[]).push(x); });
  // 組內排序（85-2）：ton 抽數值、其他欄自然排序（CNC02 < CNC10）
  const cmp=(a,b)=>{ const k=srt.key; let va=a.m[k], vb=b.m[k];
    if(k==='proc'){ va=(va||[]).join('+'); vb=(vb||[]).join('+'); }
    if(k==='ton'){ const na=parseFloat(va), nb=parseFloat(vb);
      const xa=isNaN(na)?null:na, xb=isNaN(nb)?null:nb;
      if(xa===null&&xb===null) return 0; if(xa===null) return 1; if(xb===null) return -1; return (xa-xb)*srt.dir; }
    return ((va||'').toString()).localeCompare((vb||'').toString(),'zh-Hant',{numeric:true})*srt.dir; };
  Object.keys(groups).forEach(k=>groups[k].sort(cmp));
  const order=[...siteList()]; Object.keys(groups).forEach(k=>{ if(order.indexOf(k)<0) order.push(k); });
  const showSites=(flt?order.filter(s=>s===flt):order).filter(s=>groups[s]&&groups[s].length);
  const body=showSites.map(site=>`<tr><td colspan="10" style="background:#eef3f8;font-weight:600;color:var(--navy)">📍 ${esc(site)} <span class="muted small">（${groups[site].length} 台）</span></td></tr>`+groups[site].map(({m,i})=>rowHTML(m,i)).join('')).join('')||`<tr><td colspan="10" class="empty">${MHR_MACH_STATUS==='載入中…'?'載入中…':'無符合設備'}</td></tr>`;
  /* ★失效自動清 [[filter-cascade-clear-rule]]：先選了「大永」再切模擬到敬得觀音，
     下拉會顯示「全部廠區/廠商」但表身空白，使用者看不出是哪一層造成的。 */
  if(flt && !order.filter(s=>groups[s]&&groups[s].length).includes(flt)){ window._machSiteFilter=''; return renderMachMaster(); }
  const fltOpts='<option value="">全部廠區 / 廠商</option>'+order.filter(s=>groups[s]&&groups[s].length).map(s=>`<option value="${esc(s)}"${flt===s?' selected':''}>${esc(s)}（${groups[s].length}）</option>`).join('');
  // 依製程篩選：只列清單中實際出現過的製程（85-2）
  const procSet=[...new Set(vis.flatMap(x=>x.m.proc||[]))];
  const procOpts='<option value="">全部製程</option>'+procSet.map(c=>`<option value="${esc(c)}"${pflt===c?' selected':''}>${esc(stN(c))}（${vis.filter(x=>(x.m.proc||[]).includes(c)).length}）</option>`).join('');
  const th=(k,label)=>`<th style="cursor:pointer;white-space:nowrap" onclick="setMachSort('${k}')" title="點擊排序">${label}${srt.key===k?(srt.dir>0?' ▲':' ▼'):''}</th>`;
  /* 85-5 頁內 scoped 緊縮（照製程主檔 .pm 先例）：卡片/欄距/輸入框/列高全面壓，不影響其他頁 */
  v.innerHTML=`<style>
    .eqp .page-h{margin-bottom:6px}.eqp .page-h p{margin-top:1px}
    .eqp .card{padding:10px 12px;margin-bottom:8px}.eqp .card h3{margin-bottom:6px}

    .eqp th,.eqp td{padding:3px 6px;line-height:1.25}
    .eqp .pill{font-size:10px;padding:1px 6px}
    .eqp .btn.sm{padding:3px 9px;font-size:11px}
    .eqp .tblwrap{max-height:74vh}
  </style><div class="eqp"><div class="page-h"><h2>設備主檔 Equipment</h2><p>建箱／報工的「設備」下拉來自這裡，依製程過濾。停用的不出現在選單、但保留歷史。<b>★設備資料存雲端</b>（每台裝置看到同一份）。</p></div>
  ${ed?`<div class="card"><h3 style="cursor:pointer;user-select:none" onclick="window._machAdd=!window._machAdd;render()">${window._machAdd?'▾':'▸'} 新增設備 <span class="vi">${window._machAdd?'（直接存雲端）':'（點擊展開）'}</span></h3><div class="row" style="display:${window._machAdd?'':'none'};margin-top:10px"><div><label>設備編號</label><input id="m_id" placeholder="如 DC05"></div><div><label>線別（選填）</label><input id="m_line" placeholder="如 D01" style="width:90px"></div><div><label>屬製程</label><select id="m_proc">${stOpts}</select></div><div><label>噸數（壓鑄填）</label><input id="m_ton" placeholder="如 320T" style="width:100px"></div><div><label>廠牌</label><input id="m_brand" placeholder="如 LK" style="width:100px"></div><div><label>型號</label><input id="m_model" placeholder="選填" style="width:130px"></div><div><label>對應料號</label><input id="m_item" placeholder="選填" style="width:90px"></div><div><label>廠商 / 廠區</label><select id="m_site">${siteOpts(oneSite())}</select></div><div><button class="btn" onclick="addMach()">＋新增</button></div></div></div>`:''}
  <div class="card"><h3>設備清單（${vis.length}）<span class="vi">${esc(vis.length!==machs.length?('已載入 '+vis.length+' 台'):MHR_MACH_STATUS)}　<a class="lk" onclick="loadMachines().then(render)">重新載入</a></span></h3>
    <div class="row" style="margin:0 0 6px"><div style="min-width:220px"><label>依廠區 / 廠商檢視</label><select id="mach_flt" onchange="setMachFilter(this.value)">${fltOpts}</select></div>

/* ★99-20 拆索引引信：原本 getMachines()[i] 取「未過濾原陣列」的第 i 筆。
   一旦設備清單依廠區過濾，i 就對不上 ⇒ 在敬得那一列改噸數、實際 PATCH 到別廠那台，
   而且 DB 真的寫進去、不會報錯（最難察覺的一種）。改吃 _uuid＝DB 主鍵。 */
async function setMachField(uu,field,val){
  const m=getMachines().find(x=>x._uuid===uu); if(!m||!m._uuid) return;
  /* ★99-21（0r）擋下後要重繪（使用者 260814 回歸 §13-2b 實測）：原本兩道守門都是直接 return，
     render() 只在成功路徑（下面 if(field==="site") render()）⇒ 被擋下時**畫面上的值停在使用者剛改的那個**，

async function saveMold(){ const em=(typeof window._editMold==='string')?window._editMold:''; if(!em) return; const m=getMolds(); const cur=m.find(x=>x._uuid===em); if(!cur||!cur._uuid) return; const id=$('#md_id').value.trim(), pn=$('#md_pn').value, kind=($('#md_kind')&&$('#md_kind').value)||'mold', site=($('#md_site')&&$('#md_site').value)||'', plant=(($('#md_plant')||{}).value)||'', cav=+(($('#md_cav')||{}).value)||0, stations=readChecks('md_stations'); if(!id) return toast('請輸入模號','err'); if(m.some(x=>x._uuid!==em&&x.id===id&&(x.partNo||'')===pn)) return toast('已存在相同模號+機種','err');

/* 共通輸入下拉：班別 / 機台(依製程) / 作業員(優先 OMS 人員，無則 MASTER) */
/* ★89 班別改 A/B/C（使用者定案：日夜會輪，不寫死白班/夜班；與工牌名單 shift_code 一致） */
const SHIFTS=['A','B','C'];
function shiftOpts(sel){ return '<option value="">（選班別）</option>'+SHIFTS.map(s=>`<option value="${s}"${s===sel?' selected':''}>${s} 班</option>`).join(''); }
function shiftCode(n){ n=(n||'').trim().toUpperCase(); if(/^[ABC]/.test(n)) return n.slice(0,1);
  if(/[夜晚]/.test(n)) return 'B'; if(/[早日白]/.test(n)) return 'A'; return (n.slice(0,1)||'A'); }
/* 批號自動產生：機種_YYMMDD_班別_機台_批序；同(機種+日期+班+機台)沿用同批＝一批多箱 */
/* ★93 批號流水修正：同機台+同日+同班「且同料號」＝同一批（沿用）；
   換了料號（例如換模）＝新的一批，流水號遞增 _02、_03…
   （原本只比對前綴，導致換料號後仍沿用同批號，追查時分不出來） */
/* ★94 pdate＝生產日期（YYYY-MM-DD）；補登舊 WIP 時用實際生產日，不填＝今天 */
function genLot(model,machine,shift,partNo,pdate){
  const ymd=pdate? String(pdate).replace(/-/g,'').slice(2) : todayYMD();
  const base=String(model||'NA').replace(/\s+/g,'')+'_'+ymd+'_'+shiftCode(shift)+'_'+String(machine||'').replace(/[^A-Za-z0-9]/g,'')+'_';
  const sameBase=db.data.containers.filter(c=>c.lot&&c.lot.indexOf(base)===0);
  if(partNo){
    const same=sameBase.find(c=>c.partNo===partNo);
    if(same) return same.lot;                       // 同料號 → 沿用原批號
    const used=new Set(sameBase.map(c=>c.lot));     // 換料號 → 找下一個沒用過的流水
    for(let n=1;n<=99;n++){ const cand=base+String(n).padStart(2,'0'); if(!used.has(cand)) return cand; }
    return base+'99';
  }
  if(sameBase.length) return sameBase[0].lot;
  return base+'01'; }
function machineOpts(code,sel){ const list=machinesFor(code);
  const opt=m=>`<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(m.id)}${m.line?' · '+esc(m.line):''}</option>`;
  const by={}; list.forEach(m=>{ const k=m.site||'（未指定）'; (by[k]=by[k]||[]).push(m); });
  const ks=Object.keys(by);
  if(ks.length<=1) return '<option value="">（請選設備 ＊）</option>'+list.map(opt).join('');
  /* ★85-4 跨廠區（admin）時依廠區分組，一眼分清不選錯 */
  return '<option value="">（請選設備 ＊）</option>'+ks.map(k=>`<optgroup label="${esc(k)}">`+by[k].map(opt).join('')+'</optgroup>').join(''); }
/* 3a-1 現場人員名單：優先「工牌名單」mhr_operators（依職能過濾、停用不列），其次 OMS 名單，最後 MASTER。

/* ★89 三層過濾（使用者定案）：製程 → 班別 → 組別(線別)，層層縮小作業員清單。
   shift/team 為選填篩選：沒選＝不限；選了＝只留該班/該組的人（大永 139 人點選太長的解法）。 */
/* ★96-6③ 人機同廠：機台.site 存「簡稱」（廠商主檔 short，如 大永）、工牌歸屬 opBelongOf 回「代碼」（如 SDY）

function siteCodeOfShort(short){ const s=short?getSites().find(x=>x.short===short):null; return (s&&s.code)||''; }
/* ★99-46 反查（既有只有 short→code）：ERP 工單帶的是組織碼（850 等），要換成廠區簡稱才存得進 orders.site */
function siteShortOfCode(code){ const s=code?getSites().find(x=>x.code===code&&x.kind!=='out'):null; return (s&&s.short)||''; }
function machineSiteCode(id){ const m=id?getMachines().find(x=>x.id===id):null; return m?siteCodeOfShort(m.site||''):''; }
function opsByFunc(fn,code,shift,team,site){ const cs=code?(code||'').split('+'):null;
  return (MHR_OPS||[]).filter(o=>o.active!==false
    &&(!fn||(o.functions||[]).includes(fn))
    &&(!cs||!(o.procs||[]).length||cs.some(c=>(o.procs||[]).includes(c)))
    &&(!shift||(o.shift_code||'')===shift)
    &&(!team||(o.team||'')===team)

function teamsFor(code,shift){ const cs=code?(code||'').split('+'):null;

  ).map(o=>o.team).filter(Boolean))].sort(); }
function prodOpsList(code,shift,team,site){
  if(shift||team){ const f=opsByFunc('生產',code,shift,team,site); if(f.length) return f;
    const f2=opsByFunc('',code,shift,team,site); if(f2.length) return f2; }

    ${(c.kind==='NR'||c.kind==='NG')?(()=>{ const ids=[...new Set((c.sources||[]).map(s=>s&&s.cid).filter(Boolean))];

/* 把 root 內所有 .qrbox[data-cid] 補上 QR（無 lib 時退化成箱號 badge） */
function fillQRs(root){ (root||document).querySelectorAll('.qrbox[data-cid]').forEach(box=>{ const cid=box.getAttribute('data-cid'); const c=findC(cid)||{cid,partNo:'',qty:''}; box.innerHTML='';
  const payload=c.cid;   /* ★88-7 QR 內容改純箱號（與 Code128 一致：掃碼＝把箱號打進輸入框，資料查系統） */
  if(window.QRCode){ try{ new QRCode(box,{text:payload,width:104,height:104,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ box.innerHTML=`<div class="badge">${esc(c.cid)}</div>`; } } else box.innerHTML=`<div class="badge">${esc(c.cid)}</div>`; }); }
function showLabel(c){ const a=$('#labelArea'); if(!a) return; a.innerHTML=lblCardHTML(c)+`<div style="margin-top:10px"><button class="btn navy sm" onclick="printLabels(['${esc(c.cid)}'])">🖨 列印標籤</button></div>`; fillQRs(a); }
/* ★★99-37（缺陷C）標籤序號只在「同類箱」之間編——這是修我自己在 99-35 改出來的 regression。
   ⚠ 出了什麼事：96-1 的 `N/M` 語意是「**這批良品**分成 M 箱，這是第 N 箱」。
     99-35 把 NR/NG 一起加進列印清單後，`cids.length` 從「良品箱數」變成「本次列印張數」
     ⇒ 只產 1 箱良品 ＋1 箱 NR ＋1 箱 NG 時，良品標籤上會印「1/3」。
     **現場看到 1/3 會去找另外兩箱良品，但根本不存在。** 這比沒有序號還糟。
   ⇒ 依 kind 分組（OK／NR／NG）各自編號；組內只有一箱就不印序號（單箱不需要 1/1）。
   ⚠ 收斂成單一函式：showLabels 與 printLabels 兩邊都要用，
     分頭各寫一份就是「資料 DRY、渲染 WET」，改一邊漏一邊（既有教訓）。 */
function labelCaps(cids){
  const caps={}, grp={};
  (cids||[]).forEach(cid=>{ const c=findC(cid); if(!c) return;
    const k=isDefect(c)?c.kind:'OK'; (grp[k]=grp[k]||[]).push(cid); });
  Object.keys(grp).forEach(k=>{ const a=grp[k];
    a.forEach((cid,i)=>{ caps[cid]=a.length>1?((i+1)+'/'+a.length):''; }); });
  return caps;
}
/* ★85-10 多箱標籤（建箱分箱用）：全部排出＋一鍵連印（每張帶「第 N / M 箱」） */
function showLabels(cids){ cids=(cids||[]).filter(Boolean); if(!cids.length) return; const a=$('#labelArea'); if(!a) return;
  const caps=labelCaps(cids);
  const cards=cids.map(cid=>{ const c=findC(cid); return c?lblCardHTML(c,{cap:caps[cid]||''}):''; }).join('');
  a.innerHTML=cards+`<div style="margin-top:10px"><button class="btn navy sm" onclick="printLabels([${cids.map(c=>`'${esc(c)}'`).join(',')}])">🖨 列印${cids.length>1?('全部 '+cids.length+' 張'):''}標籤</button></div>`; fillQRs(a); }
/* 列印多張標籤：開列印浮層、補 QR，按「列印」走 window.print（@media print 只留標籤） */
function printLabels(cids){ cids=(cids||[]).filter(Boolean); if(!cids.length) return toast('無可列印標籤','err');
  let ov=$('#printOverlay'); if(!ov){ ov=document.createElement('div'); ov.id='printOverlay'; document.body.appendChild(ov); }
  /* 84-1 浮層抵銷 body zoom（zoom 是相乘的：1/z × z = 1）→ 螢幕預覽＝實際 80×60，不再超出視窗 */
  try{ const z=parseFloat(document.body.style.zoom)||1; ov.style.zoom=String(1/z); }catch(e){}
  const caps=labelCaps(cids);   /* ★99-37（缺陷C）與 showLabels 共用同一支：螢幕看到什麼、印出來就是什麼 */
  const cards=cids.map(cid=>{ const c=findC(cid); return c?lblCardHTML(c,{cap:caps[cid]||''}):''; }).join('');
  ov.innerHTML=`<div class="po-bar"><b>列印標籤（${cids.length} 張）</b><span><button class="btn navy sm" onclick="window.print()">🖨 列印</button> <button class="btn gray sm" onclick="closePrint()">關閉</button></span></div><div class="po-labels">${cards}</div>`;
  ov.style.display='block'; document.body.classList.add('printing'); fillQRs(ov);
}
function closePrint(){ const ov=$('#printOverlay'); if(ov){ ov.style.display='none'; ov.innerHTML=''; } document.body.classList.remove('printing'); }

/* ---------- 03 接收點交（3a-2：A 嚴格——後站物控掃箱＝移轉完成） ----------
   點交＝責任分界：掃箱那一刻＝前站轉出＋後站接收。不產新箱、不動批號；帳差時箱數量改為實收。
   委外站（下一站已勾委外）＝「轉出」點交（對面沒有系統操作者，由本廠物控補掃）；回廠不點交（量由委外報工記）。

window._rv=[];

/* ★97-10 合併案（使用者定案）：🅐物控接收＋🅑點交合併成「一次清點移轉」。

   ①質控剛產出的新箱（原本要先走🅐）②97 前的舊箱（原本直接走🅑）③末站成品箱（只入庫不移轉）
   → 舊箱不再需要另外的移轉管道，切換日的 269 箱自然接得上。 */
function rvPending(){ return db.data.containers.filter(c=>isNormalBox(c)&&boxScopeReadable(c)&&remaining(c.cid)>0&&!isReceived(c)
  &&(nextStation(c.partNo,c.processCode)||needStockin(c))); }   /* ★99-47 廠區過濾 */
/* ═══ ★97 🅐 物控接收（stockin）：每站質控產箱後，物控掃箱清點→入暫存區（質控→物控） ═══
   範圍＝97 起質控產的箱（pid 非空）；舊箱（pid 空）視同已入庫＝零遷移。
   未入庫：後站不能點交、不能委外轉出（rvAdd 擋）。帳差＝箱量改實收＋責任歸屬（質控段/物控段）。 */
window._sk=[];
function needStockin(c){ return !!(c&&c.pid&&!c.stockin&&isNormalBox(c)); }   /* 正常箱限定：NR/NG 走會判、作廢不計 */

function skAdd(cid0){
  const inp=$('#sk_cid'); const cid=(cid0||(inp?inp.value:'')||'').trim().toUpperCase(); if(!cid) return;

async function vbDone(){ if(wGuard('receive','e',undefined,'委外回廠點收')) return;
  if(!window._vb.length) return toast('請先掃箱','err');
  for(let i=0;i<window._vb.length;i++){ const a=+(($('#vb_a'+i)||{}).value||0); if(!(a>=0)) return toast(window._vb[i]+' 實回數不正確','err'); }
  /* ★99-22（backlog 0e）結案且有帳差 → 廠商送貨單號必填（比照 98-12 委外轉出必選廠商）。
     【問題】畫面自己寫「短少＝開立扣款單的依據」，但送貨單號留空照樣送得出去 ⇒ 帳差記錄與 CSV 的
       備註只剩「（本批結案短少）」，**沒有憑證可對帳、扣款單開不出來**。260814 回歸第 2 批
       （CN26081400001 27→25，短少 −2）就是留空照樣送出。委外天天在跑，這是會出錢的欄位。
     【擋的範圍】只擋「**結案且認列了帳差**」那一種：
       ・分批回廠（未勾結案）acDiff 恆為 0 → 不擋（本來就不是短少，也還沒要對帳）
       ・結案但數量剛好（acDiff===0）→ 不擋（沒有帳差就沒有扣款）
       ・★超交（acDiff>0）也擋 —— 它同樣產生一筆認列到廠商的帳差記錄，畫面寫明「可與先前短交沖銷」，
         沖銷一樣要憑單號；而且超交是廠商真的送料回來，實體上一定有送貨單。
     ⚠⚠ **一定要擋在任何寫入之前**（獨立前置迴圈）：下面那個迴圈會改 c.writeOff、push 待驗單與帳差記錄，
        中途 return 會留下改了一半的記憶體狀態，使用者再按一次就重複累加。 */
  for(let i=0;i<window._vb.length;i++){
    const cid=window._vb[i]; const c=findC(cid); if(!c) continue;
    const expect=remaining(cid), actual=+(($('#vb_a'+i)||{}).value||0), diff=actual-expect;
    const fin=!!(($('#vb_f'+i)||{}).checked);
    const acDiff=(!fin&&diff<0)?0:diff;                       /* 與下方主迴圈同一條算式 */
    if(acDiff!==0 && !((($('#vb_dn'+i)||{}).value)||'').trim())
      return toast(cid+'：本批結案且有'+(acDiff<0?'短少 '+(-acDiff):'超交 +'+acDiff)
        +' pcs → 廠商送貨單號必填（那是開立扣款單／沖銷的憑證）。'
        +'（若廠商還會再送回，請改成不勾「本批結案」＝分批回廠，就不會記成短少）','err');
  }
  const by=sessionName()||'—'; const at=nowISO(); let nDiff=0,nPart=0,qDiff=0; const pids=[];
  for(let i=0;i<window._vb.length;i++){
    const cid=window._vb[i]; const c=findC(cid); if(!c) continue;
    const st=(c.received||{}).station; const vendor=(c.received||{}).vendor||'';
    const expect=remaining(cid); const actual=+(($('#vb_a'+i)||{}).value||0); const diff=actual-expect;
    const dn=((($('#vb_dn'+i)||{}).value)||'').trim();
    const fin=!!(($('#vb_f'+i)||{}).checked);
    /* ★98-8 分批回廠：未結案且回得比應回少 → 只領實回量，剩的留在委外站等下批，不算短少 */
    const partial=(!fin&&diff<0);
    /* ★98-11 領用量一律只領「實際回來的量」（超交以應回為上限）——draws 要跟之後質控產出的量對得起來，
       否則多出來的餘量在質控結案後分不掉、會讓來源箱結存復活（98-10 的 bug，見 remaining() 註解）。 */
    const take=Math.min(actual,expect);
    const acDiff=partial?0:diff;                   // 認列的帳差（分批回廠不記）
    /* ★98-11 結案短少＝這批料真的回不來了 → 核銷掉，不再掛在委外站當「待投產」 */
    const shortClose=(fin&&diff<0)?(expect-actual):0;
    if(shortClose>0) c.writeOff=(+c.writeOff||0)+shortClose;
    if(acDiff!==0){ nDiff++; qDiff+=acDiff; } if(partial) nPart++;
    /* ★98-11 實回 0（純短少結案）不開待驗單——沒有料回來就沒有東西要質控，
       98-10 會開出一張「生產數 0」的待驗單卡在 Q 質控檢驗清單裡。 */
    if(actual>0){
      const slip={pid:await nextPID(st),partNo:c.partNo,name:c.name,lot:c.lot,orderNo:c.orderNo,
        processCode:st,qtyProd:actual,operator:'',machine:'',shift:'',team:'',mold:'',cavity:'',jigs:[],
        draws:[{cid,take}],pdate:null,status:'pending',qc:'',qmsNo:'',boxCids:[],
        vendor,vendorDn:dn,vendorDiff:acDiff,vendorPartial:partial||undefined,fromStation:c.processCode,createdAt:at};
      db.data.pending.push(slip); pids.push(slip.pid);
    }
    /* 帳差事件（短少/超交）＝扣款依據，認列單位＝廠商 */
    if(acDiff!==0) db.data.reports.push({id:'V'+Date.now()+i,type:'handover',kind:'vendorReturn',cid,
      partNo:c.partNo,lot:c.lot,orderNo:c.orderNo,fromStation:st,toStation:st,
      expect,actual,diff:acDiff,resp:vendor,vendor,vendorDn:dn,
      note:(dn?('送貨單 '+dn+'　'):'')+(acDiff>0?'（超交）':'（本批結案短少）'),by,createdAt:at});
  }
  db.save();
  toast('委外回廠點收 '+window._vb.length+' 箱'+(pids.length?' → 已產生待驗單 '+pids.join('、'):'（實回 0，未開待驗單）')
    +(nPart?'・分批回廠 '+nPart+' 箱（剩餘留在委外站）':'')
    +(nDiff?'・帳差 '+nDiff+' 箱（合計 '+(qDiff>0?'+':'')+qDiff+' pcs）':''),'ok');
  window._vb=[];window._vbS={}; render();
}
/* ★98-3 待清點清單的工單/批號改「可打字組合框」（原本純關鍵字，271 箱時要先知道單號才打得出來）。

  const wo=((($('#rvf_wo')||{}).value)||'').trim().toLowerCase();
  const lt=((($('#rvf_lot')||{}).value)||'').trim().toLowerCase();
  const dt=((($('#rvf_date')||{}).value)||'');
  const base=rvPending().filter(c=>(!pr||c.processCode===pr)
    &&(kind==='wo'||!wo||String(c.orderNo||'').toLowerCase().includes(wo))
    &&(kind==='lot'||!lt||String(c.lot||'').toLowerCase().includes(lt))
    &&(!dt||prodDayOf(c.createdAt)===dt));
  const vals=base.map(c=>kind==='wo'?(c.orderNo||''):(c.lot||''));
  return [...new Set(vals.filter(Boolean))].sort().map(v=>({v,t:v}));
}

function rvDone(){ if(wGuard('receive','e',undefined,'清點移轉')) return;
  if(!window._rv.length) return toast('請先掃箱','err');
  for(let i=0;i<window._rv.length;i++){ const a=+(($('#rv_a'+i)||{}).value||0); if(!(a>=0)) return toast(window._rv[i]+' 實收數不正確','err'); }
  /* ★98-12 委外轉出＝廠商必填（使用者定案）。BOM 上勾「委外」只說明這一站要外發，不說發給誰；
     「發給誰」來自廠商主檔，而且就是短交／超交要認列與開扣款單的對象 → 空白不得放行。
     原本沒擋：清單空或沒選就靜靜存成 ''，事後帳差的認列單位是空白、扣款單開不出來
     （260805 實查 VB2607290002 就是這樣，07-27 轉出時 vendor 存成空字串）。
     ⚠ 一定要擋在任何寫入之前——rvDone 後面的迴圈會直接改 c.qty/c.stockin。 */
  for(let i=0;i<window._rv.length;i++){ const c=findC(window._rv[i]); if(!c) continue;
    const nx=nextStation(c.partNo,c.processCode); if(!nx||!isOS(c.partNo,nx)) continue;
    if(!((($('#rv_v'+i)||{}).value)||'').trim())
      return toast(window._rv[i]+'：委外轉出必須選「委外廠商」'
        +(vendorListFor(nx).length?'':'——廠商主檔沒有可做「'+stN(nx)+'」的委外廠商，請先去建立或勾選可做製程'),'err');
  }
  const by=sessionName()||'—'; const at=nowISO(); let nOut=0,nDiff=0,nEnd=0;
  window._rv.forEach((cid,i)=>{ const c=findC(cid); const nx=nextStation(c.partNo,c.processCode); const os=isOS(c.partNo,nx);
    const expect=c.qty; const actual=+(($('#rv_a'+i)||{}).value||0); const diff=actual-expect;
    const resp=diff!==0?((($('#rv_rs'+i)||{}).value)||'生產'):''; const note=((($('#rv_n'+i)||{}).value)||'').trim();
    if(os) nOut++; if(diff!==0){ nDiff++; c.qty=actual; }   // 帳差：箱數量改為實收（下游走實數），應收/差額固化在記錄
    /* ★98 合併：清點與移轉一次寫完 —— stockin＝清點事實（帳差/認列單位固化在這），received＝已到下一站。
       箱不會再停在「已清點未移轉」的中間狀態，所以 07/08 既有顯示邏輯完全不用改。 */
    c.stockin={by,at,expect,actual,diff,resp};
    /* ★97-9 委外轉出記「對方簽收人」。signedBySelf=false＝我方代記（乙案）；
       日後若改成委外廠商自己登入簽收（甲案），同一筆記錄只把這旗標改 true，資料模型不用重做。 */
    const vsg=os?(((($('#rv_sg'+i)||{}).value)||'').trim()):'';   /* ★98-13 組合框＝自由輸入，去頭尾空白 */
    /* ★98 末站（無下一站）＝只清點入庫、不移轉；有下一站才寫 received */
    if(nx){
      c.received={station:nx,by,at,expect,actual,diff,resp,note,kind:os?'sendout':'receive',

      fromStation:c.processCode,toStation:nx||c.processCode,expect,actual,diff,resp,note,by,

/* ===== 84-11 全頁掃碼攔截（keyboard wedge）：保證掃描槍資料一定被系統接收 =====
   掃描槍＝高速鍵盤（字元間隔極短＋結尾 Enter）。若焦點不在任何輸入框，掃出的字元原本會流失；
   這裡在 接收點交／過站報工 兩頁全頁監聽：偵測高速字串+Enter → 自動導入箱號欄並觸發加入/帶出。
   焦點在輸入框內時不攔截（照常打字/原生 Enter 流程）。 */
let _scanBuf='',_scanT=0;
document.addEventListener('keydown',function(e){
  try{
    const ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return;   // 欄位內＝原生流程
    if(typeof cur==='undefined'||(cur!=='receive'&&cur!=='report')) return;
    const now=Date.now(); if(now-_scanT>80) _scanBuf=''; _scanT=now;   // 字元間隔>80ms＝人手打字，重置
    if(e.key==='Enter'){
      if(_scanBuf.length>=6){ const code=_scanBuf; _scanBuf='';
        if(cur==='receive'){ const i=$('#rv_cid'); if(i){ i.value=code; rvAdd(); } }
        /* ★99-11 03 掃碼一律走 rvAdd()。原本是 97 兩段式的分流「待入庫→🅐、其餘→🅑」，
           但 98 已把 🅐/🅑 合併成一個動作、🅐 卡片改成 display:none，這個分流器沒跟著更新
           ⇒ 質控剛產出的箱（needStockin 恆為 true）被送進隱藏的 skAdd()，
             而 skAdd() 成功時不 toast、只渲染進隱藏區 ＝ **現場拿掃描槍掃了完全沒反應**。
           ⚠ rvAdd() 本來就收得下這種箱：97-10 合併時已把「先🅐再🅑」的 gate 拿掉
             （`if(!nx&&!needStockin(c))` 才擋），而且每條拒絕路徑都有 toast，不會再靜默。 */
        else { repScanAdd(code); }   /* ★97-2 過站打單：掃箱＝直接選取 */
        e.preventDefault(); }
      return; }
    if(e.key&&e.key.length===1) _scanBuf+=e.key;
  }catch(err){}
});

  <div id="r_form"></div>
  <div id="r_result"></div>`;
  window._draws=[]; renderDraws();
}
// 下一站「目前在站堆積」：製程站＝nx 且仍有結存的箱（＝已停在該站、尚未轉出/出貨的量），全機種
function nextBacklog(nx){ let q=0,n=0; db.data.containers.forEach(x=>{ if(!isNormalBox(x)) return; if(x.processCode!==nx) return; const r=remaining(x.cid); if(r>0){ q+=r; n++; } }); return {q,n}; }
function backlogBoxes(nx){ return db.data.containers.filter(x=>isNormalBox(x)&&x.processCode===nx&&remaining(x.cid)>0).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))); }
// 在站堆積明細：列出目前停在 nx 站的每一箱（全機種），點箱可追溯
function showBacklog(nx){ const el=$('#r_backlog'); if(!el||!nx) return;
  const list=backlogBoxes(nx); const q=list.reduce((a,x)=>a+remaining(x.cid),0);
  el.innerHTML=`<div class="note" style="margin:0 0 6px">下一站「${stN(nx)}」目前在站堆積：共 <b>${list.length}</b> 箱、<b style="color:#b9760f">${q}</b> pcs（已停在該站、尚未轉出/出貨；點箱可追溯）<a class="lk small" style="float:right;cursor:pointer" onclick="$('#r_backlog').style.display='none'">收合</a></div>
   ${list.length?`<table><thead><tr><th>箱號</th><th>機種</th><th>批號</th><th>結存</th><th>狀態</th><th>時間</th></tr></thead><tbody>
   ${list.map(x=>{ const fin=isFinished(x); const nx2=nextStation(x.partNo,x.processCode); return `<tr style="cursor:pointer" onclick="traceBox('${x.cid}')"><td><span class="badge">${esc(x.cid)}</span>${x.pack==='carton'?' <span class="pill" style="background:#eef;color:#3355aa;font-size:10px">紙箱</span>':''}${x.workType==='rework'?' <span class="pill" style="background:#efe9fb;color:#7a4dd0;font-size:10px">重工</span>':''}</td><td>${esc((prodOf(x.partNo)||{}).model||x.partNo)}</td><td class="mono small">${esc(x.lot||'-')}</td><td><b style="color:var(--teal)">${remaining(x.cid)}</b></td><td class="small">${fin?'<span class="pill ok">待出貨</span>':'→ 待轉 '+stN(nx2)}</td><td class="small muted">${esc(localDT(x.createdAt))}</td></tr>`; }).join('')}
   </tbody></table>`:'<div class="empty">該站目前無在站堆積</div>'}`;
  el.style.display='block';
}
function toggleBacklog(nx){ const el=$('#r_backlog'); if(!el) return; if(el.style.display==='none'||!el.innerHTML){ showBacklog(nx); } else { el.style.display='none'; } }
function loadInfo(){
  const cid=$('#r_cid').value.trim().toUpperCase(); const c=findC(cid); const el=$('#r_info'); if(!cid){ el.innerHTML=''; return; }
  if(!c){ el.innerHTML=`<div class="note" style="border-color:var(--red);background:var(--redbg)">找不到箱號 ${esc(cid)}</div>`; return; }

    <div style="font-size:18px;font-weight:700;line-height:1.25;color:#b9760f"><b>${b.q}</b> <span class="small muted" style="font-weight:400">pcs ｜ ${b.n} 箱</span></div></div>`; }
  el.innerHTML=`<div style="background:#f7fafc;border:1px solid #e3e9f0;border-left:4px solid var(--navy);border-radius:10px;padding:12px 14px">

      <span class="badge">${esc(cid)}</span>${c.workType==='rework'?'<span class="pill" style="background:#efe9fb;color:#7a4dd0;font-size:10px">重工</span>':''}
      <span style="font-weight:600">${pnCell(c.partNo)}</span>

/* 查找箱號：列出可領用的在庫來源箱（有結存且有下一站；已開始領料則鎖同機種同製程），點選帶入領料 */
function eligibleSrc(){
  let list=db.data.containers.filter(c=>isNormalBox(c) && remaining(c.cid)>0 && nextStation(c.partNo,c.processCode) && canDraw(c));   // 3a-2 A嚴格：只列已接收
  if(window._draws.length){ const f=findC(window._draws[0].cid); if(f) list=list.filter(c=>c.partNo===f.partNo&&c.processCode===f.processCode); }
  return list.sort((a,b)=>String(a.processCode).localeCompare(String(b.processCode))||String(a.cid).localeCompare(String(b.cid)));
}
function toggleFinder(){ const el=$('#r_finder'); if(!el) return;
  if(el.style.display==='none'){ el.style.display='block';
    const lock=window._draws.length?`<div class="muted small" style="margin:2px 0 6px">已鎖定機種／製程：僅列同批可併領的箱</div>`:'';
    el.innerHTML=`<div class="card" style="background:#f7fafc">
      <div class="row"><div style="flex:1"><input id="r_find_kw" placeholder="搜尋 箱號 / 機種 / 品名 / 批號" oninput="filterFinder()"></div><button class="btn gray sm" onclick="toggleFinder()">關閉</button></div>
      ${lock}<div id="r_find_list" style="margin-top:6px"></div></div>`;
    filterFinder(); const f=$('#r_find_kw'); if(f) f.focus();
  } else { el.style.display='none'; }
}
function filterFinder(){ const box=$('#r_find_list'); if(!box) return;
  const kw=((($('#r_find_kw')||{}).value)||'').trim().toLowerCase();
  let list=eligibleSrc();
  if(kw) list=list.filter(c=>[(c.cid||''),(c.partNo||''),pnNm(c.partNo)||'',(c.lot||'')].some(x=>String(x).toLowerCase().includes(kw)));
  if(!list.length){ box.innerHTML='<div class="empty">沒有可領用的在庫來源箱</div>'; return; }
  box.innerHTML=`<table><thead><tr><th>箱號</th><th>機種 / 料號</th><th>批號</th><th>目前站</th><th>剩可領</th><th>下一站</th></tr></thead><tbody>${list.map(c=>{ const already=window._draws.filter(d=>d.cid===c.cid).reduce((a,d)=>a+d.take,0); const rem=remaining(c.cid)-already; const nx=nextStation(c.partNo,c.processCode); return `<tr style="cursor:pointer" onclick="pickSrc('${c.cid}')"><td><span class="badge">${esc(c.cid)}</span>${c.workType==='rework'?` <span class="pill" style="background:#efe9fb;color:#7a4dd0;font-size:10px">重工</span>`:''}</td><td>${pnCell(c.partNo)}</td><td class="mono small">${esc(c.lot||'-')}</td><td><span class="pill dc">${stN(c.processCode)}</span></td><td><b style="color:var(--teal)">${rem}</b></td><td class="small">→ ${stN(nx)}</td></tr>`; }).join('')}</tbody></table>`;
}
function pickSrc(cid){ const c=findC(cid); if(!c) return; $('#r_cid').value=cid; const already=window._draws.filter(d=>d.cid===cid).reduce((a,d)=>a+d.take,0); const rem=remaining(cid)-already; if(rem>0&&!(+$('#r_take').value)) $('#r_take').value=rem; loadInfo(); const fn=$('#r_finder'); if(fn) fn.style.display='none'; }
function addDraw(){
  const cid=$('#r_cid').value.trim().toUpperCase(); const take=+$('#r_take').value||0; const c=findC(cid);
  if(!c) return toast('找不到箱號','err');
  const nx=nextStation(c.partNo,c.processCode); if(!nx) return toast('此箱已在末站，無下一站','err');
  if(!canDraw(c)) return toast('此箱尚未移轉到本站——先到「03 清點移轉」掃箱完成物控清點，才能投入打單','err');   /* ★98-21 用詞更新：98 已把 🅐接收＋🅑點交合併成一個動作 */
  if(window._draws.length){ const f=findC(window._draws[0].cid);
    if(f.partNo!==c.partNo) return toast('同一次報工的來源箱需同機種','err');
    if(f.processCode!==c.processCode) return toast('同一次報工的來源箱需同製程站','err'); }
  const already=window._draws.filter(d=>d.cid===cid).reduce((a,d)=>a+d.take,0);
  const rem=remaining(cid)-already;
  if(take<=0) return toast('請輸入領用數','err');
  if(take>rem) return toast(`超過剩餘可領（剩 ${rem}）`,'err');
  const ex=window._draws.find(d=>d.cid===cid); if(ex) ex.take+=take; else window._draws.push({cid,take});
  $('#r_cid').value=''; $('#r_take').value=''; $('#r_info').innerHTML=''; renderDraws();
}
function rmDraw(cid){ window._draws=window._draws.filter(d=>d.cid!==cid); renderDraws(); }
function renderDraws(){
  const wrap=$('#r_draws'); const form=$('#r_form');
  if(!window._draws.length){ wrap.innerHTML='<span class="muted small">尚未加入來源箱（先在 ① 選箱、這裡填領用數加入）</span>';
    const bl=$('#r_backlog'); if(bl){ bl.style.display='none'; bl.innerHTML=''; }
    form.innerHTML=`<div class="card"><h3>${L('③ 轉出（完工報工）')}</h3><div class="empty">先在 ② 轉入領料後，這裡會出現完工欄位（OK / NR / NG → 下一站、設備、作業員）。</div></div>`; return; }
  const total=window._draws.reduce((a,d)=>a+d.take,0);
  const first=findC(window._draws[0].cid); const nx=nextStation(first.partNo,first.processCode);
  wrap.innerHTML=`<table><thead><tr><th>${L('來源箱')}</th><th>${L('本次領用')}</th><th></th></tr></thead><tbody>
    ${window._draws.map(d=>`<tr><td><span class="badge">${esc(d.cid)}</span></td><td>${d.take} pcs</td><td><button class="btn gray sm" onclick="rmDraw('${d.cid}')">${L('移除')}</button></td></tr>`).join('')}
    <tr><td><b>合計領料</b></td><td><b>${total}</b> pcs</td><td></td></tr></tbody></table>`;
  showBacklog(nx);   // 領料後下方自動呈現「待進下一站」全機種明細（標出已領）
  /* ★97 併箱（產出去向）移「質控檢驗」頁 */
  const os=isOS(first.partNo,nx);
  const macs=machinesFor(nx);
  const macOpts=`<option value="">— 選擇設備 —</option>`+macs.map(m=>`<option value="${esc(m.id)}">${esc(m.id)}${m.site?' · '+esc(m.site):''}</option>`).join('');
  window._repNextCode=nx;   /* ★89 記住目標站，供班別/組別連動 */
  const opOpts=operatorOpts(lastOp(),nx);   /* ★85-9 按目標站過濾 */
  const vdOpts=vendorListFor(nx).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  form.innerHTML=`<div class="card"><h3>${L('③ 過站打單（產出）')} → ${stN(nx)}${os?' · '+Lt('委外'):''}</h3>
    ${stageNo(first.partNo,nx)?`<div class="step">下一站階段料號：<span class="mono">${esc(stageNo(first.partNo,nx))}</span></div>`:''}
    <div class="grid g3">
      <div><label>${L('產出數（＝領料合計）')} <span style="color:var(--red)">*</span></label><input id="o_ok" type="number" value="${total}"></div>${''/* ★97 OK/NR/NG、每箱裝入、產出去向 → 移質控檢驗頁 */}
      <div><label>班別 <span class="vi">（縮小作業員清單）</span></label><select id="o_shift" onchange="onRepFilter()">${shiftOpts('')}</select></div>
      <div><label>組別(線別)</label><select id="o_team" onchange="onRepFilter()" data-shift="">${teamOpts(nx,'','')}</select></div>
      <div><label>${L('作業員')} <span class="small muted">點選或掃工牌</span></label>
        <div class="row" style="gap:6px"><select id="o_op" style="flex:1" onchange="opBig('o_op','o_opbig')">${opOpts}</select><button class="btn ghost sm" onclick="scanPick('o_op','operator')">${L('📷掃碼')}</button></div>
        <div id="o_opbig" style="display:none;font-size:19px;font-weight:800;color:var(--navy);margin-top:3px"></div></div>
      ${os?`<div><label>${L('委外廠商')} <span style="color:var(--red)">*</span></label><select id="o_vendor">${vdOpts}</select></div>`
          :`<div><label>設備（僅顯示${stN(nx)}站機台）${procNeedMc(nx)?' <span style="color:var(--red)">*</span>':' <span class="small muted">選填</span>'}<span class="small muted">點選或掃機台QR</span></label>
        <div class="row" style="gap:6px"><select id="o_mc" style="flex:1" onchange="onRepFilter()">${macOpts}</select><button class="btn ghost sm" onclick="scanPick('o_mc','machine','${nx}')">${L('📷掃碼')}</button></div>${macEmptyHint(nx)}</div>`}
      ${stationHasJig(first.partNo,nx)?`<div style="grid-column:1/-1"><label>治夾具 <span class="vi">（選填，可複選）</span></label><div id="o_jigs">${jigChips(first.partNo,nx)}</div></div>`:''}
    </div>
    <div class="small muted" style="margin-top:8px">★97 質控斷點：打單只填<b>產出總數（必須＝領料 ${total}）</b>；OK/NR/NG 分類、每箱裝入、產箱印標 → 到「<b>質控檢驗</b>」頁完成${procNeedQc(nx)?'':'（<b>此站未啟用質控斷點</b>＝打單直接產箱）'}。設備清單已依「${stN(nx)}」站過濾。</div>
    <div style="margin-top:14px"><button class="btn lg green" onclick="doReport()">🖨 ${L('打單（產出 → 待驗單）')}</button></div>
    <div style="margin-top:14px"><h3 style="margin-bottom:6px">📋 ${L('本站待驗單區')}</h3>${pendZoneHTML(nx)}</div>
  </div>`;
  opBig('o_op','o_opbig');
}
/* demo：模擬掃碼 = 從該類清單跳出選單帶入（正式版為相機掃 QR，依前綴 EMP/MAC 自動歸位） */
function scanPick(targetId,kind,code){
  let list;
  if(kind==='operator') list=prodOpsList();
  else list=machinesFor(code).map(m=>m.id);
  /* ★99-25（backlog 0t）「一台都沒有」要指路，不要只給一句空的「可選：」。
     【病徵】list 為空時 join 出空字串 ⇒ 畫面顯示「可選：」後面一片空白，
       使用者分不出是系統壞了還是真的沒有。重現＝04 過站打單選毛邊站（DB 沒有機台勾這個製程）→ 按「📷掃碼」。
     【為什麼是漏的】99-1 才剛做過同一條規則（needMcMsg()：需記設備但主檔沒該製程機台 → 訊息指路），
       這個 prompt 漏掉了。這裡直接重用 needMcMsg()，規則收斂在同一個出處。
     ⚠ 不要順手把「prompt 可以填不在選項內的值」那個行為拿掉——那是 §14 R-6「作業員下拉變空」
       唯一能穩定重現的路徑，拿掉就沒得查了。 */
  if(!list.length){
    return toast(kind==='operator'
      ? '本站目前沒有可選的作業員 —— 請到 ⚙名單管理 匯入／啟用該廠區的工牌，或確認機台廠區是否選對（人跟著機台的廠區走）'
      : needMcMsg(code), 'err');
  }
  const pick=prompt('（demo 模擬掃碼）請輸入或貼上掃到的'+(kind==='operator'?'工牌人員':'機台')+'：\n可選：'+list.join(' / '));
  if(pick==null) return; const v=pick.trim(); if(!v) return;
  const sel=$('#'+targetId); if(![...sel.options].some(o=>o.value===v)){ const opt=document.createElement('option'); opt.value=v; opt.textContent=v; sel.appendChild(opt); }
  sel.value=v; toast('已帶入：'+v,'ok');
  if(targetId==='o_mc') onRepFilter(); else if(targetId==='c_mc') onCreFilter();   /* ★96-6③ 掃碼帶入機台不觸發 onchange，手動套人機同廠 */
}
function doReport(){
  /* ★97 報工＝「產出打單」：產出數必須＝領料（強制相等）；分類/分箱/產箱移「質控檢驗」頁。
     「需記質控」關閉的站＝照舊直接產箱（跳過質控段）。 */
  if(!window._draws.length) return toast('請先加入來源箱','err');
  const qty=+$('#o_ok').value||0;
  const total=window._draws.reduce((a,d)=>a+d.take,0);
  if(qty!==total) return toast(`產出數 ${qty} ≠ 領料 ${total}（強制相等；OK/NR/NG 分類到質控檢驗頁做）`,'err');
  const first=findC(window._draws[0].cid); const nx=nextStation(first.partNo,first.processCode);
  const vEl=$('#o_vendor');
  const shift=($('#o_shift').value||'').trim(), op=($('#o_op')?$('#o_op').value:'').trim(), mc=($('#o_mc')?$('#o_mc').value:'').trim(), vendor=vEl?vEl.value.trim():'';
  const os=isOS(first.partNo,nx);
  if(os){ if(!vendor) return toast('委外站請選委外廠商','err'); }
  else if(procNeedMc(nx) && !mc) return toast(needMcMsg(nx),'err');   /* ★99-1 同上 */
  const jigs=readChecks('o_jigs');
  const draws=window._draws.map(d=>({cid:d.cid,take:d.take}));
  if(!procNeedQc(nx)){
    const at=nowISO();
    const nc={cid:genCID(nx),partNo:first.partNo,name:first.name,lot:first.lot,orderNo:first.orderNo,
      processCode:nx,stagePartNo:stageNo(first.partNo,nx),qty,operator:op,qc:'',machine:mc,vendor,shift,workType:'normal',
      jigs,sources:draws,pid:null,createdAt:at};
    if(nx==='PK'){ nc.pack='carton'; nc.oqc='待OQC'; }
    db.data.containers.push(nc);
    db.data.reports.push({id:'R'+Date.now()+Math.floor(Math.random()*1000),partNo:first.partNo,lot:first.lot,orderNo:first.orderNo,
      fromStation:first.processCode,toStation:nx,draws,ok:qty,nr:0,ng:0,intoCid:nc.cid,nrCid:null,ngCid:null,shift,operator:op,qc:'',createdAt:at});
    db.save(); rememberOp(op);
    toast('此站未啟用質控斷點：已直接產箱 '+nc.cid,'ok');
    window._draws=[]; renderReport();
    const re0=$('#r_result'); if(re0) re0.innerHTML=`<div class="card"><h3>✅ 已產箱（此站未啟用質控斷點）</h3>
      <div class="note">箱號 <span class="badge">${esc(nc.cid)}</span>（${qty} pcs）</div>
      <div style="margin-top:10px"><button class="btn navy" onclick='printLabels(${JSON.stringify([nc.cid])})'>🖨 列印標籤</button></div></div>`;
    return;
  }
  const slip={pid:genPID(nx),partNo:first.partNo,name:first.name,lot:first.lot,orderNo:first.orderNo,
    processCode:nx,qtyProd:qty,operator:op,machine:mc,shift,team:((($('#o_team')||{}).value)||'').trim(),
    mold:'',cavity:'',jigs,draws,pdate:'',status:'pending',qc:'',qmsNo:'',boxCids:[],
    vendor,fromStation:first.processCode,createdAt:nowISO()};
  db.data.pending.push(slip);
  db.save(); rememberOp(op);
  toast('已打單 '+slip.pid+'（'+stN(nx)+' 待質控）','ok');
  window._draws=[]; renderReport();
  const re=$('#r_result'); if(re) re.innerHTML=`<div class="card"><h3>🧾 ${L('已打單（產出 → 待驗單）')}</h3>
    <div class="note" style="border-color:var(--teal)">待驗單 <b class="mono">${esc(slip.pid)}</b>｜${stN(nx)}｜產出 <b>${qty}</b>（領料 ${draws.length} 箱）<br>
    <span class="small muted">實體放待驗區；「質控檢驗」驗完＝分類產箱＋印標</span></div></div>`;
}

/* ═══════════ ★97-2 過站打單重構（使用者定案：點交＝料已到站，免領料程序；與 02 首站打單同構） ═══════════
   規則（使用者提案＋我定的預設）：選「已點交到本站」的箱（多選/掃碼）→ 填完成數 → 打單。
   完成數＝選箱合計（最常見，預填）；少於合計＝餘量自動留在「最後一箱」（照選箱順序先進先出扣帳）；
   大於合計＝擋。sources 鏈/結存/⏳占用照舊。以下宣告覆蓋上面的舊版 renderReport/doReport（舊領料流程停用備查）。 */
/* ★99-8 04 的篩選狀態收在一處宣告：_rWo/_rLot/_rDate 一直沒宣告、靠 `||''` 活著，
   加第四個篩選（_rPn）時一起補齊，日後加第五個才不會漏。行為零改變
   （原本 undefined 在 `!x` 與 `(x||'')` 兩種用法下都與空字串等價）。 */
window._rSel=[]; window._rSt=''; window._rPn=''; window._rWo=''; window._rLot=''; window._rDate='';
/* ★98-9 04 過站打單排除「委外站」（使用者定案）：委外那一站的加工是廠商做的，大永只負責
   「03 委外轉出」和「03 委外回廠點收」。原本委外站同時出現在 04 與 03，同一批料會被打兩次單。
   ⚠委外是「產品路線上每站各自勾選」的，所以用 isOS(料號,站) 逐箱判斷，不是整站排除。 */
/* ★99-8 「待投產箱」的定義收斂到這一個出處（原本 repStations／repBoxesAt 各抄一份 filter，
   99-8 又要多一個「全部站」來源，抄第三次一定會走樣）[[centralize-shared-rule-not-per-page]]
   ⚠ 行為等價：原本 repBoxesAt 裡 isOS(c.partNo,st) 的 st 就等於 c.received.station。 */
function repAllBoxes(){ return db.data.containers.filter(c=>isNormalBox(c)&&remaining(c.cid)>0&&isReceived(c)&&c.received.station
  &&!isOS(c.partNo,c.received.station)); }
function repStations(){ return [...new Set(repAllBoxes().map(c=>c.received.station))]; }
function repBoxesAt(st){ return repAllBoxes().filter(c=>c.received.station===st); }
/* 站別排序照 STATIONS 的製程順序；合併工站「A+B」取第一段 */
function repStOrd(code){ const k=String(code||'').split('+')[0]; const i=STATIONS.findIndex(s=>s.code===k); return i<0?999:i; }
/* ★99-8 清單來源：有選站＝該站；沒選站＝全部站（依製程順序→箱號排，跨站才看得出流程順序） */
function repSrcBoxes(){ const st=window._rSt;
  if(st) return repBoxesAt(st);
  return repAllBoxes().slice().sort((a,b)=>repStOrd(a.received.station)-repStOrd(b.received.station)
                                          ||String(a.cid).localeCompare(String(b.cid))); }
function repToggle(cid){ const c=findC(cid); if(!c) return;
  const i=window._rSel.indexOf(cid);

     ⚠ 不學 repScanAdd 的「靜默切站＋清空已選」——掃碼是手上真有那箱、意圖明確；

function repScanAdd(v){ const cid=(v||'').trim().toUpperCase(); if(!cid) return;

  if(window._rSt!==c.received.station){ window._rSt=c.received.station; window._rSel=[]; }
  repToggle(cid); }
/* ★04 chips 篩選（★99-8 起：機種／工單／批號／日期 四欄）；只重繪 chip 區不失焦 */
/* ★99-8 機種欄的比對字串：組合框「顯示文字」＝「機種 ｜ 料號 — 品名」（與 comboItemsProd／pnCell 同序），
   值才是 partNo。使用者從下拉選一筆，欄位裡留下的就是那一整串顯示文字
   ⇒ 比對必須用同一套組法組回來，不能拿它去 includes(partNo)，
     否則會變成「下拉有選項、選了卻 0 筆」，而且只在「有建 model／品名」的料號上發作＝間歇性怪 bug。
   末尾再補一次裸料號，讓主檔沒建、或現場只打料號的也能命中。 */
function repPnText(pn){ const p=prodOf(pn)||{}; const md=p.model||pn, lo=pnoOf(pn), nm=p.name||'';
  return md+(lo&&lo!==md?' ｜ '+lo:'')+(nm?' — '+nm:''); }
function repPnHit(pn,q){ q=String(q||'').trim().toLowerCase(); if(!q) return true;   /* ★空＝不篩（沿用 _rWo/_rLot 慣例，不可反過來寫） */
  return (repPnText(pn)+' '+(pn||'')).toLowerCase().includes(q); }
function repChipFilter(list){ const pn=(window._rPn||'').trim().toLowerCase(), wo=(window._rWo||'').trim().toLowerCase(), lt=(window._rLot||'').trim().toLowerCase(), dt=window._rDate||'';

   用詞原則：只講現在該怎麼操作、不出現 97 兩段式的「🅐/🅑 點交」內部詞（98-21 已正名「清點移轉」）。 */
function repEmptyHTML(){

  if(st) return `<div class="empty">「${stN(st)}」站目前沒有待投產的箱（可能剛被打單領走，或已轉到下一站）。<br>改選別站，或把上方站別切回「（全部站）」看看還有哪些站有料。</div>`;

  const nOS=db.data.containers.filter(c=>isNormalBox(c)&&remaining(c.cid)>0&&isReceived(c)&&c.received.station

  <div class="tblfit"><table><thead><tr><th class="ck"><input type="checkbox" title="全選（同站、同料號）" onclick="repSelAll(this.checked)"></th><th class="fix stick">箱號</th>${st?'':'<th class="fix">站別</th>'}<th class="wrap">工單</th><th class="wrap">機種 / 料號</th><th class="wrap">批號</th><th class="fix num">剩可領</th><th class="fix">日期</th></tr></thead><tbody>

    const lock=!on && ((firstPn&&c.partNo!==firstPn) || (window._rSt&&c.received.station!==window._rSt));
    return `<tr class="${on?'sel':''}${lock?' dim':''}" style="cursor:pointer" onclick="repToggle('${esc(c.cid)}')">

  </tbody></table></div>
  <div class="step" style="margin-top:8px">${(window._rSel||[]).length?`已選 <b>${window._rSel.length}</b> 箱・合計 <b>${total}</b> pcs${st?`・${stN(st)} 站`:''}${firstPn?`・料號 <span class="mono">${esc(firstPn)}</span>`:''}`:'勾選箱（可多箱，限同站、同料號；或掃箱標籤）'}</div>`; }
function repSelAll(on){
  if(!on){ window._rSel=[]; render(); return; }              /* ★99-8 取消全選要在站別判斷之前（原本 !st 直接 return＝連取消都不動） */
  const list=repChipFilter(repSrcBoxes()); if(!list.length){ render(); return; }   /* ★99-8b 早退也要 render()：不然表頭全選框會停在「已勾」，再點一次變成取消全選 */
  const cur=(window._rSel||[]).length?findC(window._rSel[0]):null;

async function doQcInsp(){ if(wGuard('qcinsp','e',undefined,'質控檢驗')) return;

       ⇒ 重號會讓兩筆追溯指向同一張檢驗報告，跟 QMS 對帳時分不出是哪一批。原本**完全沒有任何檢查**。

     ⇒ 軟提醒：**講清楚是哪一張**（比照 98-12 廠商必選的指路寫法），按確定才存。
     ⚠ 擋在任何寫入之前（下面 addDefect／建箱都會改資料）。

        +(d.partNo?'／'+d.partNo:'')+(d.lot?'／批號 '+d.lot:'')+'）\n'
        +(dupList.length>1?'　（另外還有 '+(dupList.length-1)+' 張也用了同一個單號）\n':'')
        +'\n一張 QMS 報告涵蓋多張待驗單是正常的\n（委外一次回廠拆成多箱多張單，現場只開一張報告）。\n'
        +'但如果不是刻意共用，請先確認是不是打錯了。\n\n'

     ⚠ 病徵（260817 使用者截圖實證）：同一批生產，待驗單顯示 08-10、它產出的箱卻顯示 2026-08-17。
       中間只隔質控按一下。
     ⚠ 成因：待驗單的 createdAt 早就是補登時間戳（見 3940 stampAt），但「質控產箱」這條路

       ⇒ **從這一點修，那 25 處一行都不用改就全對**；只補下游會漏掉其餘 23 處。

          operator:p.operator||'',qc:qcName,machine:p.mix?'烤漆線':(p.machine||''),vendor:p.vendor||'',shift:p.shift||'',
          mold:p.mold||'',cavity:p.cavity||'',jigs:p.jigs||[],workType:hasDraws?'normal':undefined,
          sources:hasDraws?(i===0?okD:zero.slice()):[],pid:p.pid,rush:p.rush||undefined,
          backfill:p.backfill||undefined,entryAt:p.entryAt||undefined,createdAt:bAt};   /* ★99-36 正常箱：跟著生產日 */
        if(code==='PK'||p.mix){ nc.pack='carton'; if(code==='PK') nc.oqc='待OQC'; }
        db.data.containers.push(nc); createdCids.push(nc.cid); });
      intoCid=createdCids[0]||null;
    }
  }
  const meta={op:p.operator||'',mc:p.mix?'烤漆線':(p.machine||''),shift:p.shift||'',vendor:p.vendor||'',qc:qcName,createdAt:bAt,
    pdate:p.pdate||null};   /* ★99-34（0v）待驗單上就有生產日 ⇒ NR/NG 箱號跟正常箱、批號、待驗單號同一天 */
  /* ★99-36 NR/NG 箱的 createdAt 也跟著生產日：99-34 只修到「箱號」，時間戳當時還留在質控當下 */
  /* ★★99-39（缺陷 F）這條路＝「待驗單檢驗」，**每次檢驗各自產一箱**（現場一箱一標、標籤數量不累加）。

function rwKwHit(c){
  const kw=String(window._rwKw||'').trim().toLowerCase(); if(!kw) return true;
  const src=(c&&c.sources||[]).map(s=>s&&s.cid||'').join(' ');
  return [c.cid,src,c.lot,c.partNo,pnoOf(c.partNo),c.orderNo].join(' ').toLowerCase().includes(kw);

function rwHit(c,skip){
  return (skip==='pn' ||!window._rwPn ||repPnHit(c.partNo,window._rwPn))

      &&(skip==='st' ||!window._rwSt ||c.processCode===window._rwSt)

/* ★97 篩選連動（使用者：選了工單其他欄沒連動）：任一條件變動→其他下拉選項收斂到「符合其餘條件」的箱。
   select 用 option.hidden（保留原樣式與選值）；可打字組合框更新建議清單（resolve 仍用全清單）；
   失效的已選值自動清空並重篩一次（有界遞迴：清完即收斂）。kw/狀態屬弱條件不參與收斂。 */
/* ★98-14 搜尋關鍵字納入收斂（使用者 260805：搜了 MINI2，機種下拉還列 BM04/HS01A/V5＝點下去必 0 筆）。
   原本註解寫「kw 屬弱條件不參與收斂」，但這跟全系統通則「多篩選必連動」牴觸。
   ⚠ 只讓 kw 影響「選項要不要藏」，**不讓它清掉已選值**——打字是連續動作，
      打到一半把選好的機種清空會很煩 → 呼叫端傳 noKw=true 另算一份「該不該清」的集合。 */
function allCascadeBase(skip,noKw){
  const pn=$('#a_pn')?$('#a_pn').value:'', st=$('#a_st')?$('#a_st').value:'', dt=$('#a_date')?$('#a_date').value:'';
  const lt=comboResolve('a_lot',window._alLots||[])||'', aw=comboResolve('a_wo',window._alWos||[])||'';
  const kw=noKw?'':(($('#a_kw')?$('#a_kw').value:'').trim().toLowerCase());
  return db.data.containers.filter(c=>{ if(!c||c.ngHolder||isDefect(c)) return false;
    if(skip!=='pn'&&pn&&c.partNo!==pn) return false;
    if(skip!=='wo'&&aw&&c.orderNo!==aw) return false;
    if(skip!=='lot'&&lt&&c.lot!==lt) return false;
    if(skip!=='st'&&st&&c.processCode!==st) return false;
    if(skip!=='dt'&&dt&&prodDayOf(c.createdAt)!==dt) return false;
    /* 比對欄位與 renderAllTable 的搜尋完全一致，否則會出現「下拉有選項但列表 0 筆」 */
    if(kw&&![c.cid,c.orderNo,c.lot,c.partNo,c.name,c.operator,c.machine,c.reworkOrder].join(' ').toLowerCase().includes(kw)) return false;   /* ★99-23（4f）補 reworkOrder：order_no 改回原工單後，R 單號只剩這個欄位找得到 */
    return true; }); }
function allSyncOpts(){
  let cleared=false;
  /* ★98-14 兩組集合：allowed＝含關鍵字（決定選項藏不藏）／keep＝不含關鍵字（決定已選值要不要清） */
  const hideSel=(id,allowed,keep)=>{ const el=$('#'+id); if(!el||document.activeElement===el) return;
    [...el.options].forEach(o=>{ if(!o.value) return; o.hidden=!allowed.has(o.value); });
    if(el.value&&!keep.has(el.value)){ el.value=''; cleared=true; } };
  const setOf=(skip,noKw,f)=>new Set(allCascadeBase(skip,noKw).map(f));
  const dOf=c=>prodDayOf(c.createdAt);
  hideSel('a_pn',  setOf('pn',false,c=>c.partNo),      setOf('pn',true,c=>c.partNo));
  hideSel('a_st',  setOf('st',false,c=>c.processCode), setOf('st',true,c=>c.processCode));
  hideSel('a_date',setOf('dt',false,dOf),              setOf('dt',true,dOf));
  if(document.activeElement!==$('#a_wo')) comboFill('a_wo',[...new Set(allCascadeBase('wo').map(c=>c.orderNo).filter(Boolean))].sort().map(w=>({v:w,t:w})));
  if(document.activeElement!==$('#a_lot')) comboFill('a_lot',lotVoidItems([...new Set(allCascadeBase('lot').map(c=>c.lot).filter(Boolean))].sort()));   /* ★99-12 走共用 lotVoidItems()，不再用純批號蓋掉「（全作廢）」標籤 */
  if(cleared) renderAllTable();
}
/* 84-7 全部箱號排序：點表頭切換 ▲▼（比照生產單 V54）。數字/時間欄預設降冪、文字欄預設升冪 */
window._allSort=window._allSort||{k:'time',d:-1};
function aVal(c,k){ switch(k){
  case 'cid':return c.cid||''; case 'wo':return c.orderNo||''; case 'lot':return c.lot||'';
  case 'proc':return stN(c.processCode)||''; case 'ok':return +c.qty||0; case 'drawn':return drawnOut(c.cid);
  case 'out':return isReceived(c)?(+c.qty||0):0;   /* ★97 已轉出（整箱點交） */
  case 'bal':return remaining(c.cid); case 'st':return remaining(c.cid)>0?1:0; case 'op':return c.operator||'';
  default:return c.createdAt||''; } }
function aSortBy(k){ const s=window._allSort; if(s.k===k) s.d=-s.d; else window._allSort={k,d:(k==='ok'||k==='drawn'||k==='bal'||k==='time')?-1:1}; renderAllTable(); }
function aArr(k){ const s=window._allSort; return s.k===k?(s.d>0?' ▲':' ▼'):''; }
function renderAllTable(){
  const kw=($('#a_kw')?$('#a_kw').value:'').trim().toLowerCase();
  const pn=$('#a_pn')?$('#a_pn').value:''; const st=$('#a_st')?$('#a_st').value:''; const state=$('#a_state')?$('#a_state').value:'';
  const dt=$('#a_date')?$('#a_date').value:'';   /* ★96-3 日期篩選 */
  const lt=comboResolve('a_lot',window._alLots||[])||'';   /* ★96-4 批號篩選（打字中對不到=不過濾） */
  const aw=comboResolve('a_wo',window._alWos||[])||'';   /* ★96-6 ④工單篩選 */
  /* ★92「全部箱號」頁包含作廢箱（可查詢/可恢復）；其他頁面靠 isNormalBox 自動排除 */
  let rows=db.data.containers.filter(c=>c&&!c.ngHolder&&!isDefect(c)&&boxScopeReadable(c));   /* ★99-47 廠區過濾 */
  rows=rows.filter(c=>(!pn||c.partNo===pn)&&(!aw||c.orderNo===aw)&&(!lt||c.lot===lt)&&(!st||c.processCode===st)&&(!dt||prodDayOf(c.createdAt)===dt));

function restoreTraceState(){

     補這一行讓候選收斂回符合現有條件；帶 noQuery 避免把還原的查詢結果洗掉。 */
  traceSync('',true);
}
// 用某一種方式查找時，清掉其它區塊的舊結果，避免殘留混淆
function clearTraceOuts(keep){ ['t_out','q_out','iv_out'].forEach(id=>{ if(id!==keep){ const el=$('#'+id); if(el) el.innerHTML=''; } }); }
function doInterval(){
  const pn=$('#iv_pn').value, st=$('#iv_st').value;
  const from=$('#iv_from').value, to=$('#iv_to').value;
  const out=$('#iv_out'); clearTraceOuts('iv_out');
  let reps=db.data.reports.filter(r=>(!pn||r.partNo===pn)&&(!st||r.toStation===st));
  if(from) reps=reps.filter(r=>prodDayOf(r.createdAt)>=from);
  if(to) reps=reps.filter(r=>prodDayOf(r.createdAt)<=to);
  if(!reps.length){ out.innerHTML='<div class="empty">此條件區間內無報工紀錄</div>'; return; }
  // 逐批(機種+批+站)加總
  const g={};
  reps.forEach(r=>{ const k=r.partNo+'|'+r.lot+'|'+r.toStation;
    const o=g[k]||(g[k]={pn:r.partNo,lot:r.lot,st:r.toStation,input:0,ok:0,nr:0,ng:0,last:''});
    const di=(r.draws||[]).reduce((a,x)=>a+(+x.take||0),0);
    o.input+=di>0?di:((+r.ok||0)+(+r.nr||0)+(+r.ng||0)); o.ok+=(+r.ok||0); o.nr+=(+r.nr||0); o.ng+=(+r.ng||0);   /* ★97 首站打單無領料：投入=生產數 */
    if((r.createdAt||'')>o.last) o.last=r.createdAt||''; });

  const T={input:0,ok:0,nr:0,ng:0}; rows.forEach(r=>{T.input+=r.input;T.ok+=r.ok;T.nr+=r.nr;T.ng+=r.ng;});
  const proc=T.ok+T.nr+T.ng; const yAll=proc?(T.ok/proc*100):0;
  const defectRate=r=>{ const p=r.ok+r.nr+r.ng; return p?((r.nr+r.ng)/p*100):0; };
  const avgDefect=proc?((T.nr+T.ng)/proc*100):0;
  // 找出不良率明顯高於平均的批(>1.5倍且>0)

  out.innerHTML=`
    <div class="grid g4" style="margin-bottom:14px">
      <div class="kpi"><div class="v">${T.input}</div><div class="l">${L('區間總投入')}</div></div>
      <div class="kpi"><div class="v" style="color:var(--teal)">${yAll.toFixed(2)}%</div><div class="l">${L('真實良率（加總）')}</div></div>
      <div class="kpi"><div class="v" style="color:#b9760f">${T.nr}</div><div class="l">${L('NR 累計')}</div></div>
      <div class="kpi"><div class="v" style="color:var(--red)">${T.ng}</div><div class="l">${L('NG 累計')}</div></div>
    </div>
    <div class="note" style="margin-bottom:12px">區間平均不良率 <b>${avgDefect.toFixed(2)}%</b>。下表逐批列出，<span style="color:var(--red)">紅色長條</span>＝該批不良率，明顯偏高者要注意（可能不良集中在該批）。</div>
    <table><thead><tr><th>${L('批號')}</th><th>${L('機種')}</th><th>${L('站')}</th><th>${L('投入')}</th><th>OK</th><th>NR</th><th>NG</th><th>${L('不良率')}</th><th>${L('分布')}</th><th>${L('最後報工')}</th></tr></thead><tbody>
    ${rows.map(r=>{ const d=defectRate(r); const high=d>avgDefect*1.5&&d>0;
      return `<tr${high?' style="background:#fdecea"':''}>
        <td class="mono">${esc(r.lot)}</td><td>${pnCell(r.pn)}</td><td><span class="pill dc">${stN(r.st)}</span></td>
        <td>${r.input}</td><td>${r.ok}</td><td style="color:#b9760f">${r.nr}</td><td style="color:var(--red)">${r.ng}</td>
        <td><b${high?' style="color:var(--red)"':''}>${d.toFixed(2)}%</b>${high?' ⚠':''}</td>
        <td style="width:120px"><div style="background:#eee;border-radius:4px;height:10px"><div style="width:${Math.round(d/maxD*100)}%;background:${high?'var(--red)':'var(--gold)'};height:10px;border-radius:4px"></div></div></td>
        <td class="small muted">${esc(prodDayOf(r.last))}</td></tr>`; }).join('')}

}

/* ★98-1 帳差記錄匯出 CSV（給各部門做庫存領用沖銷／委外扣款單的依據） */
function diffExportCsv(){
  const rows=window._diffRows||[];
  if(!rows.length) return toast('目前沒有帳差記錄可匯出','err');
  /* ★99-29（backlog 0j）CSV 補「委外廠商」與「認列類別」兩個維度。
     【兩個症狀、同一個根】這份 CSV 是**發給財務／採購做扣款與領用沖銷**的，但：
       ①**委外轉出那筆的廠商掉了**：畫面「段別」欄印兩行（`委外轉出` ＋ `昇榮`），CSV 只匯出 `委外轉出`。
       ②**認列單位分不出廠商 vs 內部部門**：同一欄混著 `昇榮`（廠商・扣款對象）與 `生產`／`物控`（內部部門）。
         畫面上廠商有紫色 pill 一眼分得出，匯出後只剩純文字 ⇒ 要篩「哪些要跟廠商扣款」只能靠人認名字。
     ⇒ 加兩欄就兩個一起解：**委外廠商**（不論轉出或回廠都帶）＋**認列類別**（廠商／內部）。
     ★畫面不動（pill 已經夠清楚），只補 CSV —— 差異在「匯出後資訊有沒有掉」，不在畫面。
     ⚠ 既有 13 欄的**順序與內容一個都不動**，新欄一律加在最後 —— 財務端若有既成的欄位對應，不會被打亂。 */
  const hd=['時間','箱號','料號','批號','工單號','製程站','段別','應收','實收','帳差','認列單位','經手人','備註','委外廠商','認列類別'];
  const seg=r=>r.kind==='sendout'?'委外轉出':(r.kind==='vendorReturn'?'委外回廠':(r.kind==='stockin'?'成品入庫':'清點移轉'));   /* ★98-11 補委外回廠 */
  const body=rows.map(r=>[localDT(r.createdAt),r.cid||'',r.partNo||'',r.lot||'',r.orderNo||'',   /* ★99-2 CSV 時間也轉當地 */
    stN(r.fromStation)||'',seg(r),r.expect,r.actual,r.diff,diffResp(r),r.by||'',r.note||'',
    r.vendor||'',                                              /* 委外廠商：轉出與回廠都帶，畫面段別第二行印的就是它 */
    (r.kind==='vendorReturn'&&r.vendor)?'廠商':'內部']);        /* 認列類別：與 diffResp() 同一條判斷——只有委外回廠的短交才認列到廠商 */   /* ★99-6 CSV 也走共用判斷（這份是實際發給財務／採購做扣款與領用沖銷的，錯的殺傷力最大）；順帶把原本的空白改成「（未指定）」，領用沖銷不該收到空格 */
  csvExport('MHR_帳差記錄_'+todayYMD()+'.csv',[hd].concat(body));
}

function doTrace(){
  const cid=$('#t_cid').value.trim().toUpperCase(); const c=findC(cid); const out=$('#t_out'); clearTraceOuts('t_out');

  const chain=[]; collectSources(cid,chain,0,null);
  const roots=chain.filter(x=>!(findC(x.c.cid).sources||[]).length).map(x=>x.c.cid);
  // 依機種製程順序排站。chain 已是沿 sources 的真實路徑：
  // 正常 1→1 每站僅一箱；若有混批/分箱(下游箱有多個來源)，該站才會有多箱＝真實分支。
  const p=prodOf(c.partNo); const order=p?p.route:[...new Set(chain.map(x=>x.c.processCode))];
  const byStation={}; chain.forEach(x=>{ const a=byStation[x.c.processCode]=byStation[x.c.processCode]||[];
    if(!a.some(y=>y.c.cid===x.c.cid)) a.push(x); }); // 同箱去重
  const cols=order.filter(code=>byStation[code]);
  const colData=cols.map(code=>{ const arr=byStation[code]; return {code,arr,main:arr[0].c,take:arr[0].take,branch:arr.length>1}; });
  const hasBranch=colData.some(d=>d.branch);

     【為什麼左右對、上下是硬塞】這張表本來就是「**由左到右＝往下游走**」，分支也是時序關係

  const BRANCH_MAX=3;

    if(d.arr.length<=BRANCH_MAX) d.arr.forEach((x,i)=>colUnits.push({d,x,idx:i}));

/* ★98-15 破壞性操作＝打字確認。原本三顆都只用 confirm()，一個 Enter 就過去了；
   而它們會「同步覆蓋雲端正式資料庫」＝所有裝置一起變，手滑成本太高（260805 的 demo 產品
   很可能就是這樣被灌回來的）。改成必須是系統管理員＋手動打「覆蓋」二字。 */
function confirmDestructive(what){
  if(!isSysAdmin()){ toast('只有系統管理員可以執行「'+what+'」','err'); return false; }
  /* ★99-20：模擬或廠區檢視中一律禁用。這三顆（載入測試資料／匯入備份／清空）動的是
     **全公司單一資料集**（db.data 沒有廠區維度），在「大永檢視模式」按下去會把敬得觀音的資料一起清掉。 */
  if(simOn()){ toast('🏭 模擬身分／廠區檢視中不開放「'+what+'」——這會覆蓋全公司資料（不分廠區）。請先回到自己的身分','err'); return false; }
  const a=prompt('⚠⚠ '+what+'\n\n資料在雲端：這會「同步覆蓋雲端正式資料庫」，所有裝置一起變、無法復原。\n建議先按「匯出備份」留底。\n\n確定要繼續，請輸入「覆蓋」二字：');
  if(a===null) return false;
  if(String(a).trim()!=='覆蓋'){ toast('輸入不符，已取消','err'); return false; }
  return true;
}
function importJSON(ev){ const f=ev.target.files[0]; if(!f) return;
  if(!confirmDestructive('匯入備份（會覆蓋現有全部資料）')){ ev.target.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.products)||!Array.isArray(d.containers)) throw new Error('格式不符');
    d.reports=d.reports||[]; db.data=d; db.save(); toast('已匯入','ok'); go('dash'); }catch(e){ toast('匯入失敗：'+e.message,'err'); } finally{ ev.target.value=''; } };
  r.readAsText(f); }

  // 3a-2：測試資料一律蓋「已接收」章（嚴格模式下才有東西可直接報工示範）；新建的箱照常走真點交流程
  db.data.containers.forEach(c=>{ const nx0=isNormalBox(c)?nextStation(c.partNo,c.processCode):null;
    if(nx0&&!c.received) c.received={station:nx0,by:'測試資料',at:nowISO(),expect:c.qty,actual:c.qty,diff:0,resp:'',note:'',kind:isOS(c.partNo,nx0)?'sendout':'receive'}; });
  /* ★86 工單已上雲：demo 工單不再生成（工單一律真實）。示範箱的 orderNo 查無工單明細＝預期 */
  db.save();
  toast('已載入測試資料：'+db.data.products.length+' 機種 / '+db.data.containers.filter(isNormalBox).length+' 箱','ok'); go('dash');
}

/* ★ 階段1：改為「先登入 → 再啟動」。未登入不 render 主畫面、不載入示範資料。
   （示範資料的載入已移進 bootApp；登入成功才會跑） */
(function initMHR(){
  const s=getSession();
  if(s && s.token && s.profile){ if(s.mustChange) showChangePwd(); else bootApp(); }
  else { preloadOms(); const e=$('#lg_email'); if(e) e.focus(); }   // ★88-3 未登入＝顯示登入頁：背景預載 OMS 名單快取（工號驗證秒回）
})();
/* 等比縮放：以 14 吋(基準寬 1366px) 為設計基礎，大螢幕按比例放大（字體+欄寬+間距整體等比；小於基準維持1，可橫捲）
   ★ 別加「高度上限」去壓 zoom：body 有 zoom 時 CSS 座標系會等比縮小，
     例如 1920×937 @zoom1.41 → 版面實際看到 1362×665，本來就會命中上面
     `(max-height:700px)` 而自動改成頂部橫向選單。若硬壓 zoom（如 ÷760→1.23），
     CSS 高度反而變 762 >700 → 又切回直式側欄 → 選單被切掉。實測驗過，勿再加。 */
function fitScale(){ try{
  const z=Math.max(1,Math.min(1.7,window.innerWidth/1366));
  document.body.style.zoom=z;
  /* 側欄高度要扣掉 zoom（見 .side 的 --vh 註解），否則側欄盒子比螢幕還高、底部被推出畫面 */
  document.documentElement.style.setProperty('--vh',(window.innerHeight/z)+'px');
}catch(e){} }
window.addEventListener('resize',fitScale); fitScale();
</script>
