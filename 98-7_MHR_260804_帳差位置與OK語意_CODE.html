}
function qiSum(){ const p=window._qiPick?findP(window._qiPick):null; if(!p) return;
  const s=(+(($('#qi_ok')||{}).value||0))+(+(($('#qi_nr')||{}).value||0))+(+(($('#qi_ng')||{}).value||0));
  const el=$('#qi_sum'); if(el){ const okEq=s===+p.qtyProd;
    el.innerHTML='合計 <b style="color:'+(okEq?'#1f8a4c':'#a33')+'">'+s+'</b> ／ 生產數 '+p.qtyProd+(okEq?' ✓':'（必須相等，多、少都擋）'); } }
async function doQcInsp(){
  const p=window._qiPick?findP(window._qiPick):null;
  if(!p||p.status!=='pending') return toast('待驗單不存在或已結案','err');
  if(!canQcInsp()) return toast('僅質控職能＋系統管理可輸入檢驗結果','err');
  const ok=+$('#qi_ok').value||0, nr=+$('#qi_nr').value||0, ng=+$('#qi_ng').value||0;
  if(ok<0||nr<0||ng<0) return toast('數量不可為負','err');
  if(ok+nr+ng!==+p.qtyProd) return toast(`OK+NR+NG=${ok+nr+ng} ≠ 生產數 ${p.qtyProd}（強制相等——差異請當場對帳，或作廢重打）`,'err');
  const per=+((($('#qi_per')||{}).value)||0);
  if(p.mix&&ok>0&&per<=0) return toast('烤漆出爐 OK 轉紙箱需填「每箱裝入」','err');
  const qms=((($('#qi_qms')||{}).value)||'').trim();
  const into=((($('#qi_into')||{}).value)||'');
  const qcName=sessionName()||'';
  const at=nowISO();
  const code=p.processCode;
  /* ★單號防重：產箱前先問雲端本站當日最大箱號（多裝置）；一次取號、批內遞增 */
  const cidYmd=p.pdate?String(p.pdate).replace(/-/g,'').slice(2):todayYMD();
  const cidFloor=await cloudMaxSeq('mhr_containers','cid',(code||'').split('+')[0]+cidYmd);
  const draws=(p.draws||[]).map(d=>({cid:d.cid,take:+d.take||0}));
  const hasDraws=draws.length>0;
  const [okD,nrD,ngD]=hasDraws?splitDraws(draws,[ok,nr,ng]):[[],[],[]];
  const first={partNo:p.partNo,name:p.name,lot:p.lot,orderNo:p.orderNo};
  let createdCids=[], intoCid=null;
  if(ok>0){
    if(into&&hasDraws&&!p.mix){ const b=findC(into);
      if(b){ b.qty+=ok; (b.sources=b.sources||[]).push(...okD); if(!b.qc&&qcName) b.qc=qcName; intoCid=into; createdCids=[into]; } }
    if(!intoCid){
      const chunks=[]; { let left=ok; const cap=(per>0&&per<ok)?per:ok; while(left>0){ const q=Math.min(cap,left); chunks.push(q); left-=q; } }
      const zero=draws.map(d=>({cid:d.cid,take:0}));
      chunks.forEach((q,i)=>{
        const nc={cid:genCID(code,p.pdate||'',cidFloor),partNo:p.partNo,name:p.name,lot:p.lot,orderNo:p.orderNo,
          processCode:code,stagePartNo:stageNo(p.partNo,code),qty:q,
          operator:p.operator||'',qc:qcName,machine:p.mix?'烤漆線':(p.machine||''),vendor:p.vendor||'',shift:p.shift||'',
          mold:p.mold||'',cavity:p.cavity||'',jigs:p.jigs||[],workType:hasDraws?'normal':undefined,
          sources:hasDraws?(i===0?okD:zero.slice()):[],pid:p.pid,rush:p.rush||undefined,
          backfill:p.backfill||undefined,entryAt:p.entryAt||undefined,createdAt:at};
        if(code==='PK'||p.mix){ nc.pack='carton'; if(code==='PK') nc.oqc='待OQC'; }
        db.data.containers.push(nc); createdCids.push(nc.cid); });
      intoCid=createdCids[0]||null;
    }
  }
  const meta={op:p.operator||'',mc:p.mix?'烤漆線':(p.machine||''),shift:p.shift||'',vendor:p.vendor||'',qc:qcName,createdAt:at};
  const nrCid=nr>0?addDefect('NR',code,first,nrD,meta,nr):null;
  const ngCid=ng>0?addDefect('NG',code,first,ngD,meta,ng):null;
  if(p.mix&&nrCid){ const nb=findC(nrCid); if(nb){ nb.paintRepair=true; if(nb.pid===undefined) nb.pid=p.pid; } }   /* 烤漆 NR＝補噴箱（免點交、下爐同投） */
  if(nrCid){ const nb=findC(nrCid); if(nb&&!nb.pid) nb.pid=p.pid; }
  if(ngCid){ const gb=findC(ngCid); if(gb&&!gb.pid) gb.pid=p.pid; }
  p.status='done'; p.ok=ok; p.nr=nr; p.ng=ng; p.qc=qcName; p.qmsNo=qms; p.doneAt=at;   /* ★97 結案時間（移轉記錄用） */
  p.boxCids=createdCids.concat(nrCid?[nrCid]:[]).concat(ngCid?[ngCid]:[]);

function voidPending(pid){ const p=findP(pid); if(!p) return;
  if(p.status==='void'){ if(!isAdminNow()) return toast('僅系統管理可恢復','err');
    if(!confirm('恢復待驗單 '+pid+'？\n\n恢復後回「⏳待質控」繼續驗。')) return;
    p.status='pending'; p.voidAt=null; p.voidBy=''; p.voidNote=''; db.save(); toast('已恢復','ok'); render(); return; }
  if(p.status!=='pending') return toast('已驗結案的待驗單不可作廢（要退請走箱作廢／06 會判）','err');
  if(p.qmsNo) return toast('已回填 QMS 單號＝視同已驗，不可作廢','err');
  if(!canVoidPending()) return toast('僅主管／系統管理可作廢待驗單','err');

  if(why===null) return;
  p.status='void'; p.voidAt=nowISO(); p.voidBy=((getSession()||{}).profile||{}).email||''; p.voidNote=why||'';
  db.save(); toast('已作廢（記錄保留）','ok'); render(); }

  const rem=remaining(cid);
  if(rw+ng+rl<=0) return toast('請至少填一項處置數量','err');

    if(skip!=='lot'&&lt&&c.lot!==lt) return false;
    if(skip!=='st'&&st&&c.processCode!==st) return false;
    if(skip!=='dt'&&dt&&String(c.createdAt||'').slice(0,10)!==dt) return false;
    return true; }); }

    if(el.value&&!allowed.has(el.value)){ el.value=''; cleared=true; } };

// 記住追溯查詢頁的選擇與結果，切頁回來不歸零
let traceState=null;
function saveTraceState(){
  traceState={
    t_cid:$('#t_cid')?$('#t_cid').value:'',
    q_pn:$('#q_pn')?$('#q_pn').value:'', q_wo:$('#q_wo')?$('#q_wo').value:'', q_lot:$('#q_lot')?$('#q_lot').value:'', q_st:$('#q_st')?$('#q_st').value:'', q_view:$('#q_view')?$('#q_view').value:'',
    iv_pn:$('#iv_pn')?$('#iv_pn').value:'', iv_st:$('#iv_st')?$('#iv_st').value:'', iv_from:$('#iv_from')?$('#iv_from').value:'', iv_to:$('#iv_to')?$('#iv_to').value:'',
    t_out:$('#t_out')?$('#t_out').innerHTML:'', q_out:$('#q_out')?$('#q_out').innerHTML:'', iv_out:$('#iv_out')?$('#iv_out').innerHTML:'',
  };
}
function restoreTraceState(){
  if(!traceState) return; const s=traceState;
  const set=(id,v)=>{ const el=$('#'+id); if(el&&v!=null) el.value=v; };
  set('t_cid',s.t_cid); set('q_pn',s.q_pn); set('q_wo',s.q_wo); set('q_lot',s.q_lot); set('q_st',s.q_st); set('q_view',s.q_view);
  set('iv_pn',s.iv_pn); set('iv_st',s.iv_st); set('iv_from',s.iv_from); set('iv_to',s.iv_to);
  const put=(id,v)=>{ const el=$('#'+id); if(el&&v) el.innerHTML=v; };
  put('t_out',s.t_out); put('q_out',s.q_out); put('iv_out',s.iv_out);
  /* ★98-6 還原後補跑一次連動（使用者實測抓到）：renderTrace 每次都用「完整清單」重建候選，
     restoreTraceState 只還原輸入值 → 工單留著 TEST-96-5，批號候選卻是全部批號（含別張工單的）。
     補這一行讓候選收斂回符合現有條件；帶 noQuery 避免把還原的查詢結果洗掉。 */
  traceSync('',true);
}
// 用某一種方式查找時，清掉其它區塊的舊結果，避免殘留混淆
function clearTraceOuts(keep){ ['t_out','q_out','iv_out'].forEach(id=>{ if(id!==keep){ const el=$('#'+id); if(el) el.innerHTML=''; } }); }
function doInterval(){
  const pn=$('#iv_pn').value, st=$('#iv_st').value;
  const from=$('#iv_from').value, to=$('#iv_to').value;
  const out=$('#iv_out'); clearTraceOuts('iv_out');
  let reps=db.data.reports.filter(r=>(!pn||r.partNo===pn)&&(!st||r.toStation===st));
  if(from) reps=reps.filter(r=>(r.createdAt||'').slice(0,10)>=from);
  if(to) reps=reps.filter(r=>(r.createdAt||'').slice(0,10)<=to);
  if(!reps.length){ out.innerHTML='<div class="empty">此條件區間內無報工紀錄</div>'; return; }
  // 逐批(機種+批+站)加總
  const g={};
  reps.forEach(r=>{ const k=r.partNo+'|'+r.lot+'|'+r.toStation;
    const o=g[k]||(g[k]={pn:r.partNo,lot:r.lot,st:r.toStation,input:0,ok:0,nr:0,ng:0,last:''});
    const di=(r.draws||[]).reduce((a,x)=>a+(+x.take||0),0);
    o.input+=di>0?di:((+r.ok||0)+(+r.nr||0)+(+r.ng||0)); o.ok+=(+r.ok||0); o.nr+=(+r.nr||0); o.ng+=(+r.ng||0);   /* ★97 首站打單無領料：投入=生產數 */
    if((r.createdAt||'')>o.last) o.last=r.createdAt||''; });
  const rows=Object.values(g).sort((a,b)=>String(a.last).localeCompare(String(b.last)));
  const T={input:0,ok:0,nr:0,ng:0}; rows.forEach(r=>{T.input+=r.input;T.ok+=r.ok;T.nr+=r.nr;T.ng+=r.ng;});
  const proc=T.ok+T.nr+T.ng; const yAll=proc?(T.ok/proc*100):0;
  const defectRate=r=>{ const p=r.ok+r.nr+r.ng; return p?((r.nr+r.ng)/p*100):0; };
  const avgDefect=proc?((T.nr+T.ng)/proc*100):0;
  // 找出不良率明顯高於平均的批(>1.5倍且>0)
  const maxD=Math.max(...rows.map(defectRate),0.0001);
  out.innerHTML=`
    <div class="grid g4" style="margin-bottom:14px">
      <div class="kpi"><div class="v">${T.input}</div><div class="l">${L('區間總投入')}</div></div>
      <div class="kpi"><div class="v" style="color:var(--teal)">${yAll.toFixed(2)}%</div><div class="l">${L('真實良率（加總）')}</div></div>
      <div class="kpi"><div class="v" style="color:#b9760f">${T.nr}</div><div class="l">${L('NR 累計')}</div></div>
      <div class="kpi"><div class="v" style="color:var(--red)">${T.ng}</div><div class="l">${L('NG 累計')}</div></div>
    </div>
    <div class="note" style="margin-bottom:12px">區間平均不良率 <b>${avgDefect.toFixed(2)}%</b>。下表逐批列出，<span style="color:var(--red)">紅色長條</span>＝該批不良率，明顯偏高者要注意（可能不良集中在該批）。</div>
    <table><thead><tr><th>${L('批號')}</th><th>${L('機種')}</th><th>${L('站')}</th><th>${L('投入')}</th><th>OK</th><th>NR</th><th>NG</th><th>${L('不良率')}</th><th>${L('分布')}</th><th>${L('最後報工')}</th></tr></thead><tbody>
    ${rows.map(r=>{ const d=defectRate(r); const high=d>avgDefect*1.5&&d>0;
      return `<tr${high?' style="background:#fdecea"':''}>
        <td class="mono">${esc(r.lot)}</td><td>${pnCell(r.pn)}</td><td><span class="pill dc">${stN(r.st)}</span></td>
        <td>${r.input}</td><td>${r.ok}</td><td style="color:#b9760f">${r.nr}</td><td style="color:var(--red)">${r.ng}</td>
        <td><b${high?' style="color:var(--red)"':''}>${d.toFixed(2)}%</b>${high?' ⚠':''}</td>
        <td style="width:120px"><div style="background:#eee;border-radius:4px;height:10px"><div style="width:${Math.round(d/maxD*100)}%;background:${high?'var(--red)':'var(--gold)'};height:10px;border-radius:4px"></div></div></td>
        <td class="small muted">${esc((r.last||'').slice(0,10))}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="small muted" style="margin-top:8px">⚠ 標記＝該批不良率超過區間平均 1.5 倍。即使整體良率漂亮，集中爆量的批次也會在此凸顯。</div>`;
}
function doQuery(){
  /* ★96 加工單、★96-4 加批號：pn/wo/lot 由組合框解析（''=全部、null=打的字對不到唯一一筆）；三種檢視都套過濾 */
  const st=$('#q_st').value, view=$('#q_view')?$('#q_view').value:'flow';
  const out=$('#q_out'); clearTraceOuts('q_out');
  let pn=comboResolve('q_pn',window._trPn); const wo=comboResolve('q_wo',window._trWo), lot=comboResolve('q_lot',window._trLot);

  if(wo===null){ out.innerHTML='<div class="empty">工單號「'+esc($('#q_wo').value)+'」對不到唯一一筆——請打完整些，或從下拉清單點選</div>'; return; }

  if(lot&&!pn){ const m=lotMetaList().find(x=>x.lot===lot); if(m) pn=m.pn; }   /* ★96-4 選批號未選機種→自動補（一批只屬一個料號） */
  const woTag=(wo?'　｜　工單 <b>'+esc(wo)+'</b>':'')+(lot?'　｜　批號 <b>'+esc(lot)+'</b>':'');
  if(view==='flow'){
    if(!pn){ out.innerHTML='<div class="empty">流轉順序檢視請先選一個機種/料號'+(wo?'（一張工單有多個料號時，請再挑其中一個）':'（才能依該機種製程順序排列）')+'</div>'; return; }
    const p=prodOf(pn); const led=stationLedger(pn,wo,lot);
    const route=p.route.filter(c=>!st||c===st);
    if(!route.some(c=>led[c])){ out.innerHTML='<div class="empty">此機種尚無流轉資料</div>'; return; }
    out.innerHTML=`<div class="step">機種 <b>${esc(pn)}</b>${pnNm(pn)?' <span class="muted small">— '+esc(pnNm(pn))+'</span>':''}${woTag} — 依製程順序看料的進出（投入 → OK產出 → 已轉下站 / 結存）</div>
      <style>/* ★表格通用規則：文字靠左、數字靠右（[[table-column-alignment-rule]]） */
        #q_out table.flowtbl th,#q_out table.flowtbl td{text-align:right;white-space:nowrap}
        #q_out table.flowtbl th:nth-child(1),#q_out table.flowtbl td:nth-child(1),
        #q_out table.flowtbl th:nth-child(2),#q_out table.flowtbl td:nth-child(2){text-align:left}
        /* ★製程存量組成標示（使用者 Excel）：A待投產＋B待質控＋C待轉出 */
        #q_out table.flowtbl tr.grp th{background:var(--card);border:0;padding:1px 6px 3px;text-align:center;font-weight:800}
        #q_out table.flowtbl tr.grp th.tagA{color:#b9760f;background:#fdf3e3;border-radius:5px 5px 0 0}
        #q_out table.flowtbl tr.grp th.tagS{color:var(--teal);background:#eaf5ef;border-radius:5px 5px 0 0}
        #q_out table.flowtbl thead tr:last-child th{position:static}
      </style>
      <table class="compact numtbl flowtbl"><thead>
      <tr class="grp"><th colspan="4"></th><th class="tagA">A</th><th colspan="5"></th><th class="tagA">B</th><th></th><th></th><th class="tagA">C</th><th class="tagS">A＋B＋C</th></tr>
      <tr><th>${L('順序')}</th><th>${L('製程站')}</th><th>${L('接收')}</th><th>${L('已投產')}</th><th>${L('待投產')}</th><th>${L('已驗')}</th><th>OK</th><th>NR</th><th>NG</th><th>${L('良率')}</th><th>${L('待質控')}</th><th>${L('帳差')}</th><th>${L('已轉出')}</th><th>${L('待轉出')}</th><th>${L('製程存量')}</th></tr></thead><tbody>
      ${(()=>{ /* ★97 在途兩態（使用者反映「點交後看不到」）：⏳待驗=該站已打單未驗量；⏭已收=已點交到該站未投產結存 */
        const boxesF=db.data.containers.filter(b=>isNormalBox(b)&&(!pn||b.partNo===pn)&&(!wo||b.orderNo===wo)&&(!lot||b.lot===lot));
        const rcvQ=c=>boxesF.filter(b=>b.received&&b.received.station===c&&remaining(b.cid)>0).reduce((a,b)=>a+remaining(b.cid),0);
        const slipQ=c=>(db.data.pending||[]).filter(q=>q.status==='pending'&&q.processCode===c&&(!pn||q.partNo===pn)&&(!wo||q.orderNo===wo)&&(!lot||q.lot===lot)).reduce((a,q)=>a+(+q.qtyProd||0),0);
        /* ★97 表格改用「Excel 勾稽模型」（使用者提供表格為準）：
           接收＝已投產＋待投產；已投產＝已驗＋待質控；已驗＝OK+NR+NG；OK＝已轉出＋待轉出；
           製程存量＝待投產＋待質控＋待轉出。97 前舊資料無待驗單 → 回退用報工帳（led）算，畫面不空白。 */
        const slipsAt=c=>(db.data.pending||[]).filter(q=>q.processCode===c&&q.status!=='void'&&(!pn||q.partNo===pn)&&(!wo||q.orderNo===wo)&&(!lot||q.lot===lot));
        const num=v=>v?'<b>'+v+'</b>':'<span class="muted">—</span>';

        const defQ=(k)=>db.data.containers.filter(b=>b.kind===k&&b.processCode===c&&(!pn||b.partNo===pn)&&(!wo||b.orderNo===wo)&&(!lot||b.lot===lot)).reduce((a,b)=>a+(+b.qty||0),0);
        const waitQc=slipsAt(c).filter(q=>q.status==='pending').reduce((a,q)=>a+(+q.qtyProd||0),0);   // 待質控
        const okNow=x.out, nr=defQ('NR'), ng=defQ('NG');                   // okNow＝物控清點後箱上實際的 OK 量

           ①97 前舊箱沒有待驗單，推算法只能顯示「—」，但待清點的箱幾乎全是舊箱＝整欄看不到東西
           ②會判回流箱沒有打單，推算法會把它誤算成正值 → 改讀 stockin.diff 兩個問題一次解決 */
        const stkBoxes=db.data.containers.filter(b=>b.processCode===c&&b.stockin
          &&(!pn||b.partNo===pn)&&(!wo||b.orderNo===wo)&&(!lot||b.lot===lot));
        const hasStk=stkBoxes.length>0;
        const diffQ=stkBoxes.reduce((a,b)=>a+(+b.stockin.diff||0),0);      // 帳差＝物控清點差異合計
        /* ★98-7 質控與物控各記各的事實，互不污染（使用者定案）：
           OK／已驗＝「質控當時驗的量」（把物控清點的短少加回來，物控少點不改質控的判定）；
           少掉的既不在已轉出也不在待轉出 → 已轉出＋待轉出 ＝ OK ＋ 帳差。 */
        const ok=okNow-diffQ;                                              // OK＝質控驗的良品量
        const insp=ok+nr+ng;                                               // 已驗＝OK＋NR＋NG（質控事實）
        /* ★98-5 已投產改回「已驗＋待質控」。98-1 曾改用待驗單生產數，但同一站會混
           舊箱（無待驗單，算不進生產數）與新箱 → 兩邊基準不同、勾稽對不起來（實機在壓鑄站抓到：

        const drawn=insp+waitQc;                                           // 已投產＝已驗＋待質控

        const waitOut=x.stock;                                             // 待轉出＝已驗產箱未點交

          <td>${num(drawn)}</td>
          <td>${(c===p.route[0]||!waitIn)?'<span class="muted">—</span>':'<b style="color:#b9760f">'+waitIn+'</b>'}</td>
          <td>${num(insp)}</td>
          <td>${ok?`<a class="lk" style="color:var(--green);font-weight:700" onclick="flowDetail('${c}','${pn}','${esc(wo||'')}','${esc(lot||'')}')">${ok}</a>`:'<span class="muted">—</span>'}</td>
          <td>${nr?`<a class="lk" style="color:#b9760f" onclick="flowDefect('${c}','${pn}','${esc(wo||'')}','${esc(lot||'')}','NR')">${nr}</a>`:'<span class="muted">0</span>'}</td>
          <td>${ng?`<a class="lk" style="color:var(--red)" onclick="flowDefect('${c}','${pn}','${esc(wo||'')}','${esc(lot||'')}','NG')">${ng}</a>`:'<span class="muted">0</span>'}</td>
          <td><b>${y}</b></td>

          <td>${hasStk?(diffQ?`<b style="color:${diffQ<0?'var(--red)':'#3355aa'}" title="物控清點差異合計（${stkBoxes.length} 箱清點過）">${diffQ>0?'+':''}${diffQ}</b>`:'<span class="muted">0</span>'):'<span class="muted" title="本站尚無箱做過物控清點">—</span>'}</td>
          <td>${movedOut?`<a class="lk muted" title="看已轉出的箱" onclick="flowStock('${c}','${pn}','${esc(wo||'')}','${esc(lot||'')}','moved')">${movedOut}</a>`:'<span class="muted">—</span>'}</td>
          <td>${waitOut?`<a class="lk" style="color:var(--teal);font-weight:700" title="看待轉出的箱（在本站等點交）" onclick="flowStock('${c}','${pn}','${esc(wo||'')}','${esc(lot||'')}','stock')">${waitOut}</a>`:'<span class="muted">—</span>'}</td>

function collectSources(cid,acc,depth,take){ const c=findC(cid); if(!c) return; acc.push({c,depth,take}); (c.sources||[]).forEach(s=>collectSources(s.cid,acc,depth+1,s.take)); }
function doTrace(){
  const cid=$('#t_cid').value.trim().toUpperCase(); const c=findC(cid); const out=$('#t_out'); clearTraceOuts('t_out');
  if(!c){ out.innerHTML=`<div class="card"><div class="note" style="border-color:var(--red);background:var(--redbg)">找不到箱號 ${esc(cid)}</div></div>`; return; }
  const chain=[]; collectSources(cid,chain,0,null);
  const roots=chain.filter(x=>!(findC(x.c.cid).sources||[]).length).map(x=>x.c.cid);
  // 依機種製程順序排站。chain 已是沿 sources 的真實路徑：
  // 正常 1→1 每站僅一箱；若有混批/分箱(下游箱有多個來源)，該站才會有多箱＝真實分支。
  const p=prodOf(c.partNo); const order=p?p.route:[...new Set(chain.map(x=>x.c.processCode))];
  const byStation={}; chain.forEach(x=>{ const a=byStation[x.c.processCode]=byStation[x.c.processCode]||[];
    if(!a.some(y=>y.c.cid===x.c.cid)) a.push(x); }); // 同箱去重
  const cols=order.filter(code=>byStation[code]);
  const colData=cols.map(code=>{ const arr=byStation[code]; return {code,arr,main:arr[0].c,take:arr[0].take,branch:arr.length>1}; });
  const hasBranch=colData.some(d=>d.branch);

  // 各欄：正常一箱顯示該箱；分支多箱則該欄列出每一個來源箱(各自的值)

    const hid=(d.main&&d.main.cid)?` data-cid="${d.main.cid}"`+(key?` data-focus="${key}"`:''):'';
    if(!d.branch) return `<td${hid} style="text-align:center">${fn(d.main,d)}</td>`;
    return `<td${hid} style="text-align:center">${d.arr.map(x=>fn(x.c,d,x)).join('<br><span style="color:#ccc">──</span><br>')}</td>`;
  }).join('');

    db.data.reports.forEach(r=>{ if(r.partNo===pn&&r.lot===lot&&r.toStation===code){
      input+=(r.draws||[]).reduce((a,x)=>a+(+x.take||0),0); ok+=(+r.ok||0); nr+=(+r.nr||0); ng+=(+r.ng||0); } });
    return {input,ok,nr,ng}; };
  const boxTypeLabel=(cc)=>{ if(cc.kind==='NR') return '<span style="color:#b9760f;font-weight:600">NR 不良箱</span>'; if(cc.kind==='NG') return '<span style="color:var(--red);font-weight:600">NG 報廢箱</span>'; if(cc.workType==='rework') return '<span style="color:#7a4dd0;font-weight:600">重工回流'+(cc.reworkOrder?'<br><span class="mono small">'+esc(cc.reworkOrder)+'</span>':'')+'</span>'; if(cc.workType==='release') return '<span style="color:#1f8a4c;font-weight:600">改判放行</span>'; return '<span class="muted">正常 (S)</span>'; };
  const boxBadge=(cc)=>{ const bg=cc.kind==='NG'?'#fdecea':(cc.kind==='NR'?'#fef3e0':(cc.workType==='rework'?'#efe9fb':'')); const fg=cc.kind==='NG'?'var(--red)':(cc.kind==='NR'?'#b9760f':(cc.workType==='rework'?'#7a4dd0':'')); return `<span class="badge"${bg?` style="background:${bg};color:${fg}"`:''}>${esc(cc.cid)}</span>`; };
  const rowDef=[
    [L('箱號'), (cc)=>boxBadge(cc),'box'],
    [L('箱別 / 工單類型'), (cc)=>boxTypeLabel(cc)],

    [L('NR 可重工'), (cc,d)=>{ const s=stStat(cc.partNo,cc.lot,cc.processCode); return s.nr?`<span style="color:#b9760f"><b>${s.nr}</b></span>`:'<span class="muted">0</span>'; }],
    [L('NG 報廢'), (cc,d)=>{ const s=stStat(cc.partNo,cc.lot,cc.processCode); return s.ng?`<span style="color:var(--red)"><b>${s.ng}</b></span>`:'<span class="muted">0</span>'; }],
    [L('良率'), (cc)=>{ const s=stStat(cc.partNo,cc.lot,cc.processCode); const proc=s.ok+s.nr+s.ng; return proc?`<b>${(s.ok/proc*100).toFixed(1)}%</b>`:'<span class="muted">—</span>'; }],
    [L('結存'), (cc)=>remaining(cc.cid),'balance'],
    [L('作業員'), (cc)=>esc(cc.operator||'—')],
    [L('設備'), (cc)=>esc(cc.machine||'—')+(cc.vendor?'（'+esc(cc.vendor)+'）':'')],
    [L('班別'), (cc)=>esc(cc.shift||'—')],
    ['工單號', (cc)=>cc.orderNo?'<a class="lk" onclick="gotoOrder(\''+cc.orderNo+'\',\''+(cc.partNo||'')+'\')">'+esc(cc.orderNo)+'</a>':'<span class="muted">—</span>'],
    [L('模具'), (cc)=>cc.mold?esc(cc.mold)+(cc.cavity?'（'+esc(cc.cavity)+'）':''):'<span class="muted">—</span>'],
    ['治夾具', (cc)=>jigsCell(cc)],
    [L('階段料號'), (cc)=>cc.stagePartNo?`<span class="mono small">${esc(cc.stagePartNo)}</span>`:'<span class="muted">—</span>'],
    /* ★97 質控斷點兩列：待驗單號＋QMS 單號（真，質控檢驗時回填；96-6 藏掉的示意假資料由此取代） */
    [L('待驗單號'), (cc)=>{ if(!cc.pid) return '<span class="muted">—</span>'; const sp=findP(cc.pid); return `<span class="mono small">${esc(cc.pid)}</span>${bfTag(cc.backfill||(sp&&sp.backfill),(sp&&sp.entryAt)||cc.entryAt)}`; }],
    [L('QMS 單號'), (cc)=>{ const p=cc.pid?findP(cc.pid):null; return (p&&p.qmsNo)?`<span class="mono small">${esc(p.qmsNo)}</span>`:'<span class="muted">—</span>'; }],
    ...(QMS_MOCK_ON?[

  const bodyRows=rowDef.map(([label,fn,key])=>`<tr><td style="position:sticky;left:0;background:#f3f6fa;font-weight:600;color:var(--navy);z-index:1">${label}</td>${cellsFor(fn,key)}</tr>`).join('');

    <div class="note" data-hl="cid:${cid}">查詢 <b>${esc(cid)}</b>（機種 ${esc(c.partNo)}${pnNm(c.partNo)?' — '+esc(pnNm(c.partNo)):''}）→ 沿來源往回追到原始壓鑄箱：<b>${roots.join(' / ')||esc(cid)}</b>${hasBranch?'　<span style="color:#b9760f">⑂ 此鏈有混批/分箱分支，分支站列出多個來源箱</span>':''}</div>

function resetAll(){ if(confirm('⚠⚠ 清空所有資料？\n\n★87 起資料在雲端：這會「同步清空雲端正式資料庫」，所有裝置一起清空、無法復原！\n（使用者定案：測試功能保留到上線穩定，之後移除）')){ db.data={products:[],containers:[],reports:[]}; db.save(); toast('已清空（含雲端）','ok'); go('dash'); } }

function seedDemo(){
  if((db.data.products.length||db.data.containers.length) && !confirm('⚠⚠ 載入示範資料會「清掉目前所有資料」（含你剛改的），確定要覆蓋嗎？\n\n★87 起資料在雲端：這會「同步覆蓋雲端正式資料庫」，所有裝置一起變示範資料！\n建議先按「匯出備份」留底。（測試功能保留到上線穩定，之後移除）')) return;
  db.data={products:[],containers:[],reports:[]};
  db.data.products=[
    {partNo:'BM04', model:'BM04', customer:'博盟', site:'敬得觀音', name:'BOTTOM U3-04 (檢包成品)', route:['DC','DB','CN','CT','TH','AS'], os:['CT'],
      stages:{DC:'G6A.BM04A00.D1103',DB:'G6A.BM04A00.F1103',CN:'G6A.BM04A10.M1105',CT:'G6A.BM04A14.C1204',TH:'G6A.BM04A14.M1201',AS:'GAA.BM04A14.A12'}},
    {partNo:'HS01A', model:'HS01A', customer:'和碩', site:'敬得觀音', name:'HS01AA700 COVER-ECU (組立成品)', route:['DC','CN','DB','VB','CT','AS'], os:['CT'],
      stages:{DC:'G6A.HS01A0D.11G01',CN:'G6A.HS01A0M.11G01',DB:'G6A.HS01A10.F1101',VB:'G6A.HS01A0F.11G01',CT:'G6A.HS01A0C.12G01',AS:'GAA.HS01A00.11G'}},
    {partNo:'55500000-001', model:'MINI2', customer:'SPACE X', site:'大永 SDY', name:'Mini 2 Kickstand 95×68×52', route:['DC','CN','GR','BL','PT','PK'], stages:{}},
    {partNo:'55500000-002', model:'MINI2', customer:'SPACE X', site:'大永 SDY', name:'Mini 2 Kickstand 304×42×39', route:['DC','CN','GR','BL','PT','PK'], stages:{}},
    {partNo:'55500000-003', model:'MINI2', customer:'SPACE X', site:'大永 SDY', name:'Mini 2 Kickstand 82×50×154', route:['DC','CN','GR','BL','PT','PK'], stages:{}},
  ];
  let clock=Date.now()-3*24*60*60*1000;
  const tick=(m)=>{ clock+=(m||20)*60*1000; return new Date(clock).toISOString(); };
  // 正式長碼批號：機種_YYMMDD(當批生產日)_班別_機台_流水（流水自動避開已存在的）
  const ymdOf=ms=>{ const d=new Date(ms); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
  const mkLot=(model,shift,machine)=>{ const base=String(model||'NA').replace(/\s+/g,'')+'_'+ymdOf(clock)+'_'+shiftCode(shift)+'_'+String(machine||'').replace(/[^A-Za-z0-9]/g,'')+'_'; const used=new Set(db.data.containers.map(c=>c.lot)); let n=1; while(used.has(base+String(n).padStart(2,'0'))) n++; return base+String(n).padStart(2,'0'); };
  const box=o=>{ o.sources=o.sources||[]; o.createdAt=tick(18); db.data.containers.push(o); return o; };
  const rep=o=>{ o.id='R'+(db.data.reports.length+1); o.createdAt=new Date(clock).toISOString(); db.data.reports.push(o); };
  // 報工：從 srcDraws=[{cid,take}] 產出一個 ok 箱（或併入 intoCid），記 NR/NG
  function work(pn,toCode,srcDraws,ok,nr,ng,op,mc,shift,vendor,intoCid){
    const first=findC(srcDraws[0].cid);
    const [okD,nrD,ngD]=splitDraws(srcDraws,[ok,nr,ng]);
    let cid=null;
    if(ok>0){
      if(intoCid){ const b=findC(intoCid); b.qty+=ok; b.sources.push(...okD); cid=intoCid; }
      else { cid=genCID(toCode);
        box({cid,partNo:pn,name:first.name,lot:first.lot,orderNo:first.orderNo,processCode:toCode,stagePartNo:stageNo(pn,toCode),
          qty:ok,operator:op,machine:mc,shift,vendor:vendor||'',workType:'normal',sources:okD.slice()}); }
    }
    const meta={op,mc,shift,vendor:vendor||'',createdAt:new Date(clock).toISOString()};
    const nrCid=nr>0?addDefect('NR',toCode,first,nrD,meta):null;
    const ngCid=ng>0?addDefect('NG',toCode,first,ngD,meta):null;
    rep({partNo:pn,lot:first.lot,fromStation:first.processCode,toStation:toCode,draws:srcDraws.slice(),ok,nr,ng,intoCid:cid,nrCid,ngCid,shift,operator:op});
    return cid;
  }

  // ===== BM04：示範「FIFO 先進先出 + 部分領用 + 委外 + 到成品」 =====
  // 壓鑄分三次（不同天）產出三箱（100/130/200），同一批 lotA，三個箱號
  const woB='WO-BM04-2601';
  clock=Date.now()-9*24*60*60*1000;
  const lotA=mkLot('BM04','早','DC108');
  const d1=box({cid:genCID('DC'),partNo:'BM04',lot:lotA,orderNo:woB,processCode:'DC',qty:100,operator:'阮文海 Hải',machine:'DC108',shift:'早',stagePartNo:stageNo('BM04','DC')});
  const d2=box({cid:genCID('DC'),partNo:'BM04',lot:lotA,orderNo:woB,processCode:'DC',qty:130,operator:'阮文海 Hải',machine:'DC108',shift:'早',stagePartNo:stageNo('BM04','DC')});
  const d3=box({cid:genCID('DC'),partNo:'BM04',lot:lotA,orderNo:woB,processCode:'DC',qty:200,operator:'阮文海 Hải',machine:'DC108',shift:'早',stagePartNo:stageNo('BM04','DC')});
  // 毛邊 FIFO：先把最早的 d1 整箱領完(100)，再動 d2 一部分(50)，d3 完整未動
  const f1=work('BM04','DB',[{cid:d1.cid,take:100}],96,2,2,'黎氏花 Hoa','毛邊台','D1早');   // d1 領完
  const f2=work('BM04','DB',[{cid:d2.cid,take:50}],48,1,1,'黎氏花 Hoa','毛邊台','D2早');    // d2 部分(剩80)；d3 未動(剩200)
  // 機加 FIFO：領最早的 f1 整箱(96)；f2 留在毛邊當在製
  const m1=work('BM04','CN',[{cid:f1,take:96}],93,2,1,'陳文俊 Tuấn','M1+M2','D3早');
  // 皮膜(委外 3金瑚)：m1 整箱領出
  const c1=work('BM04','CT',[{cid:m1,take:93}],91,1,1,'—','委外','D5','3金瑚');
  // 巡牙：領皮膜 OK
  const t1=work('BM04','TH',[{cid:c1,take:91}],89,1,1,'范氏蘭 Lan','巡牙機','D6早');
  // 組立(檢包成品)：領巡牙 OK → 成品
  work('BM04','AS',[{cid:t1,take:89}],88,1,0,'范氏蘭 Lan','檢包台','D7早');
  // 會判重工示範：BM04 毛邊(DB)累積的 NR 不良箱（f1+f2=3）→ 工程品保會判：重工 2 回流、報廢 1
  { const nb=db.data.containers.find(c=>c.kind==='NR'&&c.lot===lotA&&c.processCode==='DB');
    if(nb) reworkDispose(nb.cid,2,1,0,'R-BM04-2601','品保會判','品保 陳 Chen',new Date(clock).toISOString()); }

  /* ★85-6：V5-001（demo 模擬機種）兩段示範資料已移除（使用者定案 260722 全部清除）；
     FIFO/混批/區間分析等示範改由其他機種涵蓋或實際資料驗證。 */

  // ===== STARLINK 55500000-001：急料接力範例（壓鑄分兩次領、CNC 接力併箱） =====
  clock=Date.now()-1*24*60*60*1000; const woS='LSX/TY-STARLINK', sA=mkLot('MINI2','早','DC-11');
  const sdc=box({cid:genCID('DC'),partNo:'55500000-001',lot:sA,orderNo:woS,processCode:'DC',qty:120,operator:'阮文海 Hải',machine:'DC-11',shift:'早'});
  // 急料：CNC 先領 50 做出一箱，再領 40 併入同一箱（接力），壓鑄還剩 30
  const scn=work('55500000-001','CN',[{cid:sdc.cid,take:50}],48,2,0,'黎氏花 Hoa','CNC-04','早A');
  work('55500000-001','CN',[{cid:sdc.cid,take:40}],39,1,0,'黎氏花 Hoa','CNC-04','早A',null,scn); // 併入 scn

  // ===== STARLINK 002：停在噴砂（在製）；003：停在烤漆（在製）。各一批 =====
  clock=Date.now()-1*24*60*60*1000+3*60*60*1000; const s2=mkLot('MINI2','早','DC-11');
  { const dc=box({cid:genCID('DC'),partNo:'55500000-002',lot:s2,orderNo:'LSX/TY-STARLINK',processCode:'DC',qty:150,operator:'阮文海 Hải',machine:'DC-11',shift:'早'});
    const cn=work('55500000-002','CN',[{cid:dc.cid,take:150}],147,3,0,'黎氏花 Hoa','CNC-04','早');
    const gr=work('55500000-002','GR',[{cid:cn,take:147}],146,1,0,'陳文俊 Tuấn','GR-02','早');
    work('55500000-002','BL',[{cid:gr,take:146}],145,1,0,'陳文俊 Tuấn','BS-04','早'); }
  clock=Date.now()-12*60*60*1000; const s3=mkLot('MINI2','早','DC-11');
  { const dc=box({cid:genCID('DC'),partNo:'55500000-003',lot:s3,orderNo:'LSX/TY-STARLINK',processCode:'DC',qty:100,operator:'阮文海 Hải',machine:'DC-11',shift:'早'});
    const cn=work('55500000-003','CN',[{cid:dc.cid,take:100}],99,1,0,'黎氏花 Hoa','CNC-04','早');
    const gr=work('55500000-003','GR',[{cid:cn,take:99}],97,2,0,'陳文俊 Tuấn','GR-02','早');
    const bl=work('55500000-003','BL',[{cid:gr,take:97}],96,1,0,'陳文俊 Tuấn','BS-04','早');
    work('55500000-003','PT',[{cid:bl,take:96}],95,1,0,'范氏蘭 Lan','粉烤線','早'); }

  // ===== HS01A：完整跑到組立成品（每站有不良；皮膜委外 3昇榮）；另一批停在振動 =====
  clock=Date.now()-7*24*60*60*1000; const woH='WO-HS01A-2601', hA=mkLot('HS01A','早','DC201');
  { let prev=box({cid:genCID('DC'),partNo:'HS01A',lot:hA,orderNo:woH,processCode:'DC',qty:500,operator:'阮文海 Hải',machine:'DC201',shift:'早',stagePartNo:stageNo('HS01A','DC')});
    const steps=[['CN',496,4,0,'黎氏花 Hoa','CNC-02',''],['DB',493,3,0,'陳文俊 Tuấn','手工',''],['VB',491,2,0,'陳文俊 Tuấn','VB-01',''],['CT',489,2,0,'—','委外','3昇榮'],['AS',487,2,0,'范氏蘭 Lan','組立線','']];
    steps.forEach(([code,ok,nr,ng,op,mc,vd])=>{ const take=prev.qty?remaining(prev.cid):0; const t=ok+nr+ng;
      prev=findC(work('HS01A',code,[{cid:prev.cid,take:t}],ok,nr,ng,op,mc,'早',vd)); }); }
  clock=Date.now()-2*24*60*60*1000-5*60*60*1000; const hB=mkLot('HS01A','早','DC201');
  { let prev=box({cid:genCID('DC'),partNo:'HS01A',lot:hB,orderNo:woH,processCode:'DC',qty:480,operator:'阮文海 Hải',machine:'DC201',shift:'早',stagePartNo:stageNo('HS01A','DC')});
    const steps=[['CN',477,3,0,'黎氏花 Hoa','CNC-03'],['DB',475,2,0,'陳文俊 Tuấn','手工'],['VB',473,2,0,'陳文俊 Tuấn','VB-01']];
    steps.forEach(([code,ok,nr,ng,op,mc])=>{ const t=ok+nr+ng; prev=findC(work('HS01A',code,[{cid:prev.cid,take:t}],ok,nr,ng,op,mc,'早')); }); }

  // 3a-2：測試資料一律蓋「已接收」章（嚴格模式下才有東西可直接報工示範）；新建的箱照常走真點交流程
  db.data.containers.forEach(c=>{ const nx0=isNormalBox(c)?nextStation(c.partNo,c.processCode):null;
    if(nx0&&!c.received) c.received={station:nx0,by:'測試資料',at:nowISO(),expect:c.qty,actual:c.qty,diff:0,resp:'',note:'',kind:isOS(c.partNo,nx0)?'sendout':'receive'}; });
  /* ★86 工單已上雲：demo 工單不再生成（工單一律真實）。示範箱的 orderNo 查無工單明細＝預期 */
  db.save();
  toast('已載入測試資料：'+db.data.products.length+' 機種 / '+db.data.containers.filter(isNormalBox).length+' 箱','ok'); go('dash');
}

/* ★ 階段1：改為「先登入 → 再啟動」。未登入不 render 主畫面、不載入示範資料。
   （示範資料的載入已移進 bootApp；登入成功才會跑） */
(function initMHR(){
  const s=getSession();
  if(s && s.token && s.profile){ if(s.mustChange) showChangePwd(); else bootApp(); }
  else { preloadOms(); const e=$('#lg_email'); if(e) e.focus(); }   // ★88-3 未登入＝顯示登入頁：背景預載 OMS 名單快取（工號驗證秒回）
})();
/* 等比縮放：以 14 吋(基準寬 1366px) 為設計基礎，大螢幕按比例放大（字體+欄寬+間距整體等比；小於基準維持1，可橫捲）
   ★ 別加「高度上限」去壓 zoom：body 有 zoom 時 CSS 座標系會等比縮小，
     例如 1920×937 @zoom1.41 → 版面實際看到 1362×665，本來就會命中上面
     `(max-height:700px)` 而自動改成頂部橫向選單。若硬壓 zoom（如 ÷760→1.23），
     CSS 高度反而變 762 >700 → 又切回直式側欄 → 選單被切掉。實測驗過，勿再加。 */
function fitScale(){ try{
  const z=Math.max(1,Math.min(1.7,window.innerWidth/1366));
  document.body.style.zoom=z;
  /* 側欄高度要扣掉 zoom（見 .side 的 --vh 註解），否則側欄盒子比螢幕還高、底部被推出畫面 */
  document.documentElement.style.setProperty('--vh',(window.innerHeight/z)+'px');
}catch(e){} }
window.addEventListener('resize',fitScale); fitScale();
</script>
