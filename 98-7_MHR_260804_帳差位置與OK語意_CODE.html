<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHR 製造履歷系統 — 開發測試版 v98-7</title><!-- 每版另存時記得同步改 title 與側欄 tag 的版號 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- ★88-8 Excel 直接匯入（免先轉 CSV）：SheetJS 讀 .xlsx 轉成同一套 rows 陣列 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#16335B; --navy2:#1B2A4A; --teal:#1C7A86; --teal-d:#155f69;
    --blue:#2B4C86; --gold:#D9912A; --goldbg:#FBF1DC;
    --green:#2E8B57; --red:#C0392B; --redbg:#FBEDED;
    --bg:#EEF2F7; --card:#FFFFFF; --ink:#1F2A37; --muted:#64707D;
    --line:#DCE3EC; --light:#F4F7FB; --purple:#6A4C93;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  code,.mono{font-family:"Consolas","SF Mono",ui-monospace,monospace}
  .app{display:flex;min-height:100vh}
  /* ★ height 用 --vh 而非 100vh：body 有 zoom 時 100vh 不會跟著縮，側欄盒子會被放大成
     螢幕高×zoom（實測 1920 螢幕 937 → 側欄 1321px）→ 底部整個被推出畫面。
     --vh 由 fitScale 設為 innerHeight/zoom，讓側欄渲染後剛好等於螢幕高。 */
  .side{width:230px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:var(--vh,100vh);overflow-y:auto}
  /* 側欄：14 個選單項要一頁放得下、不出現上下捲軸（原本每項 47px → 內容 977px 超出 820 視窗 157px） */
  /* ★88 主標加強醒目（使用者 260723 要求）：字放大加粗＋teal 亮色＋左側色條 */
  .brand{padding:14px 18px 12px;border-bottom:1px solid rgba(255,255,255,.12);border-left:4px solid var(--teal);background:linear-gradient(90deg,rgba(28,122,134,.28),transparent)}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:2px;color:#7FD4DE;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .brand .sub{font-size:12px;color:#C9D8E8;margin-top:3px;font-weight:600;letter-spacing:1px}
  .brand .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;background:var(--gold);color:#1F2A3A;padding:2px 10px;border-radius:10px}
  nav{padding:5px 0;flex:1}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C7D4E6;
    padding:5px 18px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;font-family:inherit}   /* ★97 側欄 15 項：間距 6→5px 塞下（⑦A 案） */
  nav button .n{font-size:11px;color:#7FB0C8;width:16px}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  /* 選單的英文：側欄配色（.sec 預設的灰在深藍底上太暗） */
  nav button .sec{color:#7FB0C8;font-size:10px;margin-left:5px}
  nav button.on{background:rgba(28,122,134,.25);color:#fff;border-left-color:var(--teal)}
  nav .navsep{margin:6px 0 1px;padding:6px 18px 3px;font-size:11px;color:#7FB0C8;border-top:1px solid rgba(255,255,255,.14);letter-spacing:.5px}
  /* （navsep 的橫向樣式已隨側欄一起移到 ≤1024 的區塊；原本掛在 ≤760 會與側欄門檻不同步） */
  .side .foot{padding:8px 18px;font-size:10.5px;line-height:1.5;color:#7c8ba3;border-top:1px solid rgba(255,255,255,.1)}
  .devtools summary{cursor:pointer;color:#9FB4CC;list-style:none;padding:3px 0;user-select:none}
  .devtools summary::-webkit-details-marker{display:none}
  .devtools summary::before{content:'▸ '}
  .devtools[open] summary::before{content:'▾ '}
  .devtools .devbody{margin-top:3px}
  .side .foot a{color:#9FB4CC;cursor:pointer;text-decoration:underline}
  .lk{cursor:pointer;border-bottom:1px dashed var(--teal);color:inherit}
  .lk:hover{color:var(--teal)}
  .seq{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#edf3f8;color:#34618c;font-size:11px;border:1px solid #d6e2ee;white-space:nowrap}
  .qms{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:6px;font-size:12px;border:1px solid rgba(0,0,0,.06)}
  .main{flex:1;padding:18px 18px;min-width:0}
  .page-h{margin-bottom:8px}
  .page-h h2{font-size:16px;color:var(--navy)}
  .page-h p{color:var(--muted);font-size:12px;margin-top:3px}
  /* 85-7 全站間距緊縮（使用者定案：留白過大 → 收斂一處改全站，比照字級規則精神） */
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,70,.05)}
  .card h3{font-size:14px;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card h3 .vi{font-size:10px;color:var(--muted);font-weight:400}
  .sec{font-weight:400;color:#9aa6b2;font-size:10px;margin-left:5px}
  th .sec{color:#bcd0e8;display:block;margin-left:0;font-size:10px;font-weight:400}
  .hnw th,.hnw td{white-space:nowrap}
  th{vertical-align:top}
  .recent th{white-space:nowrap}
  .recent th,.recent td{padding:6px 11px}
  .recent .pill{white-space:nowrap}
  .recent td:nth-child(7),.recent th:nth-child(7){text-align:right}
  .recent td:first-child,.recent th:first-child{padding-right:18px}
  .numtbl td:not(:first-child),.numtbl th:not(:first-child){text-align:right}
  .numtbl th,.numtbl td{padding:6px 7px}
  .numtbl .pill{padding:2px 7px}
  /* 右上角工具列：身分／登出 ＋ 語言切換（位置比照 QMS） */
  .topbar{position:absolute;top:12px;right:16px;z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .userbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;
    box-shadow:0 2px 8px rgba(20,40,70,.12);padding:5px 12px;font-size:12px;white-space:nowrap}
  .userbar .u-name{font-weight:700;color:var(--navy)}
  .userbar .u-meta{color:var(--muted)}
  .userbar .u-sep{color:var(--line)}
  .userbar a{color:var(--teal);cursor:pointer;text-decoration:none;font-weight:600}
  .userbar a:hover{text-decoration:underline}
  .langbar{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px rgba(20,40,70,.12);overflow:hidden}
  .langbar button{background:#fff;border:0;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;letter-spacing:.3px}
  .langbar button+button{border-left:1px solid var(--line)}
  .langbar button.on{background:var(--teal);color:#fff}
  @media(max-width:900px){ .topbar{top:8px;right:8px;gap:5px} .langbar button{padding:5px 9px;font-size:11px}
    .userbar{padding:4px 9px;font-size:11px;gap:6px} .userbar .u-meta{display:none} }
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}   /* ★97-2 g5＝總覽 5 張 KPI 卡排一行 */
  /* 平板橫式 / 中等寬度（901–1024）：保留側欄，但寬表格可橫向捲、四欄表單收成兩欄 */
  /* ★ 側欄改「頂部橫向選單」的門檻：≤1024（原本 900）。
     理由：現場用平板。iPad 橫式可用視窗只有 1024×694（1024×768 扣掉瀏覽器列），
     14 項直式選單需 754px 放不下 → 一定要上下捲。門檻設 1024 讓平板橫式自動改橫向選單，
     高度問題直接消失，且橫向大按鈕用手指點更好按。（單欄化/字級仍維持 ≤900 不動） */
  @media(max-width:1024px), (max-height:700px){
    .main{padding:22px 20px}
    .g4{grid-template-columns:1fr 1fr}
    .g5{grid-template-columns:repeat(3,1fr)}   /* ★97-2 平板橫式：5 張擠不下 → 3+2 */
    table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:column}
    .brand{padding:12px 16px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .brand h1{font-size:18px}
    .brand .sub{font-size:10px;margin-top:0}
    .brand .tag{margin-top:0}
    nav{display:flex;overflow-x:auto;padding:0;flex:none;-webkit-overflow-scrolling:touch}
    nav button{flex:0 0 auto;width:auto;border-left:0;border-bottom:3px solid transparent;padding:7px 8px;white-space:nowrap;font-size:12px;text-align:center;line-height:1.25}
    nav button.on{border-left:0;border-bottom-color:var(--teal)}
    nav button .n{display:none}
    /* ★ 橫向選單：英文換到中文下方。並排的話 14 項會爆寬 → 被迫左右捲（比上下捲更難用）。
       改成上下堆疊 → 每項寬度約少一半、一行放得下，且英文照樣保留。 */
    nav button .sec{display:block;margin-left:0;font-size:9px;line-height:1.15;opacity:.85}
    /* ★「⚙ 設定 / 管理」分隔標題在橫向模式隱藏 —— 它自己就佔 ~110px，
       但橫排時分組意義不大（項目本來就照順序排），省下來給選單項。 */
    nav .navsep{display:none}
    .side .foot{display:block;padding:8px 14px;border-top:1px solid rgba(255,255,255,.1);white-space:nowrap;overflow-x:auto;font-size:11px}
    .side .foot br{display:none}
    .side .foot a,.side .foot label{margin-right:14px}
  }
  /* 平板直式 / 手機（≤900）：全部單欄 */
  @media(max-width:900px){
    .g2,.g3,.g4,.g5{grid-template-columns:1fr}
    .main{padding:16px 14px;max-width:100%}
    .page-h h2{font-size:20px}
    .row{flex-wrap:wrap}
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
  label .vi{font-weight:400;color:#9aa6b2}
  input,select,textarea{width:100%;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;background:#fff}
  textarea{min-height:130px;resize:vertical;line-height:1.7}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
  input.mono{font-size:15px;letter-spacing:.3px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:0;border-radius:7px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;color:#fff;background:var(--teal)}
  .btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
  .btn.navy{background:var(--navy)}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}
  .btn.gold{background:var(--gold)}.btn.gray{background:#7a8696}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}
  .btn.lg{padding:15px 26px;font-size:17px}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn.sm{padding:4px 10px;font-size:12px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  /* 85-7 表格通用規則（使用者定案）：一行放得下就不折行（th/td/pill 全面 nowrap；長表靠外層容器橫捲） */
  th{background:var(--navy);color:#fff;text-align:left;padding:5px 9px;font-weight:600;font-size:12px;white-space:nowrap}
  td{padding:4px 9px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
  .hl,tr.hl>td{background:#FFE08A !important;animation:hlf 1.6s ease 2}
  div.hl{box-shadow:0 0 0 3px #C0392B;border-radius:6px}
  @keyframes hlf{0%,50%{background:#FFD24D}100%{background:#FFE08A}}
  .tblwrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  /* 85-3 主檔緊湊表格（設備清單）：字級縮小＋行距緊湊＋內容一行不換行（pill 含中英站名） */
  .compact table{font-size:12px}
  .compact th,.compact td{padding:4px 8px;white-space:nowrap}
  .compact .pill{white-space:nowrap;font-size:10px}
  .compact input,.compact select{font-size:12px;padding:3px 5px}
  .tblwrap thead th{position:sticky;top:0;z-index:3}
  tr:nth-child(even) td{background:var(--light)}
  .pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill.ok{background:#e6f4ec;color:var(--green)}.pill.ng{background:var(--redbg);color:var(--red)}
  .pill.dc{background:#e3f0f2;color:var(--teal)}.pill.pk{background:#e9eefa;color:var(--blue)}
  .pill.os{background:#ede6f5;color:var(--purple)}
  .badge{font-family:Consolas,monospace;background:var(--navy);color:#fff;padding:3px 9px;border-radius:5px;font-size:13px;letter-spacing:.5px;white-space:nowrap}
  .muted{color:var(--muted)}.small{font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:26px;font-size:13.5px}
  .note{background:var(--goldbg);border-left:4px solid var(--gold);padding:11px 14px;border-radius:6px;font-size:12.5px;margin-bottom:16px}
  /* 84-5 標籤＝直式 寬60mm×高80mm（使用者定案）＝原本樣式（深藍表頭卡）＋Code 128（值靠左、每欄獨立一列、含 CID 列） */
  .lblcard{border:1.5px solid var(--navy);border-radius:2.5mm;width:60mm;height:80mm;background:#fff;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
  .lblcard .hd{display:flex;justify-content:space-between;align-items:center;background:var(--navy);padding:1.4mm 2.5mm;flex:0 0 auto;overflow:hidden}
  /* ★96-1 表頭鎖一行＋縮高（使用者定案）；★96-2 內距微收＝21 站「中＋越」全數實測放得下（最長=振研 Đánh bóng rung） */
  .lblcard .hd b{color:#fff;font-size:10pt;white-space:nowrap}
  .lblcard .hd .small{font-size:8pt;color:#CFD8EA;white-space:nowrap;margin-left:1mm;overflow:hidden;text-overflow:ellipsis}
  /* 84-6 字體加大（好查看）：欄名9pt/值10pt；LOT·階段料號長字串8pt(.sm)；CID·QTY 重點加粗10.5pt(.big)；條碼確實置中 */
  .lblbody{padding:1mm 3mm 0;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .lblrow{display:flex;align-items:baseline;font-size:9pt;line-height:1.2;padding:.4mm 0}   /* ★96-1 行距縮小（使用者定案） */
  .lblrow span{color:#555;white-space:nowrap}
  .lblrow span:first-child{flex:0 0 11mm}   /* ★96-1 欄名去中文後縮窄（15→11mm），值區多 4mm */
  .lblrow b{font-family:Consolas,monospace;font-size:10pt;text-align:left;white-space:nowrap}
  .lblrow b.sm{font-size:8pt}
  .lblrow b.big{font-size:10.5pt;font-weight:800}
  .lblrow b.wr{white-space:normal;line-height:1.15;font-size:9.5pt}
  /* ★96-1 OP/QC 人名列：越中雙名（如 Vương Văn Thiệu 王文邵）超過 60mm 會被切——
     改 8.5pt＋允許折行，短名維持一行、長名完整印出不截斷 */
  .lblrow b.nm{font-size:8.5pt;white-space:normal;line-height:1.15;word-break:break-word}
  .barid .barcap{font-size:8pt;color:#556;font-weight:400;letter-spacing:0;margin-left:2mm}
  /* ★96-1 批次序號放 QR 同高度右側空白（使用者定案）：QR 置中不動、序號絕對定位在右側垂直置中 */
  .barwrap .capside{position:absolute;right:3mm;top:50%;transform:translateY(-50%);font-family:Consolas,monospace;font-size:8pt;color:#556}
  /* ★96-1 QR/條碼不再貼底（使用者定案）：原 margin-top:auto 貼底＝內容一多（人名折行）就被擠壓、
     箱號字被裁掉；改跟在最後一欄後面，底部留白當緩衝，折行只吃留白不吃條碼 */
  .barwrap{margin-top:1mm;text-align:center;padding:0 0 1mm;flex:0 0 auto}
  .barwrap svg{width:100%;max-width:52mm;height:11mm;display:block;margin:0 auto}
  /* ★88-7 QR 尺寸限制（標籤 60×80mm，QR 控在 16mm 見方；display:block 消除 inline 行高留白，
     否則底下的箱號文字會被擠出卡片） */
  .lblcard .barwrap .qrbox{line-height:0;font-size:0}
  .lblcard .barwrap .qrbox img,.lblcard .barwrap .qrbox canvas{width:16mm!important;height:16mm!important;border:0;border-radius:0;display:block}
  .barid{font-family:Consolas,monospace;font-size:10pt;letter-spacing:1px}
  .qrwrap{display:flex;gap:16px;align-items:center;margin-top:12px}
  #qrbox img,#qrbox canvas,.qrbox img,.qrbox canvas{border:1px solid var(--line);border-radius:6px}
  /* A2 列印標籤浮層：多張標籤排版＋只印標籤 */
  /* ★96-1 浮層背景改不透明：原 rgba .55 半透明，底下頁面（建箱後 #labelArea 的整批標籤）會透出來，
     跟浮層裡的標籤視覺交錯、像「超出頁面」；列印本來就只印浮層，改不透明只影響螢幕預覽 */
  #printOverlay{display:none;position:fixed;inset:0;background:#16233C;z-index:200;overflow:auto;padding:20px}
  #printOverlay .po-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:0 auto 14px;max-width:920px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  #printOverlay .po-labels{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:920px;margin:0 auto}
  @media print{
    /* 84-3 只留浮層：改用「除了 #printOverlay 全部隱藏」——topbar/語言鈕先前沒被舊清單蓋到，印出來疊在標籤上 */
    body.printing>*:not(#printOverlay){display:none!important}
    body.printing #printOverlay{position:static;background:#fff;padding:0;display:block!important;overflow:visible;zoom:1!important}
    /* ↑ zoom:1!important：84-1 給浮層的螢幕抵銷(1/z, inline)在列印時要強制歸一，否則 body=1 × 浮層0.7 → 標籤縮小錯位 */
    body.printing #printOverlay .po-bar{display:none!important}
    #printOverlay .po-labels{display:block;max-width:none}
    #printOverlay .lblcard{break-inside:avoid;page-break-inside:avoid;page-break-after:always;margin:0}
    @page{size:60mm 80mm;margin:0}   /* 84-5 直式：一箱一頁；標籤機驅動選 寬60×高80 紙張即可（跟一般列印一樣選印表機） */
    body.printing{zoom:1!important}  /* 84-1 ★body zoom 三坑+1：等比縮放(fitScale 1~1.7)連 mm 實體尺寸一起放大→列印超出 80×60，列印時強制歸一 */
  }
  .chip{display:inline-block;background:var(--light);border:1px solid var(--line);padding:5px 10px;border-radius:7px;margin:3px 4px 3px 0;font-size:13px;cursor:pointer}
  .chip.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
  .step{font-size:12px;color:var(--muted);margin-bottom:4px}
  .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  .flow .st{background:var(--light);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:12.5px;font-weight:600}
  .flow .st.done{background:var(--teal);color:#fff;border-color:var(--teal)}
  .flow .st.now{background:var(--gold);color:#fff;border-color:var(--gold)}
  .flow .ar{color:var(--muted)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 24px;border-radius:9px;
    box-shadow:0 6px 22px rgba(0,0,0,.25);font-size:14.5px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80vw}
  .toast.show{opacity:1;bottom:34px}.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
  .kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.15}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap}
  .trace-node{border-left:3px solid var(--teal);padding:10px 14px;margin:8px 0 8px 6px;background:var(--light);border-radius:0 8px 8px 0}
  .trace-matrix{min-width:600px}
  .trace-matrix th,.trace-matrix td{border:1px solid var(--line);padding:8px 10px;font-size:13px;white-space:nowrap}
  .trace-matrix thead th{background:var(--navy);color:#fff}
  .trace-node .cid{font-family:Consolas,monospace;font-weight:700;color:var(--navy)}
  .src{font-size:12px;color:var(--muted);margin-top:3px}
  .wipbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
  .wipbar i{display:block;height:100%;background:var(--teal)}
  /* ===== 階段1：登入畫面（email＋密碼；不做廠區下拉——廠區/權限本來就在 profile 裡） ===== */
  #login-screen{position:fixed;inset:0;z-index:300;overflow:auto;padding:20px;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#0e1c33 100%);
    display:flex;align-items:center;justify-content:center}
  .lgcard{background:#fff;border-radius:14px;padding:32px 30px;width:100%;max-width:392px;box-shadow:0 18px 50px rgba(0,0,0,.38)}
  /* 登入頁品牌區：結構比照 QMS —— ① 公司 LOGO ② 系統代號＋中文名 ③ 英文副標 */
  .lgbrand{text-align:center;margin-bottom:20px}
  .lgbrand img{max-width:200px;height:auto;display:block;margin:0 auto}
  .lgbrand .lgtitle{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:.02em;margin-top:12px}
  .lgbrand .lgsub{font-size:12px;color:#888;margin-top:4px}
  #login-screen label{margin-top:12px}
  .lgerr{background:var(--redbg);border-left:4px solid var(--red);color:var(--red);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:6px}
  .lghint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.65}
  /* 管理員捷徑：只帶入 email，密碼照樣要打（比照 QMS 的 ADMIN_EMAIL 寫死做法） */
  .lgadmin{margin-top:10px;text-align:center}
  .lgadmin a{display:inline-block;font-size:12px;color:var(--navy);background:var(--light);border:1px solid var(--line);
    border-radius:7px;padding:6px 12px;cursor:pointer;text-decoration:none;font-weight:600}
  .lgadmin a:hover{background:#e9eefa;border-color:var(--blue)}
  .lgfoot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px}
  .lgfoot a{color:var(--teal);text-decoration:none;cursor:pointer}
  .lgfoot a:hover{text-decoration:underline}
</style>
</head>

function dbToRow(kind,o){ const m=DB_MAPS[kind]; const row={}, extra={};

async function dbSyncKind(kind){ const m=DB_MAPS[kind];

    const j=JSON.stringify(o); if(snap[k]!==j) ups.push(dbToRow(kind,o)); });

  if(st==='err'&&prev!=='err') toast('☁️ 雲端同步失敗：'+(msg||'')+'——資料暫存本機自動重試中，請勿關閉或重整頁面！','err');
  if(!el) return;
  el.innerHTML= st==='ok'  ? '<span style="color:#7fd4a0">☁️ 已同步</span>'
             : st==='sync'||st==='pend' ? '<span style="color:#f0c674">⏳ 同步中…</span>'
             : st==='load' ? '<span style="color:#9FB4CC">☁️ 載入中…</span>'
             : '<span style="color:#e88" title="'+esc(msg||'')+'">🔴 同步失敗，10秒後重試</span>'; }
/* 一次性搬遷：雲端三表全空 且 本機舊庫有資料 → 整包上雲（只跑一次） */
async function dbMigrateLocal(){
  if(localStorage.getItem('mhr_3c_migrated')) return;
  if(db.data.containers.length||db.data.reports.length||db.data.products.length){ localStorage.setItem('mhr_3c_migrated','1'); return; }
  try{ const r=localStorage.getItem(DB_KEY); if(!r){ localStorage.setItem('mhr_3c_migrated','1'); return; }
    const old=JSON.parse(r)||{};
    if((old.containers||[]).length||(old.products||[]).length){
      db.data={products:old.products||[],containers:old.containers||[],reports:old.reports||[]};
      await dbSyncUp();
      toast('已把本機舊資料搬遷上雲（'+db.data.containers.length+' 箱）','ok');
    }
  }catch(e){}
  localStorage.setItem('mhr_3c_migrated','1');
}
/* 一次性資料修正：舊 localStorage 的 機種 Mini2 Kickstand→MINI2、品名去掉(STARLINK)、批號 Mini2Kickstand→MINI2 */
(function migrateData(){ let ch=false;
  (db.data.products||[]).forEach(p=>{ if(p.model==='Mini2 Kickstand'){p.model='MINI2';ch=true;} if(p.name&&p.name.indexOf('(STARLINK)')>=0){p.name=p.name.replace(/\s*\(STARLINK\)\s*/,' ').replace(/\s{2,}/g,' ').trim();ch=true;} });
  (db.data.containers||[]).forEach(c=>{ if(c.lot&&c.lot.indexOf('Mini2Kickstand')>=0){c.lot=c.lot.replace(/Mini2Kickstand/g,'MINI2');ch=true;} });
  (db.data.reports||[]).forEach(r=>{ if(r.lot&&r.lot.indexOf('Mini2Kickstand')>=0){r.lot=r.lot.replace(/Mini2Kickstand/g,'MINI2');ch=true;} });
  if(ch) db.save();
})();

const PROC_NEEDMC_DEFAULT={DC:1,CN:1,GR:1,BL:1,VB:1,TH:1};
/* ★88 站別開關上雲（mhr_settings，key='proc_needmc'/'proc_needqc'，value=jsonb {DC:true,...}）＝每裝置一致；
   舊 localStorage mhr_proc_needmc/needqc 首開自動搬遷（旗標 mhr_set_migrated）。班別質控快取/上次作業員=裝置偏好，留本機 */
let MHR_SETTINGS={}, MHR_SET_STATUS='未載入';
async function loadSettings(){
  const d=await sbGet('mhr_settings?select=*');
  MHR_SETTINGS={}; (Array.isArray(d)?d:[]).forEach(r=>{ MHR_SETTINGS[r.key]=r.value; });
  MHR_SET_STATUS='已載入';
  if(!localStorage.getItem('mhr_set_migrated')){
    for(const k of ['proc_needmc','proc_needqc']){
      let v=null; try{ v=JSON.parse(localStorage.getItem('mhr_'+k)||'null'); }catch(e){}
      if(v && MHR_SETTINGS[k]===undefined) await setSetting(k,v,true);
    }
    localStorage.setItem('mhr_set_migrated','1');
  }
}
async function setSetting(key,value,silent){
  MHR_SETTINGS[key]=value;
  const r=await sbWrite('POST','mhr_settings?on_conflict=key',[{key,value,updated_at:new Date().toISOString()}],'resolution=merge-duplicates');
  if(!r.ok && !silent) toast('設定同步失敗：'+(r.error||''),'err');
}
function procNeedMc(code){ if(!code) return false; if(code.indexOf('+')>=0) return code.split('+').some(procNeedMc);
  const m=MHR_SETTINGS.proc_needmc; if(m&&Object.prototype.hasOwnProperty.call(m,code)) return !!m[code];
  return !!PROC_NEEDMC_DEFAULT[code]; }
function setProcNeedMc(code,on){ const m=Object.assign({},MHR_SETTINGS.proc_needmc||{}); m[code]=!!on; setSetting('proc_needmc',m); toast(stN(code)+(on?'：需記設備':'：不需記設備')+'（已存雲端）','ok'); }

/* ★97-8 recv＝委外接收人名單 [{name,phone,active}]（存 mhr_vendors.extra.receivers，零新表零 SQL）；
   _extra＝原本的 extra 整包，寫回時合併保留，避免蓋掉別人放的鍵 */
function normSite(s){ const sh=s.short||s.name||''; return {_uuid:s._uuid||null,code:s.code||'',full:s.full||s.name||sh,short:sh,kind:s.kind||'in',proc:Array.isArray(s.proc)?s.proc.slice():[],recv:Array.isArray(s.recv)?s.recv.map(x=>({name:x.name||'',phone:x.phone||'',active:x.active!==false})):[],_extra:s._extra||{},active:s.active!==false}; }

function vendRow(s){ return { short:s.short, code:s.code||null, full_name:s.full||null, kind:s.kind||'in',
  procs:Array.isArray(s.proc)?s.proc:[], active:s.active!==false,
  /* ★97-8 接收人寫進 extra（合併既有鍵，不整包覆蓋） */
  extra:Object.assign({},s._extra||{},{receivers:(s.recv||[]).filter(x=>x&&String(x.name||'').trim())
    .map(x=>({name:String(x.name).trim(),phone:String(x.phone||'').trim(),active:x.active!==false}))}),
  updated_at:new Date().toISOString() }; }

}

function userSiteShorts(){

  if(p.account_type==='admin'||p.mhr_role==='admin') return null;
  const codes=[].concat(p.site_codes||[]); if(!codes.length) return null;
  if(codes.includes('*')) return null;   // ★88-4 全部廠區＝不限（同 admin 範圍）

function todayYMD(){ const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
/* ★94 pdate＝生產日期（YYYY-MM-DD）；補登舊 WIP 時箱號日期段用實際生產日 */
/* ★96-2 箱號流水 4碼→5碼（大永定案 260730：月量可能破萬）＋改「取最大流水+1」——
   原本用「同前綴箱數+1」，箱子被刪過（如清測試資料）數量變少→新號撞既有箱號，
   而 cid 是雲端主鍵(upsert on_conflict=cid)，撞號＝靜默蓋掉舊箱。取最大值+1 永不回頭。
   新舊混存 OK：parseInt 吃 4 碼(0067)/5 碼(00068) 都對；查詢/條碼/標籤全用完整字串無長度假設。 */
function genCID(code,pdate,floor){ const ymd=pdate?String(pdate).replace(/-/g,'').slice(2):todayYMD();
  const pre=(code||'').split('+')[0]+ymd;
  const mx=db.data.containers.reduce((a,c)=>{ if(!c.cid||!c.cid.startsWith(pre)) return a;
    const t=parseInt(c.cid.slice(pre.length),10); return (isFinite(t)&&t>a)?t:a; },0);
  return pre+String(Math.max(mx,floor||0)+1).padStart(5,'0'); }   /* ★97 floor=雲端當前最大號（多裝置防重） */
function findC(cid){ return db.data.containers.find(c=>c.cid===cid); }
/* ═══ ★97 質控斷點：待驗單（過渡單）＝打單→質控驗→產箱 的載體 ═══
   單號 P+站碼+YYMMDD-4碼流水（PDC260731-0001）；站×日取最大+1 防撞號；合併站取首碼（比照箱號） */
function genPID(code,pdate,floor){ const ymd=pdate?String(pdate).replace(/-/g,'').slice(2):todayYMD();
  const pre='P'+(code||'').split('+')[0]+ymd+'-';
  const mx=(db.data.pending||[]).reduce((a,p)=>{ if(!p.pid||p.pid.indexOf(pre)!==0) return a;
    const t=parseInt(p.pid.slice(pre.length),10); return (isFinite(t)&&t>a)?t:a; },0);
  return pre+String(Math.max(mx,floor||0)+1).padStart(4,'0'); }
/* ★97 單號防重鐵則（使用者定案：每種單號絕不重號、時序一致）——
   取號前先問「雲端」該前綴當前最大號（多台裝置同開，記憶體最大值會過期→撞號=upsert 靜默互蓋）。
   離線/逾時→退回本機最大值（風險註記部署卡）。壓鑄回填=日期段不同=獨立序列（使用者排除）。 */
async function cloudMaxSeq(table,col,pre){
  try{ const d=await sbGet(table+'?'+col+'=like.'+encodeURIComponent(pre)+'*&select='+col+'&order='+col+'.desc&limit=1');
    if(Array.isArray(d)&&d[0]&&d[0][col]){ const t=parseInt(String(d[0][col]).slice(pre.length),10); if(isFinite(t)) return t; }
  }catch(e){}
  return 0; }
async function nextPID(code,pdate){ const ymd=pdate?String(pdate).replace(/-/g,'').slice(2):todayYMD();
  const pre='P'+(code||'').split('+')[0]+ymd+'-';
  const floor=await cloudMaxSeq('mhr_pending_insp','pid',pre);
  return genPID(code,pdate,floor); }
async function nextCID(code,pdate){ const ymd=pdate?String(pdate).replace(/-/g,'').slice(2):todayYMD();
  const pre=(code||'').split('+')[0]+ymd;
  const floor=await cloudMaxSeq('mhr_containers','cid',pre);

/* ===== 不良品 / 重工：核心模型 =====
   不良箱＝紅色容器(kind:NR/NG)，批+站一個、累加、sources 帶來源箱（結存可追）。
   NR=可重工(待會判/待重工)；NG=報廢(報工直接判廢 + 重工失敗轉入)。
   回流箱＝kind 空白的正常 OK 箱，但 workType='rework'/'release'，sources 指向 NR 箱。 */
function isDefect(c){ return !!(c&&(c.kind==='NR'||c.kind==='NG')); }
function isNormalBox(c){ return !!(c&&!c.ngHolder&&!isDefect(c)&&!c.voidAt); }   /* ★92 作廢箱不計入結存/選單 */
/* ★92 作廢箱（內控：記錄保留可查、可恢復；不做實體刪除） */
async function voidBox(cid){
  const c=findC(cid); if(!c) return;
  if(c.voidAt){ if(!confirm('取消作廢箱號 '+cid+' ？\n\n恢復後會重新計入結存。')) return;
    c.voidAt=null; c.voidBy=''; c.voidNote=''; db.save(); toast('已恢復','ok'); render(); return; }
  const why=prompt('作廢箱號 '+cid+'\n\n記錄會保留（可追溯、可恢復），但不再計入結存與選單。\n請輸入作廢原因：','');
  if(why===null) return;
  c.voidAt=new Date().toISOString(); c.voidBy=((getSession()||{}).profile||{}).email||''; c.voidNote=why||'';
  db.save(); toast('已作廢（記錄保留）','ok'); render();

function nowISO(){ return new Date().toISOString(); }
// 不良箱號：類型-站碼-YYMMDD-序（一眼看出 哪種不良＋哪一站）
function genDefCID(kind,code){ const pre=kind+'-'+(code||'').split('+')[0]+'-'+todayYMD()+'-';
  /* ★96-2 同 genCID 改「取最大流水+1」防刪箱後撞號（不良箱量少、維持 3 碼） */
  const mx=db.data.containers.reduce((a,c)=>{ if(!c.cid||c.cid.indexOf(pre)!==0) return a;
    const t=parseInt(c.cid.slice(pre.length),10); return (isFinite(t)&&t>a)?t:a; },0);
  return pre+String(mx+1).padStart(3,'0'); }
// 把領料量依序切給 OK/NR/NG，每個來源箱只被計一次 → 源箱結存才正確
function splitDraws(draws,amounts){ const pool=draws.map(d=>({cid:d.cid,left:+d.take||0}));
  return amounts.map(amt=>{ let need=+amt||0; const out=[]; for(const p of pool){ if(need<=0)break; if(p.left<=0)continue; const t=Math.min(p.left,need); p.left-=t; need-=t; out.push({cid:p.cid,take:t}); } return out; }); }
// 報工不良 → 產生/累加 NR 不良箱 或 NG 報廢箱（批+站一個、累加）
function addDefect(kind,station,first,drawsForKind,meta,qtyOverride){ meta=meta||{}; const add=(qtyOverride!==undefined)?(+qtyOverride||0):drawsForKind.reduce((a,d)=>a+(+d.take||0),0); if(add<=0) return null;   /* ★97 首站(無draws)可帶量 */
  let b=db.data.containers.find(c=>c.kind===kind&&c.lot===first.lot&&c.processCode===station&&c.partNo===first.partNo);
  if(b){ b.qty+=add; b.sources.push(...drawsForKind); if(!b.qc&&meta.qc) b.qc=meta.qc; }
  else { b={cid:genDefCID(kind,station),partNo:first.partNo,name:first.name,lot:first.lot,orderNo:first.orderNo,
      processCode:station,stagePartNo:stageNo(first.partNo,station),qty:add,kind,
      operator:meta.op||'',qc:meta.qc||'',machine:meta.mc||'',shift:meta.shift||'',vendor:meta.vendor||'',
      sources:drawsForKind.slice(),disp:[],createdAt:meta.createdAt||nowISO()};
    db.data.containers.push(b); }
  return b.cid; }
// 會判處置：對 NR 不良箱結存做 重工回流 / 報廢 / 改判放行（重工＋NG 皆從 NR 箱領出，扣其結存）
function reworkDispose(nrCid,reworkOK,scrapNG,releaseOK,reworkOrder,judgeSrc,judge,createdAt,reworkStation){
  const nb=findC(nrCid); if(!nb||nb.kind!=='NR') return false; const rem=remaining(nrCid);
  reworkOK=+reworkOK||0; scrapNG=+scrapNG||0; releaseOK=+releaseOK||0;
  if(reworkOK+scrapNG+releaseOK<=0) return false;
  if(reworkOK+scrapNG+releaseOK>rem) return false;
  const at=createdAt||nowISO();
  const rwSt=reworkStation||nb.processCode;   // 重工去向製程（會判依不良狀況指定；預設原站）
  // 回流 OK 箱在指定製程產生 → 再依路線往下流（rework＝重工去向站；release 放行＝回原站續流）
  const mkOK=(qty,wt,ord,st)=>{ db.data.containers.push({cid:genCID(st),partNo:nb.partNo,name:nb.name,lot:nb.lot,
    orderNo:ord||nb.orderNo,processCode:st,stagePartNo:stageNo(nb.partNo,st),qty,operator:judge||'',
    machine:wt==='rework'?'重工':'',shift:'',workType:wt,reworkOrder:ord||'',reworkFrom:nb.processCode,sources:[{cid:nrCid,take:qty}],createdAt:at}); };
  if(reworkOK>0) mkOK(reworkOK,'rework',reworkOrder||'',rwSt);
  if(releaseOK>0) mkOK(releaseOK,'release','',nb.processCode);
  if(scrapNG>0) addDefect('NG',nb.processCode,nb,[{cid:nrCid,take:scrapNG}],{op:judge||'',createdAt:at});
  (nb.disp=nb.disp||[]).push({reworkOK,scrapNG,releaseOK,reworkOrder:reworkOrder||'',reworkStation:reworkOK>0?rwSt:'',judgeSrc:judgeSrc||'',judge:judge||'',at});
  return true; }

/* ===== 站別產出帳：產出(OK) / 已轉下站 / 結存(在庫) / NR / NG ===== */
function stationLedger(pn,wo,lot){   /* ★96 wo、★96-4 lot=選填過濾（追溯②用；不傳=全部，總覽等舊呼叫不受影響） */
  const led={};
  const g=code=>led[code]||(led[code]={input:0,out:0,moved:0,stock:0,boxes:0,nr:0,ng:0});
  /* ★96-4b 報工的工單/批號比對加「產出箱回查」保險（鐵則：不得影響舊資料）——
     舊報工欄位不全（orderNo 是 V86/260723 才開始存），直接比對會把投入/NR/NG 整段濾掉
     （實測：批號查詢每站投入全變「首站」）。箱子欄位齊全＝正本，報工對不上就用 intoCid 回查產出箱。 */
  let boxWo=null, boxLot=null;
  if(wo||lot){ boxWo={}; boxLot={}; db.data.containers.forEach(c=>{ if(!c.cid) return; boxWo[c.cid]=c.orderNo||''; boxLot[c.cid]=c.lot||''; }); }
  db.data.containers.forEach(c=>{ if(pn&&c.partNo!==pn) return; if(wo&&c.orderNo!==wo) return; if(lot&&c.lot!==lot) return; if(!isNormalBox(c)) return;
    const w=g(c.processCode); const mv=drawnOut(c.cid); const rem=(+c.qty||0)-mv;
    /* ★97 點交＝移轉（使用者定義）：已點交未領的結存計入「已轉下站」、不再算本站在庫——
       跟接收站的「⏭已收待投產」左右對帳（壓鑄轉200 ↔ 機加已收200）。OK產出=已轉下站+結存 恆等式不變 */
    const hand=(isReceived(c)&&rem>0)?rem:0;
    w.out+=(+c.qty||0); w.moved+=mv+hand; w.stock+=rem-hand; if(rem-hand>0) w.boxes++; });
  db.data.reports.forEach(r=>{ if(pn&&r.partNo!==pn) return;
    if(wo&&!(r.orderNo===wo||(r.intoCid&&boxWo[r.intoCid]===wo))) return;
    if(lot&&!(r.lot===lot||(r.intoCid&&boxLot[r.intoCid]===lot))) return;
    const w=g(r.toStation);
    const dsum=(r.draws||[]).reduce((a,d)=>a+(+d.take||0),0);

function wipSync(src){

  const base=skip=>metas.filter(m=>(skip==='pn'||!pn||m.pn===pn)&&(skip==='wo'||!wo||(m.wos||[]).indexOf(wo)>=0)&&(skip==='lot'||!lot||m.lot===lot));
  if(src!=='pn'&&pe){ const pns=[...new Set(base('pn').map(m=>m.pn))]; const cur=pe.value;
    pe.innerHTML=prodOptions(Lt('全部機種'),'',db.data.products.filter(p=>pns.indexOf(p.partNo)>=0));
    pe.value=(pns.indexOf(cur)>=0)?cur:'';   /* 失效自動清 */ }
  if(src!=='wo'){ window._wipWo=[...new Set(base('wo').reduce((a,m)=>a.concat(m.wos||[]),[]))].sort().map(w=>({v:w,t:w}));
    comboFill('wip_wo',window._wipWo); }
  if(src!=='lot'){ window._wipLot=base('lot').map(m=>({v:m.lot,t:m.lot})).sort((a,b)=>a.v.localeCompare(b.v));
    comboFill('wip_lot',window._wipLot); }
  if(src==='lot'&&lot){ const m=metas.find(x=>x.lot===lot); if(m){
    if(pe&&!pe.value) pe.value=m.pn;
    const we=$('#wip_wo'); if(we&&!we.value.trim()&&(m.wos||[]).length===1) we.value=m.wos[0]; } }
  updateWip();
}

    if(!st){ unknown.push(l); return; } if(!route.includes(st.code)) route.push(st.code); if(m) stages[st.code]=m[0]; });
  renderBomUnknown(unknown);

/* ★88-10 工牌管理範圍：admin＝null(全部)；其他角色（主管）＝自己 profile 的廠區清單。
   '*'（全部廠區）也視為 null＝不限。委外廠商帳號＝自己的 vendor_code。 */
function opsScopeSites(){
  const s=getSession(), p=s&&s.profile; if(!p) return [];
  if(p.account_type==='admin'||p.mhr_role==='admin'||(p.mhr_roles||[]).includes('admin')) return null;
  const sc=[].concat(p.site_codes||[]);
  if(sc.includes('*')) return null;
  if(p.vendor_code) sc.push(p.vendor_code);
  /* 事業群展開成廠區 */
  (p.bu_codes||[]).forEach(bu=>{ MHR_SITES.filter(x=>x.bu_code===bu).forEach(x=>sc.push(x.code)); });
  return [...new Set(sc)];
}

    document.querySelectorAll('#u_sites input[data-bu="'+b.value+'"]').forEach(s=>{ s.checked=b.checked; });
  });

function onSitePick(){
  /* 廠區被取消 → 它的事業群不再成立（該群其他廠區維持勾選） */
  document.querySelectorAll('#u_bus input:checked').forEach(b=>{
    const kids=[...document.querySelectorAll('#u_sites input[data-bu="'+b.value+'"]')];
    if(kids.length && kids.some(s=>!s.checked)) b.checked=false;
  });
  syncAllFlag();
}

/* ═══ ★88 CSV 匯出／匯入（名單管理＋工牌名單）═══
   匯入格式＝人員權限名單模板（xlsx 另存 CSV UTF-8）；打勾欄吃 V/✓/v/1/y；
   「其他製程」文字用製程主檔別名對照；廠區名對照 mhr_sites（對不到預設 SDY）；
   寫入＝bulk upsert on_conflict=badge（同工號＝覆蓋更新） */
function csvParse(text){ const rows=[]; let row=[],cur='',q=false;
  text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!=='')); }
function csvExport(filename,rows){ const q=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const txt='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

        mhr_role:roles[0]||'view', mhr_roles:roles.length?roles:['view'],
        site_codes:[st?st.code:'SDY'], bu_codes:[], vendor_code:null, source:'mhr', password:DEFAULT_PWD });
    });
    if(!list.length) return toast('沒有可匯入的資料（Email 欄是空的？）','err');
    const dup=list.filter(x=>MHR_USERS.some(u=>(u.email||'').toLowerCase()===x.email.toLowerCase())).length;
    if(!confirm('即將匯入 '+list.length+' 筆登入帳號\n新增/開通 '+(list.length-dup)+' 筆／已存在會更新 '+dup+' 筆\n\n'

    /* ★91 未列在名單中的帳號：詢問是否停用（不刪帳號＝不影響 QMS；只是 MHR 停用） */

      && u.account_type!=='admin' && u.mhr_role!=='admin'

      && (u.site_codes||[]).some(c=>impSites.has(c)));
    if(missing.length){
      const names=missing.slice(0,8).map(u=>(u.name||'')+' '+u.email).join('\n');
      if(confirm('匯入完成。\n\n偵測到 '+missing.length+' 個帳號「系統中有、這次名單沒有」：\n'

        for(const u of missing){ const rr=await mhrAdmin('update',{email:u.email,active:false}); if(rr.ok) offN++; }
      }
    }
    toast(ok?('✅ 已匯入 '+ok+' 筆'+(offN?'／停用 '+offN+' 個':'')+(fail.length?'（失敗 '+fail.length+'）':'')):'匯入失敗', fail.length?'err':'ok');
    if(fail.length) console.warn('匯入失敗明細：',fail);
    await loadMhrUsers(); render();
  }catch(e){ toast('解析失敗：'+(e.message||e),'err'); } };

function opImportCsv(ev){
  const f=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(!f) return;
  const isXls=/\.xlsx?$/i.test(f.name);
  if(isXls && !window.XLSX) return toast('Excel 元件未載入，請改用 CSV 或檢查網路','err');
  const rd=new FileReader();
  rd.onload=async ()=>{ try{
    let rows;
    if(isXls){
      const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      /* 挑分頁：優先名稱含「工牌」的，否則第一張 */
      const sn=wb.SheetNames.find(n=>n.indexOf('工牌')>=0)||wb.SheetNames[0];
      rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}).map(r=>r.map(c=>String(c==null?'':c)));
    } else {
      rows=csvParse(rd.result);
    }

    const hi=rows.findIndex(r=>r.some(c=>String(c).indexOf('工號')>=0)&&r.some(c=>String(c).indexOf('姓名')>=0));
    if(hi>0) rows=rows.slice(hi);
    if(rows.length<2) return toast('檔案沒有資料列','err');
    const hd=rows[0].map(h=>String(h).trim());
    const col=n=>hd.findIndex(h=>h.indexOf(n)>=0);
    /* ★88-6 次名欄相容三種寫法：中文名／英文名／次名 */
    const iSite=col('廠區'),iBadge=col('工號'),iName=col('姓名'),iDept=col('部門');
    const iShift=col('班別'), iTeam=col('組別');   /* ★88-10 班別/組別(線別) */
    let iEng=col('中文名'); if(iEng<0) iEng=col('英文'); if(iEng<0) iEng=col('次名');
    const iProd=col('生產'),iMc=col('物控'),iQc=col('質控'),iOther=col('其他');
    if(iBadge<0||iName<0) return toast('找不到「工號／姓名」欄位——請用「人員權限名單模板」的工牌頁另存 CSV','err');
    const chk=v=>/^[vV✓ｖ1yY]/.test(String(v||'').trim());
    /* ★96-5e 製程欄對照＝主檔別名（噴砂→珠擊等自動對上）；只掃職能欄之後的表頭、排除「其他」欄 */
    const _procCols=[]; hd.forEach((h,i)=>{ if(!h||i<=(iQc>=0?iQc:6)||/其他/.test(h)) return; const st=matchStation(h); if(st) _procCols.push({i,code:st.code}); });
    const list=[],errs=[];
    const _impSite=((($('#op_imp_site')||{}).value)||'').trim();   /* ★97-4 本次匯入廠區（廠區欄空白時才用） */
    rows.slice(1).forEach((r,ix)=>{
      /* ★88-6 姓名清理＋拆分（比照 OMS VN：越南文=主名 name、中文=次名 eng_name）
         來源常見「Nguyễn Văn A\n阮文A」或「Nguyễn Văn A 阮文A」→ 拆兩段；純中文則中文當主名 */
      const badge=String(r[iBadge]||'').trim();
      let name=String(r[iName]||'').replace(/\s+/g,' ').trim(), name2='';
      { const han=/[一-鿿]/, viet=/[ăâđêôơưàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ]/i;
        const parts=name.split(' ').filter(Boolean);
        const zhIdx=parts.findIndex(w=>han.test(w)&&!viet.test(w));
        if(zhIdx>0){ name2=parts.slice(zhIdx).join(''); name=parts.slice(0,zhIdx).join(' '); } }
      if(!badge&&!name) return;
      if(!badge||!name){ errs.push('第'+(ix+2)+'列 工號或姓名空白'); return; }
      const funcs=[]; if(iProd>=0&&chk(r[iProd]))funcs.push('生產'); if(iMc>=0&&chk(r[iMc]))funcs.push('物控'); if(iQc>=0&&chk(r[iQc]))funcs.push('質控');
      const procs=[]; _procCols.forEach(pc=>{ if(chk(r[pc.i])&&!procs.includes(pc.code)) procs.push(pc.code); });   /* ★96-5e 別名對照版 */
      if(iOther>=0){ String(r[iOther]||'').split(/[、,，;；\/ ]+/).forEach(t=>{ t=t.trim(); if(!t)return;
        const st=STATIONS.find(s=>s.zh===t||(s.alias||[]).includes(t)); if(st&&!procs.includes(st.code)) procs.push(st.code); }); }
      /* ★97-4 廠區判定改「按人對應」（使用者定案）——原本兩層都倒向大永：
         ①廠區欄空白＝預設'大永' ②對不到主檔＝靜默塞 site_code:'SDY'。
         別廠名單匯進來會整批變成大永的人，還會連帶把大永現有工牌誤判成「名單沒有」而停用。

      const siteTxt=String(iSite>=0?r[iSite]:'').trim();

      if(siteTxt){
        st=(MHR_SITES||[]).find(x=>x.code===siteTxt||x.name===siteTxt||(x.name||'').indexOf(siteTxt)>=0||siteTxt.indexOf(x.name||'§')>=0);
        if(!st){ errs.push('第'+(ix+2)+'列 廠區「'+siteTxt+'」對不到廠區主檔'); return; }
      } else {
        if(!_impSite){ errs.push('第'+(ix+2)+'列 廠區空白，且未選「匯入廠區」'); return; }
        st=(MHR_SITES||[]).find(x=>x.code===_impSite);
        if(!st){ errs.push('第'+(ix+2)+'列 匯入廠區無效'); return; }
      }
      list.push({ badge, name, eng_name:(String(iEng>=0?r[iEng]:'').trim()||name2||null), dept:String(iDept>=0?r[iDept]:'').trim()||null,
        shift_code:(String(iShift>=0?r[iShift]:'').trim().toUpperCase().replace(/班$/,'')||null),
        team:String(iTeam>=0?r[iTeam]:'').trim()||null,
        functions:funcs.length?funcs:['生產'], procs, site_code:st.code, vendor_code:null, source:'mhr', active:true, updated_at:new Date().toISOString() });   /* ★97-4 st 一定有值（上面對不到就 return 了），不再 fallback SDY */
    });
    if(!list.length) return toast('沒有可匯入的資料'+(errs.length?'（'+errs[0]+'…）':''),'err');
    const dup=list.filter(x=>MHR_OPS.some(o=>o.badge===x.badge)).length;
    /* ★91 找出「系統有、這次名單沒有」的人（同廠區範圍內比對，避免誤停其他廠的人） */
    const impBadges=new Set(list.map(x=>x.badge));
    const impSites=new Set(list.map(x=>x.site_code).filter(Boolean));
    const missing=MHR_OPS.filter(o=>o.active!==false && !impBadges.has(o.badge)
      && impSites.has(o.site_code||''));
    /* ★97-4 匯入前把「這批人要進哪個廠區」講明白——停用比對是按廠區做的，弄錯會誤停別廠的人 */
    const siteSum=[...impSites].map(c=>{ const s=(MHR_SITES||[]).find(x=>x.code===c)||{};
      return '　・'+(s.name||c)+'：'+list.filter(x=>x.site_code===c).length+' 人'; }).join('\n');
    if(!confirm('即將匯入 '+list.length+' 筆工牌 → 雲端\n\n廠區歸屬：\n'+siteSum
      +'\n\n新增 '+(list.length-dup)+' 筆／同工號覆蓋更新 '+dup+' 筆'
      +(errs.length?'\n\n⚠ 跳過 '+errs.length+' 列：\n　'+errs.slice(0,5).join('\n　')+(errs.length>5?'\n　…':''):'')+'\n\n確定？')) return;
    const r=await sbWrite('POST','mhr_operators?on_conflict=badge',list,'resolution=merge-duplicates');
    if(!r.ok) return toast(r.error||'匯入失敗','err');
    /* ★91 未列在名單中的人：詢問是否停用（不刪除，保留歷史報工記錄） */
    let offN=0;
    if(missing.length){
      const names=missing.slice(0,8).map(o=>o.badge+' '+(o.name||'')).join('\n');
      if(confirm('匯入完成。\n\n偵測到 '+missing.length+' 人「系統中有、這次名單沒有」（可能已離職／調動）：\n'
        +names+(missing.length>8?'\n…等 '+missing.length+' 人':'')
        +'\n\n要把他們「停用」嗎？\n（停用＝不出現在報工選單，歷史記錄保留；按取消則維持啟用）')){
        for(const o of missing){
          const rr=await sbWrite('PATCH','mhr_operators?id=eq.'+encodeURIComponent(o.id),{active:false,updated_at:new Date().toISOString()});
          if(rr.ok) offN++;
        }
      }
    }
    toast('✅ 已匯入 '+list.length+' 筆工牌'+(offN?'／停用 '+offN+' 人':'')+'（雲端）','ok');
    await loadOperators(); render();
  }catch(e){ toast('解析失敗：'+(e.message||e),'err'); } };
  if(isXls) rd.readAsArrayBuffer(f); else rd.readAsText(f,'utf-8'); }

function opBlank(){ return {badge:'',emp_id:'',name:'',eng_name:'',belong:'',functions:[],dept:'',procs:[],source:'mhr',isNew:true}; }

function opEdit(id){ const o=MHR_OPS.find(x=>String(x.id)===String(id)); if(!o) return;

function opFromOms(emp){ const u=OMS_USERS.find(x=>x.emp_id===emp); if(!u) return;
  const st=MHR_SITES.find(s=>s.code===u.factory_code);
  window._opEdit=Object.assign(opBlank(),{badge:u.emp_id,emp_id:u.emp_id,name:u.name||'',eng_name:u.eng_name||'',
    belong:st?st.code:'',dept:u.dept||'',source:'oms'});
  render(); if(window.scrollTo)window.scrollTo(0,0); }
async function opSave(){
  const e=window._opEdit; if(!e) return;
  const badge=($('#op_badge').value||'').trim(), name=($('#op_name').value||'').trim();
  const belong=$('#op_belong').value, funcs=readChecks('op_funcs');
  if(!badge) return toast('請填工牌號','err');
  if(!name)  return toast('請填姓名','err');
  if(!belong) return toast('請選「屬於」哪個廠區/廠商','err');
  if(!funcs.length) return toast('請至少勾一個職能，否則掃工牌時不會跳出這個人','err');
  if(e.isNew && MHR_OPS.some(o=>o.badge===badge)) return toast('工牌號「'+badge+'」已存在','err');
  const st=MHR_SITES.find(s=>s.code===belong)||{};
  const row={badge,name,eng_name:($('#op_eng').value||'').trim()||null,emp_id:($('#op_emp').value||'').trim()||null,
    site_code: st.kind==='vendor'? null : belong,
    vendor_code: st.kind==='vendor'? belong : null,
    dept:($('#op_dept')&&$('#op_dept').value.trim())||null, procs:readChecks('op_procs'),
    functions:funcs, shift_code:(($('#op_shift')||{}).value)||null, team:((($('#op_team')||{}).value)||'').trim()||null,
    source:$('#op_src').value, active:true, updated_at:new Date().toISOString()};
  const r = e.isNew ? await sbWrite('POST','mhr_operators',row)
                    : await sbWrite('PATCH','mhr_operators?id=eq.'+encodeURIComponent(e.id),row);
  if(!r.ok) return toast(r.error||'失敗','err');
  toast(e.isNew?'已新增工牌':'已儲存','ok'); window._opEdit=null; await loadOperators(); render();
}
async function opToggle(id){ const o=MHR_OPS.find(x=>String(x.id)===String(id)); if(!o) return;
  const r=await sbWrite('PATCH','mhr_operators?id=eq.'+encodeURIComponent(id),{active:!(o.active!==false),updated_at:new Date().toISOString()});
  if(!r.ok) return toast(r.error||'失敗','err'); await loadOperators(); render(); }
async function opDel(id){ const o=MHR_OPS.find(x=>String(x.id)===String(id)); if(!o) return;
  if(!confirm('刪除工牌「'+o.badge+' '+o.name+'」？\n\n⚠ 已經報工過的歷史記錄不受影響（那是當時存下來的），但之後掃不到這張工牌。\n若只是離職/調動，建議用「停用」保留歷史。')) return;

  const v=$('#view');
  /* 首次進本頁自動載名單。
     ⚠ 條件只看 MHR_USERS_STATUS：先前誤加了 `!MHR_SITES.length`，但 bootApp 已先載好組織主檔
        → 該條件恆為 false → 名單永遠不會載、卡在「未載入(0)」。
     先把狀態改成「載入中…」再呼叫，避免 reloadPerm→render→本函式 無限迴圈。 */
  if(MHR_USERS_STATUS==='未載入'){ MHR_USERS_STATUS='載入中…'; reloadPerm(); }
  const have=new Set(MHR_USERS.map(u=>(u.email||'').toLowerCase()));

  /* ── 現有 MHR 名單 ──
     ★85-1 欄位照 OMS 資料（使用者定案 260722）：第一欄＝廠區（OMS factory_code；自建＝勾選的廠區；
     管理員/委外用識別標）、姓名優先顯示 OMS 名字。原「類型」欄從列表移除（功能照舊，編輯表單仍可改）。 */
  const omsOf=em=>OMS_USERS.find(u=>(u.email||'').toLowerCase()===(em||'').toLowerCase());
  const siteTag=p=>{
    if(p.account_type==='admin'||p.mhr_role==='admin') return '<span class="pill os">管理員</span>';
    if(p.account_type==='vendor'||p.vendor_code) return '<span class="pill" style="background:#fef3e0;color:#b9760f">'+esc(siteName(p.vendor_code||'')||'委外')+'</span>';
    const om=omsOf(p.email);
    if(om&&om.factory_code) return '<span class="pill dc">'+esc(om.factory_code)+'</span>';
    const sc=p.site_codes||[];
    if(sc.length===1) return '<span class="pill dc">'+esc(sc[0])+'</span>';
    if(sc.length)     return '<span class="pill dc">'+esc(sc.join('＋'))+'</span>';
    return '<span class="muted">—</span>';
  };
  /* ★88-4 名單排序＋篩選 */
  const _uq=(window._userQ||'').trim().toLowerCase(), _ust=window._userSt||'';
  const _usrt=window._userSort||{key:'',dir:1};
  const uVal=(p,k)=>{ const om=omsOf(p.email)||{};
    if(k==='site') return (om.factory_code||(p.site_codes||[]).join('＋')||(p.account_type==='admin'?'管理員':''));
    if(k==='name') return om.name||p.name||'';
    if(k==='email') return p.email||'';
    if(k==='role') return ((Array.isArray(p.mhr_roles)&&p.mhr_roles.length)?p.mhr_roles:[p.mhr_role]).map(roleLabel).join('＋');
    if(k==='scope') return scopeShort(p).replace(/<[^>]*>/g,'');
    if(k==='src') return p.source==='oms'?'OMS':'自建';
    if(k==='st') return p.active===false?'停用':'啟用';
    return ''; };
  const _usite=window._userSite||'', _urole=window._userRole||'';
  const _adminSites=isSiteAdmin()?(opsScopeSites()||[]):null;   /* ★90 廠區管理員只看自己管的廠區帳號 */
  let _ulist=MHR_USERS.filter(p=>{
    if(_adminSites){
      if(p.account_type==='admin'||p.mhr_role==='admin') return false;              // 看不到系統管理員
      const scs=[].concat(p.site_codes||[]);
      if(scs.includes('*')) return false;                                            // 看不到全域範圍的人
      if(!scs.some(c=>_adminSites.includes(c))) return false;                        // 只留自己管的廠區
    }
    if(_ust==='on'&&p.active===false) return false;
    if(_ust==='off'&&p.active!==false) return false;
    if(_usite && uVal(p,'site')!==_usite) return false;                                   // ★88-9 廠區篩選
    if(_urole && !((Array.isArray(p.mhr_roles)&&p.mhr_roles.length)?p.mhr_roles:[p.mhr_role]).includes(_urole)) return false;   // ★88-9 角色篩選
    if(!_uq) return true;
    const om=omsOf(p.email)||{};
    return [p.email,p.name,om.name,om.eng_name,uVal(p,'site'),uVal(p,'role'),uVal(p,'scope')]
      .some(v=>String(v||'').toLowerCase().includes(_uq));
  });
  if(_usrt.key) _ulist=_ulist.slice().sort((a,b)=>String(uVal(a,_usrt.key)).localeCompare(String(uVal(b,_usrt.key)),'zh-Hant',{numeric:true})*_usrt.dir);
  const rows=_ulist.map(p=>{
    const isMe=(getSession()||{}).profile&&getSession().profile.email===p.email;
    const src=p.source==='oms'?'<span class="pill dc">OMS 名單</span>':'<span class="pill pk">MHR 自建</span>';
    const om=omsOf(p.email);
    const dispName= om&&om.name? (esc(om.name)+(om.eng_name?' <span class="muted small">'+esc(om.eng_name)+'</span>':'')) : esc(p.name||'');
    return `<tr>
      <td>${siteTag(p)}</td>
      <td>${dispName}</td>
      <td class="mono small">${esc(p.email)}${isMe?' <span class="pill ok" style="font-size:9px">你自己</span>':''}</td>
      <td>${esc(((Array.isArray(p.mhr_roles)&&p.mhr_roles.length)?p.mhr_roles:[p.mhr_role]).map(roleLabel).join('＋'))}</td>
      <td class="small">${scopeShort(p)}</td>
      <td>${src}</td>
      <td>${p.active===false?'<span class="pill ng">停用</span>':'<span class="pill ok">啟用</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" onclick="editUser('${esc(p.email)}')">編輯</button>
        <button class="btn ghost sm" onclick="resetPwd('${esc(p.email)}')">🔑 重設密碼</button>
        ${(isMe||!can('perm','d'))?'':`<button class="btn gray sm" onclick="revokeUser('${esc(p.email)}')">移除</button>`}
      </td></tr>`;
  }).join('');

  /* ── ① 從 OMS 勾選：只列 OMS 已授權 MHR、且還沒加進來的人 ──
     廠區放第一欄＋依「廠區→工號」排序，方便按廠區找人 */
  const pend=OMS_USERS.filter(u=>u.email && !have.has(u.email.toLowerCase()))
    .slice().sort((a,b)=> (a.factory_code||'').localeCompare(b.factory_code||'') || (a.emp_id||'').localeCompare(b.emp_id||''));
  const omsRows=pend.map(u=>`<tr>
      <td><span class="pill dc">${esc(u.factory_code||'—')}</span></td>
      <td class="mono small">${esc(u.emp_id||'')}</td>
      <td>${esc(u.name||'')}${u.eng_name?` <span class="muted small">${esc(u.eng_name)}</span>`:''}</td>
      <td class="small muted">${esc((u.dept||'')+(u.title?' / '+u.title:''))}</td>
      <td class="mono small">${esc(u.email||'')}</td>
      <td><button class="btn sm" onclick="editUser('${esc(u.email)}',true)">＋ 加入 MHR</button></td></tr>`).join('');

  /* ── 編輯／新增表單 ── */
  const eu=window._editUser;
  const form = eu ? `<div class="card" style="border:2px solid var(--teal)">
      <h3>${eu.isNew?'＋ 加入 MHR':'編輯'}：${esc(eu.email)}</h3>
      ${eu.isNew?`<div class="note">此人若<b>已有帳號</b>（例如已有 QMS 帳號）→ 只會<b>開通 MHR</b>，密碼沿用原本的、不會變更。<br>若是<b>全新的人</b> → 會建立帳號，預設密碼 <code>${DEFAULT_PWD}</code>，首次登入強制更換。</div>`:''}
      ${eu.isNew?`<div class="grid g2"><div><label>Email</label><input id="u_email" value="${esc(eu.email||'')}" ${eu.fromOms?'readonly':''}></div>
        <div><label>姓名</label><input id="u_name" value="${esc(eu.name||'')}"></div></div>`
        :`<input type="hidden" id="u_email" value="${esc(eu.email)}"><div><label>姓名</label><input id="u_name" value="${esc(eu.name||'')}"></div>`}
      ${scopeEditor(eu)}
      <div style="margin-top:14px"><button class="btn green" onclick="saveUser()">${eu.isNew?'建立 / 開通':'儲存'}</button>
        <button class="btn gray" onclick="window._editUser=null;render()">取消</button></div>
    </div>` : '';

  /* ★ 上層分頁：登入帳號 vs 工牌名單。
     刻意不新增側欄選單項——側欄 14 項剛好一頁放得下(V79-5 才修過)，加第 15 項會再撐破；
     且兩者同屬「人的管理」，放同一頁合理。 */
  /* ★88-10 主管(sup) 只管工牌：登入帳號分頁隱藏、強制停在工牌頁（使用者定案 A 案） */
  const _isAdm=canManageUsers();   /* ★90 全域 admin 或 廠區管理員＝可管帳號（看得到登入帳號分頁） */
  const mainTab=_isAdm?(window._permMain||'users'):'ops';
  const tabBar=_isAdm?`<div style="margin-bottom:14px">
    <button class="btn ${mainTab==='users'?'':'ghost'}" onclick="window._permMain='users';window._opEdit=null;render()">👤 權限設定</button>
    <button class="btn ${mainTab==='ops'?'':'ghost'}" onclick="window._permMain='ops';window._editUser=null;render()">🏷 工牌名單</button>
  </div>`:'';
  const pageHead=`<div class="page-h"><h2>名單管理 Users</h2><p>${_isAdm?`
    <b>權限設定</b>＝設定角色與可看範圍（集團內部「誰能進 MHR」由 <b>OMS 授權</b>；大永/委外帳號 <b>MHR 自建</b>）。
    <b>工牌名單</b>＝報工時掃碼記「<b>誰做的</b>」，免密碼、不是帳號。`:`
    管理<b>自己廠區</b>的工牌名單（報工時記「誰做的」，免密碼、不是登入帳號）。登入帳號請洽系統管理員。`}</p></div>`;

  if(mainTab==='ops'){ v.innerHTML=pageHead+tabBar+renderOpsSection(); return; }

  v.innerHTML=pageHead+tabBar+`
  ${form}
  ${(()=>{ /* ★85-8 對調：新增人員移到名單上方（與三主檔一致），預設折疊 */
    const open=!!window._userAdd;
    return `<div class="card"><h3 style="cursor:pointer;user-select:none" onclick="window._userAdd=!window._userAdd;render()">${open?'▾':'▸'} ＋ 新增人員${open?'':' <span class="vi">（點擊展開）</span>'}</h3>
    <div style="display:${open?'':'none'}">
    <div style="margin-bottom:10px">
      <button class="btn ${window._permTab==='oms'?'':'ghost'} sm" onclick="permTab('oms')">① 從 OMS 名單勾選（集團內部）</button>
      <button class="btn ${window._permTab==='new'?'':'ghost'} sm" onclick="permTab('new')">② 自建帳號（大永 / 委外廠商）</button>
    </div>
    ${window._permTab==='oms'? `
      <p class="small muted">只列出 <b>OMS 已授權可進 MHR</b> 的人（OMS「系統資料授權」頁勾了 MHR）。要多開人 → <b>去 OMS 打勾</b>，這裡就會出現。<br>OMS 名單：${esc(OMS_STATUS)}　<a class="lk" onclick="fetchOmsUsers()">重新載入</a></p>
      ${pend.length?`<div style="overflow-x:auto"><table><thead><tr><th>廠區</th><th>工號</th><th>姓名</th><th>部門 / 職稱</th><th>Email</th><th></th></tr></thead><tbody>${omsRows}</tbody></table></div>`
        :`<div class="empty">${OMS_USERS.length?'OMS 已授權的人都已加入 MHR 了 👍':'尚無 OMS 名單（連網後按「重新載入」）'}</div>`}`
    : `
      <p class="small muted">給 <b>OMS 沒有的人</b>用：大永（SDY）、金瑚、昇榮。<br>系統會自動判斷：<b>email 已存在＝開通</b>（不碰密碼）／<b>全新＝建帳號</b>（預設 <code>${DEFAULT_PWD}</code>、首次強制改）。</p>
      <button class="btn" onclick="editUser('',true)">＋ 開始新增</button>`}
    </div>
  </div>`; })()}

  <div class="card"><h3>MHR 名單（${MHR_USERS.length}）<span class="vi">${esc(MHR_USERS_STATUS)}　<a class="lk" onclick="reloadPerm()">重新載入</a>　·　<a class="lk" onclick="userExportCsv()">📤 匯出 CSV</a>　<label class="lk" style="cursor:pointer">📥 匯入 Excel/CSV<input type="file" accept=".xlsx,.xls,.csv,text/csv" onchange="userImportFile(event)" style="display:none"></label></span></h3>
    ${MHR_USERS.length?`
    <div class="row" style="margin:0 0 8px">
      <div style="min-width:240px"><input id="u_q" placeholder="🔍 搜尋：姓名 / Email / 廠區 / 角色" value="${esc(window._userQ||'')}" oninput="window._userQ=this.value;renderPermPage();setTimeout(()=>{const e=document.getElementById('u_q');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}},0)"></div>
      <div style="min-width:130px"><select onchange="window._userSite=this.value;renderPermPage()"><option value="">全部廠區</option>${[...new Set(MHR_USERS.map(p=>uVal(p,'site')).filter(Boolean))].sort().map(s=>`<option value="${esc(s)}"${_usite===s?' selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <div style="min-width:120px"><select onchange="window._userRole=this.value;renderPermPage()"><option value="">全部角色</option>${ROLES_DEF.map(r=>`<option value="${r.key}"${_urole===r.key?' selected':''}>${r.label}</option>`).join('')}</select></div>
      <div style="min-width:110px"><select onchange="window._userSt=this.value;renderPermPage()">
        <option value=""${!window._userSt?' selected':''}>全部狀態</option>
        <option value="on"${window._userSt==='on'?' selected':''}>啟用</option>
        <option value="off"${window._userSt==='off'?' selected':''}>停用</option></select></div>
      ${(window._userQ||window._userSt||_usite||_urole||(window._userSort&&window._userSort.key))?`<div><button class="btn ghost sm" onclick="window._userQ='';window._userSt='';window._userSite='';window._userRole='';window._userSort=null;renderPermPage()">清除</button></div>`:''}
      <div class="small muted" style="align-self:center">顯示 ${_ulist.length} / ${MHR_USERS.length} 筆</div>
    </div>
    <style>
      /* ★95-1 名單表一頁可看：長欄（姓名/Email/角色/可看範圍）可折行、按鈕縮一號；極窄螢幕仍有橫捲保險 */
      #usr_tbl td:nth-child(2),#usr_tbl td:nth-child(4),#usr_tbl td:nth-child(5){white-space:normal}
      #usr_tbl td:nth-child(3){white-space:normal;word-break:break-all;min-width:130px}
      #usr_tbl td{padding:4px 6px}
      #usr_tbl .btn.sm{padding:2px 6px;font-size:11px;white-space:nowrap}
    </style><div style="overflow-x:auto"><table id="usr_tbl"><thead><tr>${[['site','廠區'],['name','姓名'],['email','Email'],['role','角色'],['scope','可看範圍'],['src','來源'],['st','狀態']].map(([k,t])=>`<th style="cursor:pointer;white-space:nowrap" onclick="sortUsers('${k}')">${t}${_usrt.key===k?(_usrt.dir>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${MHR_USERS_STATUS==='載入中…'?'載入中…':'尚無名單'}</div>`}
    <div class="small muted" style="margin-top:8px">⚠ 「移除」只收回 <b>MHR 權限</b>，<b>不會刪掉帳號</b>——帳密與 QMS 共用，刪帳號會連 QMS 一起刪。</div>
  </div>

  <div class="card"><h3>角色 × 頁面 授權矩陣 <span class="vi">（唯讀參考：各角色每頁能做什麼）</span></h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>頁面</th>${ROLES_DEF.map(r=>`<th style="text-align:center">${r.label}</th>`).join('')}</tr></thead>
      <tbody>${permMatrixBody()}</tbody></table></div>
    <div class="small" style="margin-top:10px">圖例　<span class="pill" style="background:#FBEDED;color:#C0392B">—</span> 看不到　<span class="pill" style="background:#F4F7FB">查</span> 查看　<span class="pill" style="background:#E6F4EC">查建改</span> 可建立/修改　<span class="pill" style="background:#C9E7D4">查建改刪</span> 含刪除</div></div>`;
}

/* 授權矩陣表身：用「底色分區」取代原本重複 8 次「操作」／6 次「設定」的文字欄。
   配色沿用製程主檔那套（每區一色＋左側色條＋色塊標題），不另外發明視覺。
   注意：權限格本身已有 permColor 底色，所以分區色只上在「頁面」欄與標題列，避免撞色。 */
const PERM_GRPS=[
  ['op' ,'操作（日常作業）','#1C7A86','#E3F0F2'],
  ['set','設定 / 管理'    ,'#6A4C93','#EDE6F5'],
];
function permMatrixBody(){
  const span=1+ROLES_DEF.length;
  return PERM_GRPS.map(([g,lbl,color,bg])=>{
    const items=PAGES.filter(p=>(p.grp||'op')===g);
    if(!items.length) return '';
    const head=`<tr><td colspan="${span}" style="background:${bg};color:${color};font-weight:700;border-left:5px solid ${color}">${lbl}<span style="font-weight:400;font-size:11px;color:var(--muted)">　（${items.length} 頁）</span></td></tr>`;
    /* ★89 名單管理拆兩列顯示：登入帳號＝僅 admin；工牌名單＝admin＋主管(限自己廠區) */
    const rowHTML=(label,permOf,note)=>`<tr>
      <td style="white-space:nowrap;background:${bg};border-left:5px solid ${color};font-weight:600;color:${color}">${label}${note?`<span class="small muted" style="font-weight:400">　${note}</span>`:''}</td>
      ${ROLES_DEF.map(r=>{const p=permOf(r.key)||''; return `<td style="text-align:center;background:${permColor(p)}">${permLabel(p)}</td>`;}).join('')}
    </tr>`;
    const rows=items.map(pg=>{
      if(pg.id==='perm'){
        /* ★91 廠區管理員(sadmin) 兩列都可，但限自己廠區、不可授予 admin/sadmin */
        return rowHTML('⚙ 名單管理－權限設定', k=>k==='admin'?'vced':(k==='sadmin'?'vce':''), '設角色與可看範圍；集團內誰能進由 OMS 授權，外部廠商 MHR 自建')
             + rowHTML('⚙ 名單管理－工牌名單', k=>k==='admin'?'vced':((k==='sadmin'||k==='sup')?'vce':''), '廠區管理員／主管限自己廠區');
      }
      return rowHTML(`${pg.n?pg.n+' ':''}${esc(pg.label)}`, k=>(PERM[pg.id]||{})[k]);
    }).join('');
    return head+rows;
  }).join('');
}

/* 開啟編輯/新增表單 */
function editUser(email,isNew){
  if(isNew){
    const o=OMS_USERS.find(u=>u.email===email);
    window._editUser={email:email||'',name:o?(o.name||''):'',isNew:true,fromOms:!!o,
      account_type:'site',mhr_role:'view',mhr_roles:['view'],site_codes:[],bu_codes:[],
      source:o?'oms':'mhr'};
  } else {
    const p=MHR_USERS.find(u=>u.email===email); if(!p) return;
    window._editUser=Object.assign({},p,{isNew:false});
  }
  render(); if(window.scrollTo) window.scrollTo(0,0);
}
async function saveUser(){
  const eu=window._editUser; if(!eu) return;
  const email=($('#u_email').value||'').trim();
  const name=($('#u_name').value||'').trim();
  if(!email) return toast('請填 Email','err');
  const sc=readScope();
  if(sc.account_type==='site' && !sc.site_codes.length && !sc.bu_codes.length)
    return toast('廠區級要至少勾一個廠區或事業群（或勾「★全部廠區」），否則他登入後看不到任何資料','err');
  if(sc.account_type==='vendor' && !sc.vendor_code) return toast('請選委外廠商','err');
  const payload=Object.assign({email,name},sc,{source:eu.source||'mhr'});
  if(eu.isNew) payload.password=DEFAULT_PWD;
  toast('處理中…');
  const r=await mhrAdmin(eu.isNew?'create':'update',payload);
  if(!r.ok) return toast(r.error||'失敗','err');
  toast(r.message||'已儲存','ok');
  window._editUser=null;
  await loadMhrUsers(); render();
}
async function resetPwd(email){
  if(!confirm('確定重設「'+email+'」的密碼為 '+DEFAULT_PWD+' ？\n\n⚠ 密碼與 QMS 共用 → 這會同時改掉他的 QMS 密碼。\n他下次登入任一系統時會被要求更換。')) return;
  const r=await mhrAdmin('resetPassword',{email,password:DEFAULT_PWD});
  if(!r.ok) return toast(r.error||'失敗','err');
  toast(r.message||'已重設','ok'); await loadMhrUsers(); render();
}
async function revokeUser(email){
  if(!confirm('移除「'+email+'」的 MHR 權限？\n\n他將無法登入 MHR，但帳號本身保留（QMS 等其他系統不受影響）。')) return;
  const r=await mhrAdmin('revoke',{email});
  if(!r.ok) return toast(r.error||'失敗','err');
  toast(r.message||'已移除','ok'); await loadMhrUsers(); render();
}

  // 篩選：廠區 ∧ 製程（先篩再分組）
  const fset=machs.map((m,i)=>({m,i})).filter(x=>!pflt||(x.m.proc||[]).includes(pflt));

  /* 85-5 頁內 scoped 緊縮（照製程主檔 .pm 先例）：卡片/欄距/輸入框/列高全面壓，不影響其他頁 */

}

/* ★93 批號流水修正：同機台+同日+同班「且同料號」＝同一批（沿用）；
   換了料號（例如換模）＝新的一批，流水號遞增 _02、_03…

function genLot(model,machine,shift,partNo,pdate){
  const ymd=pdate? String(pdate).replace(/-/g,'').slice(2) : todayYMD();
  const base=String(model||'NA').replace(/\s+/g,'')+'_'+ymd+'_'+shiftCode(shift)+'_'+String(machine||'').replace(/[^A-Za-z0-9]/g,'')+'_';
  const sameBase=db.data.containers.filter(c=>c.lot&&c.lot.indexOf(base)===0);
  if(partNo){
    const same=sameBase.find(c=>c.partNo===partNo);
    if(same) return same.lot;                       // 同料號 → 沿用原批號
    const used=new Set(sameBase.map(c=>c.lot));     // 換料號 → 找下一個沒用過的流水
    for(let n=1;n<=99;n++){ const cand=base+String(n).padStart(2,'0'); if(!used.has(cand)) return cand; }
    return base+'99';
  }
  if(sameBase.length) return sameBase[0].lot;
  return base+'01'; }

  fetch('http://127.0.0.1:8890/jobs?q=__ping__&org='+encodeURIComponent(org)+'&cls=',{cache:'no-store'})
    .then(r=>r.json()).then(()=>{ el.innerHTML='<span style="color:#1f8a4c;font-weight:600">🟢 已連線 ERP 橋樑，可直接查</span>　<button class="btn ghost sm" onclick="erpPing()">🔄 重測</button>'; })
    .catch(()=>{ el.innerHTML='<span style="color:var(--red);font-weight:600">🔴 未連線</span> <span class="muted small">本機 ERP 橋樑未啟動 → 請啟動 erp_bridge.ps1 後點「重新連線」</span> <button class="btn ghost sm" onclick="erpPing()">🔄 重新連線</button>'; });
}
function erpQuery(){

  const org=($('#erp_org')?$('#erp_org').value:'850');
  const cls=($('#erp_cls')?$('#erp_cls').value:'');
  out.innerHTML='<div class="muted small">查詢中…</div>';
  fetch('http://127.0.0.1:8890/jobs?q='+encodeURIComponent(q)+'&org='+encodeURIComponent(org)+'&cls='+encodeURIComponent(cls)).then(r=>r.json()).then(d=>{
    if(!d.ok){ out.innerHTML='<div class="note" style="border-color:var(--red);background:var(--redbg)">ERP 回應錯誤：'+esc(d.error||'')+'</div>'; return; }

    out.innerHTML='<div class="step">共 <b>'+d.count+'</b> 筆有效工單（Released）　<button class="btn sm" onclick="erpUseSelected()">＋ 取用勾選的</button></div><div style="overflow-x:auto"><table><thead><tr><th><input type="checkbox" title="全選" onclick="document.querySelectorAll(\'.erpck\').forEach(c=>c.checked=this.checked)"></th><th>開單日</th><th>工單號</th><th>類別</th><th>料號</th><th>品名</th><th>工單數量</th><th>未完成</th><th>對應機種</th><th></th></tr></thead><tbody>'+
      d.jobs.map((j,i)=>{ const rp=erpResolvePartNo(j.itemNo); return `<tr><td><input type="checkbox" class="erpck" value="${i}"></td><td class="small">${esc(j.creationDate)}</td><td class="mono">${esc(j.jobNo)}</td><td>${erpClsPill(j.classCode)}</td><td class="mono small">${esc(j.itemNo)}</td><td class="small">${esc(j.itemDesc)}</td><td>${esc(j.startQty)}</td><td><b style="color:var(--teal)">${esc(j.remainQty)}</b></td><td>${rp?'<span class="pill dc">'+esc((prodOf(rp)||{}).model||rp)+'</span>':'<span class="pill" style="background:#fef0dd;color:#b9760f">待對應</span>'}</td><td><button class="btn ghost sm" onclick="erpUse(${i})">取用</button></td></tr>`; }).join('')+
      '</tbody></table></div>';
  }).catch(e=>{ out.innerHTML='<div class="note" style="border-color:var(--red);background:var(--redbg)">連不到本機 ERP 橋樑，請先啟動 <b>erp_bridge.ps1</b>。<br><span class="small muted">'+esc(String(e))+'</span></div>'; });

function erpResolvePartNo(itemNo){ if(!itemNo) return null; const ps=db.data.products; const up=itemNo.toUpperCase();
  for(const p of ps){ if(p.partNo===itemNo) return p.partNo; }
  for(const p of ps){ if(pnoOf(p.partNo)===itemNo) return p.partNo; }
  for(const p of ps){ if(p.stages&&Object.values(p.stages).some(v=>v===itemNo)) return p.partNo; }
  for(const p of ps){ if(p.model&&up.indexOf(p.model.toUpperCase())>=0) return p.partNo; }
  return null;
}
function erpMakeRec(j){ const rp=erpResolvePartNo(j.itemNo); return { no:j.jobNo, date:j.creationDate||'', customer:'', partNo:rp||j.itemNo, qty:+j.startQty||0, unit:'PCS', dueDate:j.dueDate||'',
    note:'ERP'+(erpClsName(j.classCode)?'·'+erpClsName(j.classCode):'')+'：未完成 '+j.remainQty+' / '+j.startQty+(rp?'':'（機種待對應）'), status:'進行中', source:'erp',
    erp:{orgId:j.orgId,classCode:j.classCode,classDesc:j.classDesc,classType:erpClsName(j.classCode),itemNo:j.itemNo,itemDesc:j.itemDesc,startQty:j.startQty,remainQty:j.remainQty,completedQty:j.completedQty,status:j.status}, createdAt:new Date().toISOString() }; }
/* ★86 ERP 取用改寫雲端：有同號單=PATCH（ERP 最新資料覆蓋）、無=POST（source='erp'；RLS 允許所有登入者寫 erp 來源）*/
async function erpUpsertDb(rec){ const ex=getOrders().find(x=>x.no===rec.no);
  if(ex&&ex._uuid){ const r=await sbWrite('PATCH','mhr_orders?id=eq.'+encodeURIComponent(ex._uuid),ordRow(rec)); return {mode:'upd',ok:r.ok,error:r.error}; }
  const r=await sbWrite('POST','mhr_orders',ordRow(rec)); return {mode:'add',ok:r.ok,error:r.error}; }
async function erpUse(i){ const j=(window._erpJobs||[])[i]; if(!j) return; if(!can('order','c')) return toast('目前角色無法建單','err');
  const rec=erpMakeRec(j);
  if(getOrders().some(x=>x.no===rec.no) && !confirm('工單 '+rec.no+' 已存在，要以 ERP 最新資料更新嗎？')) return;
  const u=await erpUpsertDb(rec); if(!u.ok) return toast(u.error||'取用失敗','err');
  await loadOrders();
  if($('#c_order')){ // 在建箱頁：刷新工單下拉並自動帶入剛取用的工單（即時、不過期）
    if($('#c_fcust'))$('#c_fcust').value=''; if($('#c_fpn'))$('#c_fpn').value='';
    $('#c_order').innerHTML=orderOptsF('',''); $('#c_order').value=String(getOrders().findIndex(x=>x.no===rec.no)); pickOrder();
    toast('已取用 '+rec.no+'，已帶入下方建箱（已存雲端）','ok');
  } else { render(); toast('已取用工單 '+rec.no+'（已存雲端）','ok'); }
}
async function erpUseSelected(){ if(!can('order','c')) return toast('目前角色無法建單','err');
  const ix=[...document.querySelectorAll('.erpck:checked')].map(c=>+c.value);
  if(!ix.length) return toast('請先勾選工單','err');
  let add=0,upd=0,fail=0;
  for(const i of ix){ const j=(window._erpJobs||[])[i]; if(!j) continue; const u=await erpUpsertDb(erpMakeRec(j));
    if(!u.ok){ fail++; continue; } if(u.mode==='add')add++; else upd++; }
  await loadOrders();
  const msg='已取用 '+(add+upd)+' 筆（新增 '+add+' / 更新 '+upd+(fail?' / 失敗 '+fail:'')+'）';
  if($('#c_order')){ if($('#c_fcust'))$('#c_fcust').value=''; if($('#c_fpn'))$('#c_fpn').value=''; $('#c_order').innerHTML=orderOptsF('',''); $('#c_order').value=''; pickOrder(); toast(msg+'，請於下方選工單建箱','ok'); }
  else { render(); toast(msg,'ok'); }
}
async function addOrder(){ const no=$('#od_no').value.trim(); if(!no) return toast('請輸入工單號','err'); const pn=$('#od_pn').value; if(!pn) return toast('請選機種','err'); if((+$('#od_qty').value||0)<=0) return toast('請輸入數量','err');

/* ★92 作廢生產指令單（內控原則：單據可作廢、不給任意刪單。記錄保留、不可再引用建箱） */
async function voidOrder(i){ const o=getOrders()[i]; if(!o||!o._uuid) return;
  if(o.voidAt){ if(!confirm('取消作廢「'+o.no+' ｜ '+o.partNo+'」？\n\n恢復後可再引用建箱。')) return;
    const r=await sbWrite('PATCH','mhr_orders?id=eq.'+encodeURIComponent(o._uuid),{void_at:null,void_by:null,void_note:null,updated_at:new Date().toISOString()});
    if(!r.ok) return toast(r.error||'失敗','err');
    o.voidAt=null; o.voidBy=''; o.voidNote=''; toast('已恢復','ok'); render(); return; }
  const why=prompt('作廢生產指令單「'+o.no+' ｜ '+o.partNo+'」\n\n記錄會保留（可查詢、可恢復），但不能再引用建箱。\n請輸入作廢原因：','');
  if(why===null) return;
  const me=((getSession()||{}).profile||{}).email||'';
  const r=await sbWrite('PATCH','mhr_orders?id=eq.'+encodeURIComponent(o._uuid),
    {void_at:new Date().toISOString(),void_by:me,void_note:why||null,updated_at:new Date().toISOString()});
  if(!r.ok) return toast(r.error||'作廢失敗','err');
  o.voidAt=new Date().toISOString(); o.voidBy=me; o.voidNote=why||'';
  toast('已作廢（記錄保留）','ok'); render(); }

function updFirst(){ const pn=$('#c_pn')?$('#c_pn').value:''; const p=pn?prodOf(pn):null;

function c128svg(txt){

  const vals=[104]; for(const ch of txt) vals.push(ch.charCodeAt(0)-32);
  let ck=104; for(let i=1;i<vals.length;i++) ck+=vals[i]*i; vals.push(ck%103,106);
  let bars=''; vals.forEach(v=>bars+=C128[v]);

/* ===== 84-11 全頁掃碼攔截（keyboard wedge）：保證掃描槍資料一定被系統接收 =====
   掃描槍＝高速鍵盤（字元間隔極短＋結尾 Enter）。若焦點不在任何輸入框，掃出的字元原本會流失；
   這裡在 接收點交／過站報工 兩頁全頁監聽：偵測高速字串+Enter → 自動導入箱號欄並觸發加入/帶出。
   焦點在輸入框內時不攔截（照常打字/原生 Enter 流程）。 */
let _scanBuf='',_scanT=0;
document.addEventListener('keydown',function(e){
  try{
    const ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return;   // 欄位內＝原生流程
    if(typeof cur==='undefined'||(cur!=='receive'&&cur!=='report')) return;
    const now=Date.now(); if(now-_scanT>80) _scanBuf=''; _scanT=now;   // 字元間隔>80ms＝人手打字，重置
    if(e.key==='Enter'){
      if(_scanBuf.length>=6){ const code=_scanBuf; _scanBuf='';
        if(cur==='receive'){ const c0=findC(code); if(c0&&needStockin(c0)){ const s=$('#sk_cid'); if(s){ s.value=code; skAdd(); } } else { const i=$('#rv_cid'); if(i){ i.value=code; rvAdd(); } } }   /* ★97 掃碼自動分流：待入庫→🅐、其餘→🅑 */
        else { repScanAdd(code); }   /* ★97-2 過站打單：掃箱＝直接選取 */
        e.preventDefault(); }
      return; }
    if(e.key&&e.key.length===1) _scanBuf+=e.key;
  }catch(err){}
});

function backlogBoxes(nx){ return db.data.containers.filter(x=>isNormalBox(x)&&x.processCode===nx&&remaining(x.cid)>0).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))); }

/* ═══════════ ★97-2 過站打單重構（使用者定案：點交＝料已到站，免領料程序；與 02 首站打單同構） ═══════════
   規則（使用者提案＋我定的預設）：選「已點交到本站」的箱（多選/掃碼）→ 填完成數 → 打單。
   完成數＝選箱合計（最常見，預填）；少於合計＝餘量自動留在「最後一箱」（照選箱順序先進先出扣帳）；
   大於合計＝擋。sources 鏈/結存/⏳占用照舊。以下宣告覆蓋上面的舊版 renderReport/doReport（舊領料流程停用備查）。 */
window._rSel=[]; window._rSt='';
function repStations(){ return [...new Set(db.data.containers.filter(c=>isNormalBox(c)&&remaining(c.cid)>0&&isReceived(c)&&c.received.station).map(c=>c.received.station))]; }
function repBoxesAt(st){ return db.data.containers.filter(c=>isNormalBox(c)&&remaining(c.cid)>0&&isReceived(c)&&c.received.station===st); }
function repToggle(cid){ const c=findC(cid); if(!c) return;

async function doPaint(){
  /* ★97 出爐＝打單（總數必須＝入爐；斷軌集合占用來源）；OK拆紙箱/NR補噴/NG報廢 → 質控檢驗頁（mix 待驗單） */
  if(!window._pk.length) return toast('請至少選一個來源箱','err');
  const qty=+$('#pk_good').value||0;
  const inTot=window._pk.reduce((a,cid)=>a+remaining(cid),0);
  if(qty<=0) return toast('請填出爐總數','err');
  if(qty!==inTot) return toast(`出爐總數 ${qty} ≠ 入爐 ${inTot}（強制相等；OK/NR/NG 到質控檢驗頁分類）`,'err');
  // 出爐站：一般來源(BL等)→nextStation(=烤漆站)；補噴箱本身已在烤漆站→出爐回同站
  const firstNormal=window._pk.map(findC).find(c=>isNormalBox(c)); const firstAny=findC(window._pk[0]);
  const first=firstNormal||firstAny;
  const nx=firstNormal?nextStation(firstNormal.partNo,firstNormal.processCode):firstAny.processCode;
  if(!nx) return toast('無法判定出爐站','err');
  const op=($('#pk_op').value||'').trim();
  const inputDraws=window._pk.map(cid=>({cid,take:remaining(cid)}));
  if(!procNeedQc(nx)){
    /* 關站＝跳過質控段：出爐直接產一紙箱（要拆箱請開啟該站質控斷點） */
    const at=nowISO();
    const nc={cid:await nextCID(nx),partNo:first.partNo,name:first.name,lot:first.lot,orderNo:first.orderNo,processCode:nx,
      stagePartNo:stageNo(first.partNo,nx),qty,operator:op,qc:'',machine:'烤漆線',workType:'normal',pack:'carton',
      sources:inputDraws,pid:null,rush:((($('#pk_rush')||{}).checked)||undefined),createdAt:at};
    db.data.containers.push(nc);
    db.data.reports.push({id:'R'+Date.now(),partNo:first.partNo,lot:first.lot,orderNo:first.orderNo,fromStation:first.processCode,toStation:nx,
      draws:inputDraws,ok:qty,nr:0,ng:0,intoCid:nc.cid,nrCid:null,ngCid:null,shift:'',operator:op,qc:'',mix:true,createdAt:at});
    db.save(); rememberOp(op);
    toast('此站未啟用質控斷點：已直接產箱 '+nc.cid,'ok'); window._pk=[]; renderPaint();
    const re0=$('#pk_result'); if(re0) re0.innerHTML=`<div class="note">已產箱 <span class="badge">${esc(nc.cid)}</span>（${qty} pcs）</div>`;
    return;
  }
  const slip={pid:await nextPID(nx),partNo:first.partNo,name:first.name,lot:first.lot,orderNo:first.orderNo,
    processCode:nx,qtyProd:qty,operator:op,machine:'烤漆線',shift:'',team:'',mold:'',cavity:'',jigs:[],
    draws:inputDraws,pdate:null,status:'pending',qc:'',qmsNo:'',boxCids:[],mix:true,fromStation:first.processCode,rush:((($('#pk_rush')||{}).checked)||undefined),createdAt:nowISO()};
  db.data.pending.push(slip);
  db.save(); rememberOp(op);
  toast('已打單 '+slip.pid+'（出爐 '+qty+'，待質控分類）','ok');
  window._pk=[]; renderPaint();
  const re=$('#pk_result'); if(re) re.innerHTML=`<div class="note" style="border-color:var(--teal)">🧾 待驗單 <b class="mono">${esc(slip.pid)}</b>｜入爐 ${inTot} → 出爐 <b>${qty}</b><br><span class="small muted">「質控檢驗」驗完＝OK 拆紙箱／NR 補噴箱／NG 報廢＋印標</span></div>`;
}

/* ---------- ★97 質控檢驗（質控斷點核心）：待驗單 → QMS 單號＋OK/NR/NG → 產箱＋印標 ----------
   僅質控職能(qc)＋admin 能輸入（PERM qcinsp 'e'）；其他角色唯讀。操作人＝登入者（質控一人一帳）。
   產箱＝原 建箱/報工/烤漆 分箱邏輯搬到這裡：首站(無draws)=chunks 分箱；後段=splitDraws＋併箱＋PK 紙箱；
   烤漆(mix)=紙箱拆分＋NR 補噴箱。完成時寫「報工記錄」→ 總覽/追溯/良率統計自動涵蓋（含首站不良！）。 */
function isAdminNow(){ const p=(getSession()||{}).profile||{}; return p.account_type==='admin'||p.mhr_role==='admin'||(p.mhr_roles||[]).includes('admin'); }
function canQcInsp(){ return can('qcinsp','e'); }
function canVoidPending(){ const p=(getSession()||{}).profile||{}; const rs=[].concat(p.mhr_roles||[],p.mhr_role||[]);
  return p.account_type==='admin'||rs.includes('admin')||rs.includes('sup'); }
/* ★97 從 07/00/01 跳質控檢驗頁並自動套篩選（使用者要求：待質控數字可點回質控頁） */

  const pick=window._qiPick?findP(window._qiPick):null;
  $('#view').innerHTML=`

    </div>
    ${list.length?`<div style="overflow-x:auto"><table><thead><tr><th>待驗單號</th><th>站別</th><th>料號</th><th>批號</th><th>工單</th><th style="text-align:right">生產數</th><th>打單時間</th><th>狀態</th><th></th></tr></thead><tbody>${

        const trAttr=clickable?` style="cursor:pointer${window._qiPick===p.pid?';background:#eef6f8':''}" onclick="window._qiPick='${esc(p.pid)}';render()"`

        <td class="mono small">${esc(p.lot||'')}</td><td class="mono small">${esc(p.orderNo||'')}</td>
        <td style="text-align:right"><b>${p.qtyProd}</b></td><td class="small muted">${esc(String(p.createdAt||'').slice(5,16).replace('T',' '))}</td>
        <td>${pendStatusPill(p)}</td>
        <td style="white-space:nowrap">${p.status==='pending'?`${canQcInsp()?`<button class="btn sm" onclick="event.stopPropagation();window._qiPick='${esc(p.pid)}';render()">${L('選單')}</button> `:''}${canVoidPending()?`<button class="btn ghost sm" onclick="event.stopPropagation();voidPending('${esc(p.pid)}')">${L('作廢')}</button>`:''}`
          :p.status==='void'?(isAdminNow()?`<button class="btn ghost sm" onclick="voidPending('${esc(p.pid)}')">↩ ${L('恢復')}</button>`:'')
          :`<button class="btn ghost sm" onclick="event.stopPropagation();qcViewDone('${esc(p.pid)}')">🔍 ${L('檢驗記錄')}</button>`}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="small muted" style="margin-top:4px">💡 點「整列」即選單開檢驗表單（表單在清單下方）</div>
      ${list.length>80?'<div class="small muted">僅列最近 80 筆，請用站別/狀態縮小範圍</div>':''}`
    :'<div class="empty">此篩選沒有待驗單</div>'}
  </div>
  ${(pick&&pick.status==='pending'&&canQcInsp())?qcFormHTML(pick):''}
  <div id="qi_result" style="margin-top:12px"></div>`;
  if(pick&&pick.status==='pending'&&canQcInsp()){ const f=$('#qi_form'); if(f) setTimeout(()=>f.scrollIntoView({behavior:'smooth',block:'start'}),50); }   /* ★選單後自動捲到檢驗表單（窄螢幕表單在清單下方看不到） */
}
function qcFormHTML(p){
  const hasDraws=(p.draws||[]).length>0;
  const appendable=hasDraws?db.data.containers.filter(c=>isNormalBox(c)&&c.partNo===p.partNo&&c.processCode===p.processCode&&drawnOut(c.cid)===0&&c.cid!==p.pid):[];
  const appOpts='<option value="">— 開新箱 —</option>'+appendable.map(c=>`<option value="${esc(c.cid)}">併入 ${esc(c.cid)}（現 ${c.qty}）</option>`).join('');
  return `<div class="card" id="qi_form" style="border:2px solid var(--teal)"><h3>② ${L('檢驗結果')} — <span class="mono">${esc(p.pid)}</span></h3>
    <div class="step">料號 <span class="mono">${esc(p.partNo||'')}</span>${p.name?'（'+esc(p.name)+'）':''}｜批號 <span class="mono">${esc(p.lot||'')}</span>｜工單 <span class="mono">${esc(p.orderNo||'')}</span>｜生產數 <b>${p.qtyProd}</b>${p.operator?'｜作業員 '+esc(p.operator):''}${p.machine?'｜設備 '+esc(p.machine):''}${p.mix?'｜<b style="color:#b9760f">烤漆混批（OK 拆紙箱／NR 補噴箱）</b>':''}</div>
    <div class="step" style="background:#f6f6f3">📦 <b>來源箱</b>（要驗的實體料）：${(p.draws||[]).length?(p.draws||[]).map(d=>`<span class="badge" style="cursor:pointer" onclick="traceBox('${esc(d.cid)}')" title="點看此箱追溯">${esc(d.cid)}</span> <b>${d.take}</b> pcs`).join('　'):'<span class="muted">首站生產（無來源箱，料自壓鑄機）</span>'}</div>
    <div class="grid g3" style="margin-top:8px">
      <div><label>QMS 檢驗單號 <span class="vi">（QMS 串接後自動帶入；過渡期手輸，可空）</span></label><input id="qi_qms" class="mono" value="${esc(p.qmsNo||'')}" placeholder="如 FAI-…／IPQC-…"></div>
      <div><label>每箱裝入 <span class="vi">（OK 分箱${p.mix?'，混批出爐必填':'；不填＝一箱'}）</span></label><input id="qi_per" type="number" placeholder="如 50"></div>
      ${hasDraws&&!p.mix?`<div><label>${L('產出去向')}</label><select id="qi_into">${appOpts}</select></div>`:''}
    </div>
    <div class="grid g3" style="margin-top:4px">
      <div><label>OK（良品）<span style="color:var(--red)">*</span></label><input id="qi_ok" type="number" value="" oninput="qiSum()"></div>
      <div><label>NR 可重工</label><input id="qi_nr" type="number" value="0" oninput="qiSum()"></div>
      <div><label>NG 報廢</label><input id="qi_ng" type="number" value="0" oninput="qiSum()"></div>
    </div>
    <div id="qi_sum" class="small" style="margin-top:6px;color:var(--muted)">合計 0 ／ 生產數 ${p.qtyProd}（必須相等）</div>
